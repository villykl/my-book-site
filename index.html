<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Вера Климошенко — Слова это следы души</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  background: radial-gradient(circle, #0a0a0a, #000);
  font-family: Georgia, serif;
  color: white;
  overflow: hidden;
}

/* ОБЛОЖКА */
.cover {
  position: absolute;
  width: 300px;
  height: 420px;
  background: linear-gradient(145deg, #1a1a1a, #000);
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  cursor: pointer;
  transition: transform 1s;
  box-shadow: 0 20px 50px rgba(0,0,0,0.8);
}

.cover.open {
  transform: translate(-150%, -50%) rotateY(-40deg);
}

.cover h1 {
  font-size: 22px;
}

.cover p {
  opacity: 0.6;
}

/* КНИГА */
.book {
  position: absolute;
  width: 320px;
  height: 420px;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  display: none;
  background: #f4f1ea;
  color: #222;
  padding: 20px;
  border-radius: 8px;
}

/* КНОПКИ */
.nav {
  position: fixed;
  bottom: 0;
  width: 100%;
  display: none;
  justify-content: space-around;
  background: rgba(0,0,0,0.9);
  padding: 10px 0;
}

.nav button {
  background: none;
  border: none;
  color: white;
}

/* СТИХ */
.poem {
  line-height: 1.7;
  font-style: italic;
}
</style>
</head>

<body>

<!-- ОБЛОЖКА -->
<div class="cover" id="cover" onclick="openBook()">
  <div>
    <h1>Слова — это следы души</h1>
    <p>Вера Климошенко</p>
    <br>
    <small>Нажми, чтобы открыть</small>
  </div>
</div>

<!-- КНИГА -->
<div class="book" id="book"></div>

<!-- НАВИГАЦИЯ -->
<div class="nav" id="nav">
  <button onclick="show('home')">📕</button>
  <button onclick="show('poems')">✍️</button>
  <button onclick="show('stories')">📖</button>
  <button onclick="show('about')">👤</button>
</div>

<script>
function openBook() {
  document.getElementById("cover").classList.add("open");

  setTimeout(() => {
    document.getElementById("cover").style.display = "none";
    document.getElementById("book").style.display = "block";
    document.getElementById("nav").style.display = "flex";
    show("home");
  }, 800);
}

function show(section) {

  let html = "";

  if (section === "home") {
    html = `
      <h2>Добро пожаловать</h2>
      <p>Это книга чувств, мыслей и тишины между словами.</p>
    `;
  }

  if (section === "poems") {
    html = `
      <div class="poem">
      Тишина говорит со мной,<br>
      Словно ветер в пустом окне...<br><br>
      И я снова ищу покой,<br>
      Но он прячется где-то во мне.
      </div>
    `;
  }

  if (section === "stories") {
    html = `
      <p>Однажды ночью город молчал...</p>
    `;
  }

  if (section === "about") {
    html = `
      <p>Автор: Вера Климошенко</p>
      <p>Я пишу о чувствах, которые невозможно удержать внутри.</p>
    `;
  }

  document.getElementById("book").innerHTML = html;
}
</script>

</body>
</html>
