<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Вера Климошенко — Автор</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin:0;
  font-family: Georgia, serif;
  background:#fdfbf7;
  color:#222;
}

.dark {
  background:#111;
  color:#eee;
}

/* КОНТЕЙНЕР */
.container {
  max-width:680px;
  margin:auto;
  padding:30px 20px;
}

/* ТЕКСТ */
h1,h2 {
  text-align:center;
}

p {
  font-size:20px;
  line-height:1.9;
  text-align:justify;
  text-indent:2em;
}

/* КНОПКИ */
button {
  padding:10px;
  margin:5px;
}

/* НИЖНЯЯ ПАНЕЛЬ */
.controls {
  position:fixed;
  bottom:10px;
  width:100%;
  display:flex;
  justify-content:space-around;
}

/* ПРОГРЕСС */
.progress {
  position:fixed;
  top:0;
  left:0;
  height:4px;
  background:black;
  width:0%;
}

.dark .progress {
  background:white;
}

/* АВТОР */
.author {
  text-align:center;
  margin-top:40px;
}

.author img {
  width:120px;
  border-radius:50%;
}
</style>
</head>

<body>

<div class="progress" id="progress"></div>

<div class="container" id="app"></div>

<div class="controls">
  <button onclick="prev()">⬅️</button>
  <button onclick="toggleTheme()">🌙</button>
  <button onclick="downloadPDF()">📄</button>
  <button onclick="next()">➡️</button>
</div>

<script>

/* СОСТОЯНИЕ */
let state = {
  screen: localStorage.getItem("screen") || "books",
  book: parseInt(localStorage.getItem("book")) || 0,
  chapter: parseInt(localStorage.getItem("chapter")) || 0,
  page: parseInt(localStorage.getItem("page")) || 0
};

/* ТЕКСТЫ */
let texts = [
{
title:"Слова — это следы души",
content:`
А ты пойдёшь с нами, Господи?

Этот день я вспоминаю всегда...

Прямого поезда не было...

Мы шли по льду...

Мы успели. Слава Богу.
`
}
];

/* АВТО ГЛАВЫ */
function splitChapters(text){
  return text.split("\n\n").filter(t=>t.trim());
}

/* АВТО СТРАНИЦЫ */
function splitPages(paragraphs){
  let pages=[],page="";
  paragraphs.forEach(p=>{
    let block=`<p>${p}</p>`;
    if((page+block).length>1200){
      pages.push(page);
      page=block;
    } else page+=block;
  });
  if(page) pages.push(page);
  return pages;
}

/* СОЗДАНИЕ */
let books = texts.map(t=>{
  let chapters=splitChapters(t.content);
  return {
    title:t.title,
    chapters:chapters.map(ch=>({
      title:ch.slice(0,40),
      pages:splitPages(ch.split("\n"))
    }))
  };
});

/* ЭКРАНЫ */
function showBooks(){
  app.innerHTML="<h1>📚 Книги</h1>";
  books.forEach((b,i)=>{
    app.innerHTML+=`<button onclick="openBook(${i})">${b.title}</button>`;
  });

  app.innerHTML+=`
  <div class="author">
  <h3>Вера Климошенко</h3>
  <img src="https://i.postimg.cc/8z0t9b2T/author.jpg">
  </div>`;
}

function openBook(i){
  state.book=i;
  state.screen="chapters";
  save(); showChapters();
}

function showChapters(){
  let b=books[state.book];
  app.innerHTML=`<h1>${b.title}</h1>`;
  b.chapters.forEach((c,i)=>{
    app.innerHTML+=`<button onclick="openChapter(${i})">${c.title}</button>`;
  });
}

function openChapter(i){
  state.chapter=i;
  state.page=0;
  state.screen="read";
  save(); render();
}

/* ЧТЕНИЕ */
function render(){
  if(state.screen==="books") return showBooks();
  if(state.screen==="chapters") return showChapters();

  let pages=books[state.book].chapters[state.chapter].pages;
  let page=pages[state.page];

  app.innerHTML=page+`<p style="text-align:center;opacity:0.5;">
  ${state.page+1} / ${pages.length}
  </p>`;

  updateProgress(pages.length);
}

/* ПРОГРЕСС */
function updateProgress(total){
  let percent=(state.page+1)/total*100;
  document.getElementById("progress").style.width=percent+"%";
}

/* НАВИГАЦИЯ */
function next(){
  if(state.screen!=="read") return;
  let p=books[state.book].chapters[state.chapter].pages;
  if(state.page<p.length-1) state.page++;
  save(); render();
}

function prev(){
  if(state.screen==="read"){
    if(state.page>0) state.page--;
    else state.screen="chapters";
  } else if(state.screen==="chapters"){
    state.screen="books";
  }
  save(); render();
}

/* PDF */
function downloadPDF(){
  window.print();
}

/* ТЕМА */
function toggleTheme(){
  document.body.classList.toggle("dark");
}

/* SAVE */
function save(){
  localStorage.setItem("screen",state.screen);
  localStorage.setItem("book",state.book);
  localStorage.setItem("chapter",state.chapter);
  localStorage.setItem("page",state.page);
}

/* START */
window.onload=render;

</script>

</body>
</html>
