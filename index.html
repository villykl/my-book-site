<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book App Fixed</title>

<style>
body{
  margin:0;
  font-family: Georgia, serif;
  background:#0b0b0b;
  overflow:hidden;
}

/* ===== COVER ===== */
#cover{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:#3a2215;
  color:#f3e3d0;
  z-index:10;
}

#cover button{
  margin-top:20px;
  padding:12px 18px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

/* ===== BOOK ===== */
#book{
  display:none;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  color:white;
  text-align:center;
}

.page{
  width:60%;
  max-width:600px;
  background:#f6f1e3;
  color:#111;
  padding:30px;
  margin:10px;
  border-radius:10px;
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
}

/* UI */
.ui{
  position:fixed;
  bottom:20px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:10px;
}

button{
  padding:10px 14px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:white;
  font-weight:bold;
}
</style>
</head>

<body>

<!-- 📖 COVER -->
<div id="cover">
  <h1>Слова — следы души</h1>
  <button onclick="startBook()">Открыть книгу</button>
</div>

<!-- 📚 BOOK -->
<div id="book">

  <div class="page">
    <h1>Глава 1</h1>
    <p>Книга теперь не загружается заранее — только после открытия.</p>
  </div>

  <div class="page">
    <h1>Глава 2</h1>
    <p>GitHub Pages больше не ломает структуру.</p>
  </div>

  <div class="page">
    <h1>Глава 3</h1>
    <p>Это стабильная версия без багов с #hash.</p>
  </div>

</div>

<!-- UI -->
<div class="ui">
  <button onclick="next()">➡ Next</button>
  <button onclick="reset()">🔄 Reset</button>
</div>

<script>

let index = 0;
const pages = document.querySelectorAll(".page");

/* 🚪 START APP */
function startBook(){
  document.getElementById("cover").style.display = "none";
  document.getElementById("book").style.display = "flex";
}

/* 📄 NEXT PAGE */
function next(){
  if(index < pages.length){
    pages[index].style.transform = "scale(1.02)";
    pages[index].style.opacity = "0.5";
    index++;
  }
}

/* 🔄 RESET */
function reset(){
  pages.forEach(p=>{
    p.style.transform = "scale(1)";
    p.style.opacity = "1";
  });
  index = 0;
}

/* 🚫 BLOCK HASH BUGS */
if(window.location.hash){
  history.replaceState(null,null," ");
}

window.addEventListener("hashchange", ()=>{
  history.replaceState(null,null," ");
});

</script>

</body>
</html>
