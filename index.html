<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOD MODE 2.0 BOOK</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background: radial-gradient(circle at center, #0a0a0a, #000);
  font-family: Georgia, serif;
}

/* ===== 3D STAGE ===== */
.stage{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  perspective:2500px;
}

/* ===== BOOK 3D OBJECT ===== */
.book{
  width:800px;
  height:500px;
  position:relative;
  transform-style:preserve-3d;
  transform: rotateY(0deg) rotateX(5deg);
  transition: transform 0.2s linear;
}

/* spine */
.book::before{
  content:"";
  position:absolute;
  width:26px;
  height:100%;
  left:50%;
  transform:translateX(-50%);
  background:linear-gradient(#111,#000,#111);
  box-shadow:0 0 40px rgba(0,0,0,0.8);
  z-index:0;
}

/* ===== COVER ===== */
.cover{
  position:absolute;
  width:50%;
  height:100%;
  left:50%;
  transform-origin:left;
  background:url('https://images.unsplash.com/photo-1524995997946-a1c2e315a42f') center/cover;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:32px;
  text-shadow:0 10px 40px black;
  box-shadow:0 60px 120px rgba(0,0,0,0.8);
  transition:transform 1.2s cubic-bezier(.2,.8,.2,1);
  z-index:10;
}

.book.open .cover{
  transform: rotateY(-180deg);
}

/* ===== PAGES ===== */
.page{
  position:absolute;
  width:50%;
  height:100%;
  left:50%;
  transform-origin:left;
  background:#f6f1e3;
  box-shadow:0 30px 80px rgba(0,0,0,0.6);
  padding:45px;
  box-sizing:border-box;
  transition:transform 1s cubic-bezier(.77,0,.18,1);
  overflow:hidden;
}

/* depth stacking */
.page:nth-child(2){ z-index:5; }
.page:nth-child(3){ z-index:4; }
.page:nth-child(4){ z-index:3; }
.page:nth-child(5){ z-index:2; }

/* flip */
.page.flipped{
  transform: rotateY(-180deg);
}

/* paper shading */
.page::after{
  content:"";
  position:absolute;
  top:0;
  right:0;
  width:25px;
  height:100%;
  background:linear-gradient(to left, rgba(0,0,0,0.15), transparent);
}

/* text */
h1{
  text-align:center;
  font-size:26px;
}

p{
  font-size:17px;
  line-height:1.8;
}

/* ===== LIGHT SOURCE ===== */
.light{
  position:fixed;
  width:100%;
  height:100%;
  background: radial-gradient(circle at var(--x,50%) var(--y,50%), rgba(255,255,255,0.08), transparent 45%);
  pointer-events:none;
}

/* ===== UI ===== */
.ui{
  position:fixed;
  bottom:20px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:10px;
}

button{
  padding:10px 14px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:white;
  font-weight:bold;
}

/* glow floor */
.floorGlow{
  position:fixed;
  bottom:-200px;
  left:50%;
  transform:translateX(-50%);
  width:600px;
  height:600px;
  background:radial-gradient(circle, rgba(255,255,255,0.08), transparent 60%);
  filter:blur(40px);
}
</style>
</head>

<body>

<div class="light"></div>
<div class="floorGlow"></div>

<div class="stage">

  <div class="book" id="book">

    <div class="cover" onclick="openBook()">
      📖 GOD MODE 2.0
    </div>

    <div class="page">
      <h1>Глава 1</h1>
      <p>Это уже не сайт. Это цифровой объект с глубиной и физикой света.</p>
    </div>

    <div class="page">
      <h1>Глава 2</h1>
      <p>Страницы ведут себя как настоящая бумага в 3D пространстве.</p>
    </div>

    <div class="page">
      <h1>Глава 3</h1>
      <p>Книга реагирует на мышь, свайпы и клавиатуру.</p>
    </div>

  </div>
</div>

<!-- UI -->
<div class="ui">
  <button onclick="flip()">➡ Flip</button>
  <button onclick="resetBook()">🔄 Reset</button>
  <button onclick="autoMode()">🎬 Auto</button>
</div>

<script>
const book = document.getElementById("book");
const pages = document.querySelectorAll(".page");

let i = 0;
let auto = false;

/* OPEN */
function openBook(){
  book.classList.add("open");
}

/* FLIP */
function flip(){
  if(i < pages.length){
    pages[i].classList.add("flipped");
    i++;
  }
}

/* RESET */
function resetBook(){
  pages.forEach(p=>p.classList.remove("flipped"));
  book.classList.remove("open");
  i = 0;
}

/* AUTO MODE */
function autoMode(){
  if(auto) return;
  auto = true;

  let interval = setInterval(()=>{
    if(i < pages.length){
      flip();
    } else {
      clearInterval(interval);
      auto = false;
    }
  }, 1000);
}

/* ===== MOUSE 3D ROTATION ===== */
let rotX = 5;
let rotY = 0;

document.addEventListener("mousemove",(e)=>{
  let x = (e.clientX / window.innerWidth - 0.5) * 20;
  let y = (e.clientY / window.innerHeight - 0.5) * -15;

  rotY = x;
  rotX = 5 + y;

  book.style.transform = `rotateY(${rotY}deg) rotateX(${rotX}deg)`;

  document.documentElement.style.setProperty("--x", e.clientX+"px");
  document.documentElement.style.setProperty("--y", e.clientY+"px");
});

/* ===== TOUCH SWIPE ===== */
let startX = 0;

document.addEventListener("touchstart",(e)=>{
  startX = e.touches[0].clientX;
});

document.addEventListener("touchend",(e)=>{
  let endX = e.changedTouches[0].clientX;

  if(endX - startX > 40) resetBook();
  if(startX - endX > 40) flip();
});

/* keyboard */
document.addEventListener("keydown",(e)=>{
  if(e.key==="ArrowRight") flip();
  if(e.key==="ArrowLeft") resetBook();
  if(e.key===" ") autoMode();
});
</script>

</body>
</html>
