<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Book Site</title>

<style>
:root{
  --bg:#0f0f12;
  --text:#eee;
  --nav:rgba(0,0,0,0.6);
  --muted:#aaa;
  --shadow:rgba(0,0,0,0.5);
}

body.light{
  --bg:#f5f2ea;
  --text:#1a1a1a;
  --nav:rgba(255,255,255,0.7);
  --muted:#444;
  --shadow:rgba(0,0,0,0.2);
}

body{
  margin:0;
  font-family: Georgia, serif;
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
  transition:0.4s ease;
}

/* NAV */
.book-nav{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:60px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:20px;
  background:var(--nav);
  backdrop-filter: blur(10px);
  z-index:100;
}

.book-nav a{
  color:var(--muted);
  text-decoration:none;
  font-size:14px;
}

.toggle{
  position:absolute;
  right:20px;
  padding:6px 12px;
  border:1px solid var(--muted);
  border-radius:20px;
  cursor:pointer;
  background:transparent;
  color:var(--text);
}

/* BOOK STAGE */
.book{
  position:absolute;
  top:60px;
  left:0;
  width:100%;
  height:calc(100vh - 60px);
  perspective:2500px;
  overflow:hidden;
}

.page{
  position:absolute;
  width:100%;
  height:100%;
  padding:70px 25px;
  box-sizing:border-box;
  background:var(--bg);
  transform-origin:left;
  backface-visibility:hidden;
  transition: transform 0.9s cubic-bezier(.2,.8,.2,1), box-shadow 0.5s;
  box-shadow:0 0 40px var(--shadow);
}

.page h1{ font-size:32px; margin-bottom:20px; }
.page p{ max-width:700px; line-height:1.6; font-size:18px; }

/* STACK */
.page{ z-index:1; }
.page.active{ z-index:50; }

/* STATES */
.page.flipped{ transform: rotateY(-180deg); box-shadow:-20px 0 60px var(--shadow); }
.page.unflipped{ transform: rotateY(0deg); }

</style>
</head>
<body>

<div class="book-nav">
  <a href="#ch0" onclick="goTo(0)">Chapter 1</a>
  <a href="#ch1" onclick="goTo(1)">Chapter 2</a>
  <a href="#ch2" onclick="goTo(2)">Chapter 3</a>
  <button class="toggle" onclick="toggleTheme()">🌙 / ☀️</button>
</div>

<div class="book" id="book">
  <div class="page active" id="p0">
    <h1>Chapter 1</h1>
    <p>Your text here... This is the first chapter of your book.</p>
  </div>

  <div class="page" id="p1">
    <h1>Chapter 2</h1>
    <p>Your text here... This is the second chapter.</p>
  </div>

  <div class="page" id="p2">
    <h1>Chapter 3</h1>
    <p>Your text here... This is the third chapter.</p>
  </div>
</div>

<script>
let current = 0;
const pages = document.querySelectorAll('.page');

function render(){
  pages.forEach((p,i)=>{
    if(i < current){
      p.classList.add('flipped');
      p.classList.remove('active');
    } else if(i === current){
      p.classList.add('active');
      p.classList.remove('flipped');
    } else {
      p.classList.remove('active','flipped');
    }
  });
}

function goTo(index){
  animateTo(index);
}

/* SEQUENTIAL PAGE FLIP (Apple Books style) */
async function animateTo(target){
  if(target === current) return;

  let step = target > current ? 1 : -1;

  while(current !== target){
    current += step;
    render();
    await wait(450); // delay between flips
  }

  history.replaceState(null,null,'#ch'+current);
}

function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }

/* DRAG */
let startX = 0;
let dragging = false;

document.addEventListener('mousedown',e=>{
  dragging = true;
  startX = e.clientX;
});

document.addEventListener('mouseup',e=>{
  if(!dragging) return;
  dragging = false;

  let diff = e.clientX - startX;

  if(diff < -80 && current < pages.length-1){
    animateTo(current+1);
  }

  if(diff > 80 && current > 0){
    animateTo(current-1);
  }
});

/* TOUCH */
document.addEventListener('touchstart',e=>{
  startX = e.touches[0].clientX;
});

document.addEventListener('touchend',e=>{
  let diff = e.changedTouches[0].clientX - startX;

  if(diff < -80 && current < pages.length-1){
    animateTo(current+1);
  }

  if(diff > 80 && current > 0){
    animateTo(current-1);
  }
});

function toggleTheme(){
  document.body.classList.toggle('light');
  localStorage.setItem('theme', document.body.classList.contains('light') ? 'light' : 'dark');
}

window.addEventListener('load', async ()=>{
  const hash = location.hash.replace('#ch','');

  const saved = localStorage.getItem('theme');
  if(saved === 'light') document.body.classList.add('light');

  render();

  if(hash && !isNaN(hash)){
    let target = parseInt(hash);
    await wait(300);
    animateTo(target);
  }
});

</script>

</body>
</html>
