<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Слова — это следы души</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin:0;
  font-family: Georgia, serif;
  background:#fdfbf7;
  color:#222;
}

#app {
  max-width:700px;
  margin:auto;
  padding:20px;
}

h1, h2 {
  text-align:center;
}

.cover img {
  width:220px;
  display:block;
  margin:20px auto;
  border-radius:12px;
}

.menu {
  text-align:center;
  margin:20px 0;
}

.menu button {
  padding:10px;
  margin:5px;
  font-size:16px;
}

p {
  line-height:1.8;
  text-indent:2em;
  margin-bottom:20px;
}

.poem {
  text-indent:0;
  white-space:pre-line;
  text-align:center;
}
</style>
</head>

<body>

<div id="app"></div>

<script>

/* 📕 ОБЛОЖКА */
const COVER = "https://i.imgur.com/8QZ7Z8T.png";

/* 📚 КНИГА */
let book = [

{
  type: "cover"
},

{
  type: "menu",
  title: "Оглавление",
  items: [
    "Рассказ 1",
    "Стих 1"
  ]
},

{
  type: "story",
  title: "А ты пойдёшь с нами, Господи?",
  text: `
Этот день я вспоминаю всегда, когда проезжаю по мосту.

Прямого поезда не было. Нам нужно было торопиться.

Мы оказались не на том берегу...

Мы шли по льду...

Мы успели. Слава Богу.
`
},

{
  type: "poem",
  title: "О Небе",
  text: `
А о Небе я с детства мечтала
Я мечтала о нём и тогда
Когда буря кругом завывала
И когда в дом врывалась беда
`
}

];

let current = 0;

/* рендер */
function render(){

  let page = book[current];

  if(page.type === "cover"){
    app.innerHTML = `
      <h1>Слова — это следы души</h1>
      <div class="cover">
        <img src="${COVER}">
      </div>
      <h3 style="text-align:center;">Вера Климошенко</h3>
      <div class="menu">
        <button onclick="next()">Открыть книгу</button>
      </div>
    `;
    return;
  }

  if(page.type === "menu"){
    app.innerHTML = `
      <h2>${page.title}</h2>
      <div class="menu">
        ${page.items.map((item,i)=>`
          <button onclick="go(${i+2})">${item}</button>
        `).join("")}
      </div>
    `;
    return;
  }

  if(page.type === "story"){
    app.innerHTML = `
      <h2>${page.title}</h2>
      <p>${page.text}</p>
    `;
  }

  if(page.type === "poem"){
    app.innerHTML = `
      <h2>${page.title}</h2>
      <p class="poem">${page.text}</p>
    `;
  }

}

/* управление */
function next(){
  if(current < book.length-1){
    current++;
    render();
  }
}

function prev(){
  if(current > 0){
    current--;
    render();
  }
}

function go(i){
  current = i;
  render();
}

/* свайп */
let startX = 0;

document.addEventListener("touchstart", e=>{
  startX = e.touches[0].clientX;
});

document.addEventListener("touchend", e=>{
  let endX = e.changedTouches[0].clientX;

  if(startX - endX > 50) next();
  if(endX - startX > 50) prev();
});

render();

</script>

</body>
</html>
