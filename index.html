<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apple Books with Cover</title>

<style>
body{
  margin:0;
  font-family: Georgia, serif;
  background:#0b0b0b;
  overflow:hidden;
}

/* ===== COVER ===== */
#cover{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background: radial-gradient(circle at center, #000, #120a06);
  perspective:1200px;
}

/* 📸 PHOTO COVER */
.cover-book{
  width:340px;
  height:460px;
  background:
    linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.75)),
    url("cover.jpg");
  background-size:cover;
  background-position:center;

  border-radius:12px;
  box-shadow:0 40px 120px rgba(0,0,0,0.9);

  transform-origin:left;
  transition:1s ease;

  position:relative;
  display:flex;
  align-items:flex-end;
  justify-content:center;
}

/* TEXT ON COVER */
.cover-text{
  color:white;
  font-size:22px;
  font-weight:bold;
  text-align:center;
  padding:25px;
  text-shadow:0 3px 15px rgba(0,0,0,0.9);
}

/* OPEN ANIMATION */
.cover-open{
  transform: rotateY(-120deg);
  opacity:0;
}

/* BUTTON */
#openBtn{
  position:absolute;
  bottom:70px;
  padding:12px 18px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

/* ===== BOOK ===== */
#scene{
  display:none;
  height:100vh;
  align-items:center;
  justify-content:center;
  perspective:2000px;
  background: radial-gradient(circle at center, #1a1a1a, #000);
}

.book{
  width:800px;
  height:500px;
  position:relative;
  transform-style:preserve-3d;
  transform: rotateX(8deg);
}

/* spine */
.book::before{
  content:"";
  position:absolute;
  width:30px;
  height:100%;
  left:50%;
  transform:translateX(-50%);
  background:linear-gradient(#111,#000,#111);
}

/* pages */
.page{
  position:absolute;
  width:50%;
  height:100%;
  left:50%;
  transform-origin:left;
  background:#f6f1e3;
  padding:40px;
  box-sizing:border-box;
  transition:1s ease;
  box-shadow:0 30px 80px rgba(0,0,0,0.6);
}

.page:nth-child(1){ z-index:3; }
.page:nth-child(2){ z-index:2; }
.page:nth-child(3){ z-index:1; }

.page.flipped{
  transform: rotateY(-180deg);
}

/* UI */
.ui{
  position:fixed;
  bottom:20px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:10px;
  z-index:20;
}

button{
  padding:10px 14px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:white;
  font-weight:bold;
}
</style>
</head>

<body>

<!-- 📖 COVER -->
<div id="cover">

  <div class="cover-book" id="coverBook">
    <div class="cover-text">
      Слова — следы души
    </div>
  </div>

  <button id="openBtn" onclick="openBook()">Открыть книгу</button>
</div>

<!-- 📚 BOOK -->
<div id="scene">

  <div class="book">

    <div class="page">
      <h1>Глава 1</h1>
      <p>Теперь обложка использует твоё фото.</p>
    </div>

    <div class="page">
      <h1>Глава 2</h1>
      <p>Apple Books стиль + персональная обложка.</p>
    </div>

    <div class="page">
      <h1>Глава 3</h1>
      <p>Полностью готовая книжная сцена.</p>
    </div>

  </div>

</div>

<!-- UI -->
<div class="ui">
  <button onclick="flip()">➡ Next</button>
  <button onclick="reset()">🔄 Reset</button>
</div>

<script>

let i = 0;
const pages = document.querySelectorAll(".page");

/* 📖 OPEN BOOK */
function openBook(){
  document.getElementById("coverBook").classList.add("cover-open");

  setTimeout(()=>{
    document.getElementById("cover").style.display = "none";
    document.getElementById("scene").style.display = "flex";
  }, 900);
}

/* 📄 FLIP */
function flip(){
  if(i < pages.length){
    pages[i].classList.add("flipped");
    i++;
  }
}

/* 🔄 RESET */
function reset(){
  pages.forEach(p => p.classList.remove("flipped"));
  i = 0;
}

</script>

</body>
</html>
