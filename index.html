<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Книга</title>

<style>
:root{
  --bg:#0f0f12;
  --text:#eee;
  --nav:rgba(0,0,0,0.6);
}

body.light{
  --bg:#f5f2ea;
  --text:#1a1a1a;
  --nav:rgba(255,255,255,0.7);
}

body{
  margin:0;
  font-family: Georgia, serif;
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
  transition:0.4s;
}

/* NAV */
.book-nav{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:60px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:20px;
  background:var(--nav);
  backdrop-filter: blur(10px);
  z-index:100;
}

.book-nav a{
  color:#aaa;
  text-decoration:none;
  cursor:pointer;
}

.toggle{
  position:absolute;
  right:20px;
  cursor:pointer;
}

/* BOOK */
.book{
  position:absolute;
  top:60px;
  width:100%;
  height:calc(100vh - 60px);
  perspective:2500px;
}

/* PAGE */
.page{
  position:absolute;
  width:100%;
  height:100%;
  padding:60px 20px;
  box-sizing:border-box;
  background:var(--bg);
  transform-origin:left;
  transition:transform 0.9s;
  backface-visibility:hidden;
}

.page.flipped{
  transform: rotateY(-180deg);
}

.page.active{
  z-index:10;
}

/* COVER */
.cover{
  display:flex;
  justify-content:center;
  align-items:center;
  height:100%;
}

.cover img{
  max-width:80%;
  border-radius:12px;
  box-shadow:0 30px 80px rgba(0,0,0,0.6);
}

/* TEXT */
h1{
  font-size:32px;
}

p{
  max-width:700px;
  font-size:18px;
  line-height:1.6;
}

</style>
</head>
<body>

<div class="book-nav">
  <a onclick="goTo(1)">Глава 1</a>
  <a onclick="goTo(2)">Глава 2</a>
  <a onclick="goTo(3)">Глава 3</a>
  <span class="toggle" onclick="toggleTheme()">🌙 / ☀️</span>
</div>

<div class="book">

  <!-- ОБЛОЖКА -->
  <div class="page active">
    <div class="cover">
      <img src="cover.jpg">
    </div>
  </div>

  <!-- ГЛАВА 1 -->
  <div class="page">
    <h1>Глава 1</h1>
    <p>Тут будет твой текст книги...</p>
  </div>

  <!-- ГЛАВА 2 -->
  <div class="page">
    <h1>Глава 2</h1>
    <p>Продолжение книги...</p>
  </div>

  <!-- ГЛАВА 3 -->
  <div class="page">
    <h1>Глава 3</h1>
    <p>Дальше текст...</p>
  </div>

</div>

<script>

const pages = document.querySelectorAll(".page");
let current = 0;

/* ОТРИСОВКА */
function render(){
  pages.forEach((p,i)=>{
    if(i < current){
      p.classList.add("flipped");
    } else {
      p.classList.remove("flipped");
    }

    if(i === current){
      p.classList.add("active");
    } else {
      p.classList.remove("active");
    }
  });
}

/* АНИМАЦИЯ ПО СТРАНИЦАМ */
async function goTo(target){
  let step = target > current ? 1 : -1;

  while(current !== target){
    current += step;
    render();
    await new Promise(r=>setTimeout(r,400));
  }

  location.hash = "ch"+current;
}

/* ТЕМА */
function toggleTheme(){
  document.body.classList.toggle("light");
}

/* СВАЙП */
let startX = 0;

document.addEventListener("mousedown",e=>{
  startX = e.clientX;
});

document.addEventListener("mouseup",e=>{
  let diff = e.clientX - startX;

  if(diff < -80 && current < pages.length-1){
    goTo(current+1);
  }

  if(diff > 80 && current > 0){
    goTo(current-1);
  }
});

/* TOUCH */
document.addEventListener("touchstart",e=>{
  startX = e.touches[0].clientX;
});

document.addEventListener("touchend",e=>{
  let diff = e.changedTouches[0].clientX - startX;

  if(diff < -80 && current < pages.length-1){
    goTo(current+1);
  }

  if(diff > 80 && current > 0){
    goTo(current-1);
  }
});

/* LOAD */
window.onload = ()=>{
  let hash = location.hash.replace("#ch","");
  if(hash){
    goTo(parseInt(hash));
  }
};

</script>

</body>
</html>
