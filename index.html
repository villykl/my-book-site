<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Вера Климошенко — Слова это следы души</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin:0;
  font-family: Georgia, serif;
  background:#000;
  color:white;
}

/* 🌌 ФОН */
.bg {
  position:fixed;
  width:100%;
  height:100%;
  z-index:-1;
}
.star {
  position:absolute;
  width:2px;
  height:2px;
  background:white;
  opacity:0.7;
  animation:move 10s linear infinite;
}
@keyframes move {
  from{transform:translateY(0);}
  to{transform:translateY(100vh);}
}

/* ГЛАВНАЯ */
.hero {
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.hero h1 {font-size:42px;}
.hero p {opacity:0.7;}

.btn {
  margin-top:20px;
  padding:12px 25px;
  border:1px solid white;
  background:none;
  color:white;
  cursor:pointer;
}

/* КНИГА */
.book {
  background:#fdfbf7;
  color:black;
  max-width:700px;
  margin:40px auto;
  padding:30px;
  border-radius:12px;
  box-shadow:0 20px 60px rgba(0,0,0,0.7);
}

.page {
  font-size:18px;
  line-height:1.8;
}

/* КНОПКИ */
.controls {
  display:flex;
  justify-content:space-between;
  margin-top:20px;
}

/* АВТОР */
.about {
  display:flex;
  flex-wrap:wrap;
  gap:30px;
  align-items:center;
  max-width:900px;
  margin:60px auto;
  padding:20px;
}

.about img {
  width:260px;
  border-radius:12px;
  box-shadow:0 10px 30px rgba(0,0,0,0.6);
}

.footer {
  text-align:center;
  padding:20px;
  opacity:0.5;
}
</style>
</head>

<body>

<div class="bg" id="bg"></div>

<!-- ГЛАВНАЯ -->
<div class="hero">
  <div>
    <h1>Вера Климошенко</h1>
    <p>Слова — это следы души</p>
    <button class="btn" onclick="go()">Читать книгу</button>
  </div>
</div>

<!-- КНИГА -->
<div class="book" id="book">
  <div id="content" class="page"></div>

  <div class="controls">
    <button onclick="prev()">⬅️</button>
    <button onclick="next()">➡️</button>
  </div>
</div>

<!-- АВТОР -->
<div class="about">

<img src="photo.jpg" onerror="this.style.display='none'">

<div>
<h2>Об авторе</h2>
<p>
Вера Климошенко — автор произведений о вере, тишине и глубине души.
</p>
</div>

</div>

<div class="footer">© Вера Климошенко</div>

<script>

/* 🌌 ЗВЁЗДЫ */
for(let i=0;i<60;i++){
  let s=document.createElement("div");
  s.className="star";
  s.style.left=Math.random()*100+"%";
  s.style.top=Math.random()*100+"%";
  document.getElementById("bg").appendChild(s);
}

/* КНИГА */
let pages = [

`<h2>Слова — это следы души</h2>
<p style="text-align:center;">Вера Климошенко</p>`,

`<h3>А ты пойдёшь с нами, Господи?</h3>
<p>Этот день я вспоминаю всегда, когда проезжаю по мосту...</p>`,

`<p>Прямого поезда не было. Нам нужно было торопиться.</p>`,

`<p>Мы шли по льду. Каждый шаг был испытанием.</p>`,

`<p>Мы успели. Слава Богу.</p>`

];

let current = 0;

function render(){
  content.innerHTML = pages[current];
  localStorage.setItem("page", current);
}

function next(){
  if(current < pages.length-1){current++; render();}
}

function prev(){
  if(current > 0){current--; render();}
}

function go(){
  document.getElementById("book").scrollIntoView({behavior:"smooth"});
}

window.onload = () => {
  current = parseInt(localStorage.getItem("page")) || 0;
  render();
};
</script>

</body>
</html>
