<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultra Book Page Curl</title>

<style>
body{
  margin:0;
  font-family: Georgia, serif;
  background:#0b0b0b;
  overflow:hidden;
}

/* ================= COVER ================= */
#cover{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background: radial-gradient(circle at center, #000, #120a06);
  perspective:1600px;
}

/* BOOK COVER */
.cover-book{
  width:340px;
  height:460px;

  background:
    linear-gradient(135deg, rgba(0,0,0,0.35), rgba(0,0,0,0.8)),
    url("cover.jpg");

  background-size:cover;
  background-position:center;

  border-radius:8px 18px 18px 8px;

  box-shadow:
    -14px 0 0 rgba(0,0,0,0.25),
    0 50px 120px rgba(0,0,0,0.9);

  transform-origin:left;
  position:relative;
  overflow:hidden;

  border-left:6px solid rgba(0,0,0,0.35);

  transition:1.2s cubic-bezier(.2,.8,.2,1);
}

/* 🌟 SPINE LIGHT */
.cover-book::after{
  content:"";
  position:absolute;
  left:0;
  top:0;
  width:12px;
  height:100%;

  background:linear-gradient(
    180deg,
    rgba(255,255,255,0),
    rgba(255,255,255,0.25),
    rgba(255,255,255,0)
  );

  opacity:0;
  transition:1s ease;
}

/* OPEN STATE */
.cover-open{
  transform: perspective(1200px)
             rotateY(-110deg)
             translateX(-80px)
             scale(0.95);
  filter: blur(2px);
  opacity:0.2;
}

/* activate spine light */
.cover-open::after{
  opacity:1;
  animation:shine 1.2s ease;
}

@keyframes shine{
  0%{ transform:translateX(0); opacity:0; }
  40%{ opacity:1; }
  100%{ transform:translateX(320px); opacity:0; }
}

/* ================= BOOK ================= */
#scene{
  display:none;
  height:100vh;
  align-items:center;
  justify-content:center;
  perspective:2200px;
  background: radial-gradient(circle at center, #1a1a1a, #000);
}

.book{
  width:820px;
  height:520px;
  position:relative;
  transform-style:preserve-3d;
  transform: rotateX(10deg);
}

/* SPINE */
.book::before{
  content:"";
  position:absolute;
  width:30px;
  height:100%;
  left:50%;
  transform:translateX(-50%);
  background:linear-gradient(#111,#000,#111);
}

/* SPINE LIGHT CORE */
.book::after{
  content:"";
  position:absolute;
  width:6px;
  height:100%;
  left:50%;
  transform:translateX(-50%);
  background:linear-gradient(
    180deg,
    transparent,
    rgba(255,255,255,0.5),
    transparent
  );
  opacity:0;
  transition:1s ease;
}

/* pages */
.page{
  position:absolute;
  width:50%;
  height:100%;
  left:50%;
  transform-origin:left;

  background:#f6f1e3;

  padding:40px;
  box-sizing:border-box;

  transition:1s cubic-bezier(.2,.8,.2,1);

  box-shadow:0 30px 80px rgba(0,0,0,0.6);
}

.page:nth-child(1){ z-index:3; }
.page:nth-child(2){ z-index:2; }
.page:nth-child(3){ z-index:1; }

.page.flipped{
  transform: rotateY(-180deg);
}

/* ================= UI ================= */
.ui{
  position:fixed;
  right:20px;
  top:50%;
  transform:translateY(-50%);

  display:flex;
  flex-direction:column;
  gap:10px;

  z-index:999;
}

button{
  padding:10px 14px;
  border:none;
  border-radius:12px;
  cursor:pointer;

  background:rgba(255,255,255,0.92);
  font-weight:bold;

  box-shadow:0 10px 25px rgba(0,0,0,0.3);
  backdrop-filter: blur(6px);

  transition:0.2s;
}

button:hover{
  transform:scale(1.05);
}
</style>
</head>

<body>

<!-- 📖 COVER -->
<div id="cover">
  <div class="cover-book" id="coverBook"></div>
</div>

<!-- 📚 BOOK -->
<div id="scene">

  <div class="book">

    <div class="page">
      <h1>Глава 1</h1>
      <p>Теперь есть page curl + свет по корешку.</p>
    </div>

    <div class="page">
      <h1>Глава 2</h1>
      <p>Эффект как у Apple Books.</p>
    </div>

    <div class="page">
      <h1>Глава 3</h1>
      <p>Премиум рендер книги.</p>
    </div>

  </div>

</div>

<!-- UI -->
<div class="ui">
  <button onclick="openBook()">📖 Open</button>
  <button onclick="flip()">➡ Next</button>
  <button onclick="reset()">🔄 Reset</button>
</div>

<script>

let i = 0;
const pages = document.querySelectorAll(".page");

/* OPEN BOOK + SPINE LIGHT */
function openBook(){
  const cover = document.getElementById("coverBook");
  const book = document.querySelector(".book");

  cover.classList.add("cover-open");

  // spine light activation
  book.style.setProperty("--open","1");
  book.querySelector && (book.style.opacity = "1");

  setTimeout(()=>{
    document.getElementById("cover").style.display = "none";
    document.getElementById("scene").style.display = "flex";

    // show spine light
    book.style.setProperty("filter","brightness(1.1)");
  }, 900);
}

/* PAGE CURL SIMULATION */
function flip(){
  if(i < pages.length){
    pages[i].style.transition = "1s cubic-bezier(.2,.8,.2,1)";
    pages[i].style.transformOrigin = "left";

    pages[i].style.transform =
      "rotateY(-160deg) skewY(2deg)";

    pages[i].classList.add("flipped");
    i++;
  }
}

/* RESET */
function reset(){
  pages.forEach(p=>{
    p.classList.remove("flipped");
    p.style.transform = "";
  });
  i = 0;
}

</script>

</body>
</html>
