<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Locked Book</title>

<style>
body{
  margin:0;
  font-family: Georgia, serif;
  background:#0b0b0b;
  overflow:hidden;
}

/* 🚫 FORCE START SCREEN */
.cover{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;

  background:
    linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.95)),
    url('https://www.transparenttextures.com/patterns/dark-leather.png');
  background-color:#3a2215;

  color:#f3e3d0;
  text-align:center;

  z-index:9999;
  transition:1s ease;
}

.cover h1{
  font-size:42px;
  margin:0;
}

.cover p{
  opacity:0.8;
}

.cover button{
  margin-top:20px;
  padding:12px 18px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

/* hide cover */
.cover.hide{
  opacity:0;
  transform:scale(1.1);
  pointer-events:none;
}

/* BOOK STAGE */
.stage{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  perspective:2600px;
}

/* BOOK */
.book{
  width:800px;
  height:500px;
  position:relative;
  transform-style:preserve-3d;
  transform: rotateX(6deg);
}

/* spine */
.book::before{
  content:"";
  position:absolute;
  width:28px;
  height:100%;
  left:50%;
  transform:translateX(-50%);
  background:linear-gradient(#111,#000,#111);
}

/* PAGES */
.page{
  position:absolute;
  width:50%;
  height:100%;
  left:50%;
  transform-origin:left;

  background:#f6f1e3;
  padding:40px;
  box-sizing:border-box;

  transition:1s;
  box-shadow:0 30px 80px rgba(0,0,0,0.6);
}

.page:nth-child(1){ z-index:5; }
.page:nth-child(2){ z-index:4; }
.page:nth-child(3){ z-index:3; }

.page.flipped{
  transform: rotateY(-180deg);
}

/* UI */
.ui{
  position:fixed;
  bottom:20px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:10px;
  z-index:10;
}

button{
  padding:10px 14px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:white;
  font-weight:bold;
}
</style>
</head>

<body>

<!-- 📖 COVER (FORCED ENTRY) -->
<div class="cover" id="cover">
  <h1>Слова — следы души</h1>
  <p>Нажми, чтобы открыть книгу</p>
  <button onclick="enterBook()">Открыть</button>
</div>

<!-- 📚 BOOK -->
<div class="stage">

  <div class="book">

    <div class="page">
      <h1>Глава 1</h1>
      <p>Теперь обложка всегда показывается первой. Нельзя зайти сразу в главы.</p>
    </div>

    <div class="page">
      <h1>Глава 2</h1>
      <p>Книга работает как приложение, а не как обычная страница GitHub Pages.</p>
    </div>

    <div class="page">
      <h1>Глава 3</h1>
      <p>Ты можешь вставить сюда свои тексты.</p>
    </div>

  </div>
</div>

<!-- UI -->
<div class="ui">
  <button onclick="flip()">➡ Flip</button>
  <button onclick="resetBook()">🔄 Reset</button>
</div>

<script>

const cover = document.getElementById("cover");
const pages = document.querySelectorAll(".page");

let i = 0;

/* 🚪 OPEN BOOK */
function enterBook(){
  cover.classList.add("hide");
}

/* 📄 FLIP */
function flip(){
  if(i < pages.length){
    pages[i].classList.add("flipped");
    i++;
  }
}

/* 🔄 RESET */
function resetBook(){
  pages.forEach(p=>p.classList.remove("flipped"));
  i = 0;
}

/* 🚫 HARD LOCK: block #ch1 bypass */
if (window.location.hash.includes("ch")) {
  window.location.hash = "";
}

/* ⌨️ keyboard */
document.addEventListener("keydown",(e)=>{
  if(e.key==="ArrowRight") flip();
  if(e.key==="ArrowLeft") resetBook();
});

</script>

</body>
</html>
