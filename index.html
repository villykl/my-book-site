<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fixed GitHub Book</title>

<style>
body{
  margin:0;
  font-family: Georgia, serif;
  background:#0b0b0b;
  overflow:hidden;
}

/* ================= COVER ================= */
#cover{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background: radial-gradient(circle at center, #000, #120a06);
}

/* 📖 SAFE COVER LOAD */
.cover-book{
  width:340px;
  height:460px;

  /* 🔥 ЖЁСТКИЙ ФИКС ПУТИ */
  background-image:url("./cover.jpg");
  background-size:cover;
  background-position:center;

  border-radius:10px 18px 18px 10px;

  box-shadow:0 60px 140px rgba(0,0,0,0.9);

  transform-origin:left;

  transition:1s ease;

  border-left:6px solid rgba(0,0,0,0.35);
}

/* OPEN */
.cover-open{
  transform: perspective(1200px) rotateY(-110deg) translateX(-80px);
  opacity:0;
}

/* ================= BOOK ================= */
#scene{
  display:none;
  height:100vh;
  align-items:center;
  justify-content:center;
  background: radial-gradient(circle at center, #1a1a1a, #000);
}

.book{
  width:800px;
  height:500px;
  position:relative;
  transform-style:preserve-3d;
}

.page{
  position:absolute;
  width:50%;
  height:100%;
  left:50%;
  transform-origin:left;

  background:#f6f1e3;

  padding:40px;
  box-sizing:border-box;

  transition:0.8s ease;

  box-shadow:0 30px 80px rgba(0,0,0,0.6);
}

.page:nth-child(1){ z-index:3; }
.page:nth-child(2){ z-index:2; }
.page:nth-child(3){ z-index:1; }

.page.flipped{
  transform:rotateY(-180deg);
}

/* ================= UI ================= */
.ui{
  position:fixed;
  right:20px;
  top:50%;
  transform:translateY(-50%);

  display:flex;
  flex-direction:column;
  gap:10px;
  z-index:999;
}

button{
  padding:10px 14px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  background:rgba(255,255,255,0.92);
  font-weight:bold;
}
</style>
</head>

<body>

<!-- 📖 COVER -->
<div id="cover">
  <div class="cover-book" id="coverBook"></div>
</div>

<!-- 📚 BOOK -->
<div id="scene">

  <div class="book">

    <div class="page">
      <h1>Глава 1</h1>
      <p>GitHub Fixed Version работает.</p>
    </div>

    <div class="page">
      <h1>Глава 2</h1>
      <p>Обложка теперь всегда грузится.</p>
    </div>

    <div class="page">
      <h1>Глава 3</h1>
      <p>Стабильный deployment.</p>
    </div>

  </div>

</div>

<!-- UI -->
<div class="ui">
  <button onclick="openBook()">📖 Open</button>
  <button onclick="flip()">➡ Next</button>
  <button onclick="reset()">🔄 Reset</button>
</div>

<script>

let i = 0;
const pages = document.querySelectorAll(".page");

/* OPEN */
function openBook(){
  document.getElementById("coverBook").classList.add("cover-open");

  setTimeout(()=>{
    document.getElementById("cover").style.display = "none";
    document.getElementById("scene").style.display = "flex";
  }, 900);
}

/* NEXT */
function flip(){
  if(i < pages.length){
    pages[i].classList.add("flipped");
    i++;
  }
}

/* RESET */
function reset(){
  pages.forEach(p=>p.classList.remove("flipped"));
  i = 0;
}

</script>

</body>
</html>
