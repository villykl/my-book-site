<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Слова — это следы души</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin:0;
  font-family: Georgia, serif;
  background:#fdfbf7;
}

#app {
  max-width:700px;
  margin:auto;
  padding:20px;
}

h1,h2 {
  text-align:center;
}

.cover img {
  width:220px;
  display:block;
  margin:20px auto;
  border-radius:12px;
}

.menu {
  text-align:center;
}

.menu button {
  margin:5px;
  padding:10px;
}

p {
  line-height:1.8;
  text-indent:2em;
}

.poem {
  text-align:center;
  white-space:pre-line;
  text-indent:0;
}
</style>
</head>

<body>

<div id="app"></div>

<script>

const COVER = "https://i.imgur.com/8QZ7Z8T.png";

let book = [

{ type:"cover" },

{ type:"menu", title:"Оглавление", items:[
"Пётр Константинович",
"А ты пойдёшь с нами, Господи?",
"Валяй-бригада",
"Стихи"
]},

{
type:"story",
title:"Пётр Константинович",
text:`Это был необыкновенный человек, простой, богобоязненный пастор...

Он делился с людьми Благой Вестью...

До встречи в Небесах наш дорогой брат.`
},

{
type:"story",
title:"А ты пойдёшь с нами, Господи?",
text:`Но вот закат задёрнул штору дня...

Спасибо Тебе, Господи, что Ты хранишь...`
},

{
type:"story",
title:"Валяй-бригада",
text:`А когда Богослужения проходили под открытым небом...

Так вместе со своими родителями они крепли верой...`
},

{
type:"poem",
title:"Гимн весны",
text:`А дни, как бусинки скользят...
И пишет Бог прекрасные картины...`
},

{
type:"poem",
title:"Лети, моя песня",
text:`Лети, моя песня!
С святой доброй Вестью...`
}

];

let current = 0;

function render(){
let page = book[current];

if(page.type==="cover"){
app.innerHTML=`
<h1>Слова — это следы души</h1>
<div class="cover">
<img src="${COVER}">
</div>
<h3 style="text-align:center;">Вера Климошенко</h3>
<div class="menu">
<button onclick="next()">Открыть книгу</button>
</div>`;
return;
}

if(page.type==="menu"){
app.innerHTML=`
<h2>${page.title}</h2>
<div class="menu">
${page.items.map((t,i)=>`<button onclick="go(${i+2})">${t}</button>`).join("")}
</div>`;
return;
}

if(page.type==="story"){
app.innerHTML=`<h2>${page.title}</h2><p>${page.text}</p>`;
}

if(page.type==="poem"){
app.innerHTML=`<h2>${page.title}</h2><p class="poem">${page.text}</p>`;
}
}

function next(){ if(current<book.length-1){current++;render();}}
function prev(){ if(current>0){current--;render();}}
function go(i){ current=i; render(); }

document.addEventListener("click", e=>{
if(e.clientX > window.innerWidth/2) next();
else prev();
});

render();

</script>

</body>
</html>
