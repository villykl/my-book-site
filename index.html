<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apple Books Style</title>

<style>
body{
  margin:0;
  font-family: Georgia, serif;
  background:#0b0b0b;
  overflow:hidden;
}

/* ===== COVER STAGE ===== */
#cover{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background: radial-gradient(circle at center, #3a2215, #0b0604);
  perspective:1200px;
}

/* book cover object */
.cover-book{
  width:320px;
  height:440px;
  background: linear-gradient(145deg, #5a341f, #2a160d);
  border-radius:10px;
  box-shadow:0 40px 100px rgba(0,0,0,0.8);
  transform-origin:left;
  transition:1s ease;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#f3e3d0;
  font-size:22px;
  text-align:center;
  padding:20px;
}

/* open animation */
.cover-open{
  transform: rotateY(-120deg);
  opacity:0;
}

/* button */
#openBtn{
  position:absolute;
  bottom:80px;
  padding:12px 18px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

/* ===== BOOK ===== */
#scene{
  display:none;
  height:100vh;
  align-items:center;
  justify-content:center;
  perspective:2000px;
  background: radial-gradient(circle at center, #1a1a1a, #000);
}

.book{
  width:800px;
  height:500px;
  position:relative;
  transform-style:preserve-3d;
  transform: rotateX(8deg);
}

/* spine */
.book::before{
  content:"";
  position:absolute;
  width:30px;
  height:100%;
  left:50%;
  transform:translateX(-50%);
  background:linear-gradient(#111,#000,#111);
}

/* pages */
.page{
  position:absolute;
  width:50%;
  height:100%;
  left:50%;
  transform-origin:left;
  background:#f6f1e3;
  padding:40px;
  box-sizing:border-box;
  transition:1s ease;
  box-shadow:0 30px 80px rgba(0,0,0,0.6);
}

.page:nth-child(1){ z-index:3; }
.page:nth-child(2){ z-index:2; }
.page:nth-child(3){ z-index:1; }

.page.flipped{
  transform: rotateY(-180deg);
}

/* UI */
.ui{
  position:fixed;
  bottom:20px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:10px;
}

button{
  padding:10px 14px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:white;
  font-weight:bold;
}
</style>
</head>

<body>

<!-- 📖 COVER -->
<div id="cover">
  <div class="cover-book" id="coverBook">
    Слова — следы души
  </div>

  <button id="openBtn" onclick="openBook()">Открыть книгу</button>
</div>

<!-- 📚 BOOK -->
<div id="scene">

  <div class="book">

    <div class="page">
      <h1>Глава 1</h1>
      <p>Теперь это выглядит как Apple Books.</p>
    </div>

    <div class="page">
      <h1>Глава 2</h1>
      <p>Обложка раскрывается как настоящая книга.</p>
    </div>

    <div class="page">
      <h1>Глава 3</h1>
      <p>Перелистывание страниц работает как анимация.</p>
    </div>

  </div>

</div>

<!-- UI -->
<div class="ui">
  <button onclick="flip()">➡ Next</button>
  <button onclick="reset()">🔄 Reset</button>
</div>

<script>

let i = 0;
const pages = document.querySelectorAll(".page");

/* 📖 OPEN BOOK (COVER ANIMATION) */
function openBook(){
  document.getElementById("coverBook").classList.add("cover-open");

  setTimeout(()=>{
    document.getElementById("cover").style.display = "none";
    document.getElementById("scene").style.display = "flex";
  }, 900);
}

/* 📄 FLIP */
function flip(){
  if(i < pages.length){
    pages[i].classList.add("flipped");
    i++;
  }
}

/* 🔄 RESET */
function reset(){
  pages.forEach(p => p.classList.remove("flipped"));
  i = 0;
}

</script>

</body>
</html>
