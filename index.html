<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>God Mode Physics Book</title>

<style>
body{
  margin:0;
  font-family: Georgia, serif;
  background:#0b0b0b;
  overflow:hidden;
}

/* ================= COVER ================= */
#cover{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background: radial-gradient(circle at center, #000, #120a06);
  perspective:2000px;
}

.cover-book{
  width:340px;
  height:460px;

  background:
    linear-gradient(135deg, rgba(255,255,255,0.12), rgba(0,0,0,0.7)),
    url("cover.jpg");

  background-size:cover;
  background-position:center;

  filter: brightness(1.2) contrast(1.1);

  border-radius:8px 18px 18px 8px;

  box-shadow:0 80px 180px rgba(0,0,0,0.95);

  transform-origin:left;

  transition:1.2s cubic-bezier(.2,.8,.2,1);
}

.cover-open{
  transform: perspective(1400px)
             rotateY(-120deg)
             translateX(-100px)
             scale(0.9);
  opacity:0.1;
  filter: blur(3px);
}

/* ================= BOOK ================= */
#scene{
  display:none;
  height:100vh;
  align-items:center;
  justify-content:center;
  perspective:3000px;
  background: radial-gradient(circle at center, #1a1a1a, #000);
}

/* BOOK BODY */
.book{
  width:840px;
  height:520px;
  position:relative;
  transform-style:preserve-3d;
  transform: rotateX(10deg);
}

/* SPINE */
.book::before{
  content:"";
  position:absolute;
  width:32px;
  height:100%;
  left:50%;
  transform:translateX(-50%);
  background:linear-gradient(#111,#000,#111);
}

/* LIGHT FOLLOW CURSOR */
.book-light{
  position:absolute;
  width:200px;
  height:200px;
  pointer-events:none;
  background:radial-gradient(circle, rgba(255,255,255,0.12), transparent 60%);
  mix-blend-mode:screen;
  transform:translate(-50%,-50%);
}

/* ================= PAGE ================= */
.page{
  position:absolute;
  width:50%;
  height:100%;
  left:50%;
  transform-origin:left;

  background:linear-gradient(to right, #f8f3e7, #efe6d3);

  padding:40px;
  box-sizing:border-box;

  box-shadow:0 30px 100px rgba(0,0,0,0.6);

  backface-visibility:hidden;

  transition:transform 0.25s ease-out;
}

/* STACK */
.page:nth-child(1){ z-index:3; }
.page:nth-child(2){ z-index:2; }
.page:nth-child(3){ z-index:1; }

/* ================= DRAG STATE ================= */
.page.dragging{
  transition:none !important;
  cursor:grabbing;
}

/* FLIPPED */
.page.flipped{
  transform: rotateY(-180deg);
}

/* ================= UI ================= */
.ui{
  position:fixed;
  right:20px;
  top:50%;
  transform:translateY(-50%);

  display:flex;
  flex-direction:column;
  gap:10px;

  z-index:999;
}

button{
  padding:10px 14px;
  border:none;
  border-radius:12px;
  cursor:pointer;

  background:rgba(255,255,255,0.92);
  font-weight:bold;

  box-shadow:0 10px 25px rgba(0,0,0,0.3);
  backdrop-filter: blur(6px);

  transition:0.2s;
}

button:hover{
  transform:scale(1.05);
}
</style>
</head>

<body>

<!-- 📖 COVER -->
<div id="cover">
  <div class="cover-book" id="coverBook"></div>
</div>

<!-- 📚 BOOK -->
<div id="scene">

  <div class="book" id="book">

    <div class="page">
      <h1>GOD MODE</h1>
      <p>Drag physics activated.</p>
    </div>

    <div class="page">
      <h1>Page 2</h1>
      <p>Realistic tension & snap.</p>
    </div>

    <div class="page">
      <h1>Page 3</h1>
      <p>Like real paper.</p>
    </div>

    <div class="book-light" id="light"></div>

  </div>

</div>

<!-- UI -->
<div class="ui">
  <button onclick="openBook()">📖 Open</button>
  <button onclick="reset()">🔄 Reset</button>
</div>

<script>

let pages = document.querySelectorAll(".page");
let i = 0;

let dragging = false;
let startX = 0;
let currentPage = null;

/* OPEN */
function openBook(){
  document.getElementById("coverBook").classList.add("cover-open");

  setTimeout(()=>{
    document.getElementById("cover").style.display = "none";
    document.getElementById("scene").style.display = "flex";
  }, 900);
}

/* RESET */
function reset(){
  pages.forEach(p=>{
    p.classList.remove("flipped","dragging");
    p.style.transform = "";
  });
  i = 0;
}

/* ================= GOD DRAG ================= */
document.addEventListener("mousedown",(e)=>{

  if(i >= pages.length) return;

  dragging = true;
  startX = e.clientX;

  currentPage = pages[i];
  currentPage.classList.add("dragging");
});

document.addEventListener("mousemove",(e)=>{

  if(!dragging || !currentPage) return;

  let diff = e.clientX - startX;

  // resistance physics
  let rotate = Math.min(Math.max(diff * 0.3, -180), 0);

  currentPage.style.transform = `rotateY(${rotate}deg) skewY(${rotate/40}deg)`;
});

/* SNAP PHYSICS */
document.addEventListener("mouseup",(e)=>{

  if(!dragging || !currentPage) return;

  let diff = e.clientX - startX;

  currentPage.classList.remove("dragging");

  if(diff < -100){
    // SNAP FLIP
    currentPage.style.transform = "rotateY(-180deg)";
    currentPage.classList.add("flipped");
    i++;
  }else{
    // SNAP BACK
    currentPage.style.transform = "rotateY(0deg)";
  }

  dragging = false;
  currentPage = null;
});

/* LIGHT FOLLOWS CURSOR */
document.addEventListener("mousemove",(e)=>{
  let light = document.getElementById("light");
  if(light){
    light.style.left = e.clientX + "px";
    light.style.top = e.clientY + "px";
  }
});

</script>

</body>
</html>
