<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Слова — это следы души</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Georgia, serif;
  background: radial-gradient(circle at center, #0a0a0a, #000);
  color: #eaeaea;
}

/* ФОН-ДЫМ */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: radial-gradient(circle, rgba(255,255,255,0.05), transparent);
  animation: fog 10s infinite alternate;
  z-index: -1;
}

@keyframes fog {
  from {transform: scale(1);}
  to {transform: scale(1.2);}
}

/* ШАПКА */
.header {
  text-align: center;
  padding: 60px 20px 30px;
}

.header h1 {
  font-size: 36px;
  letter-spacing: 2px;
}

.header p {
  opacity: 0.5;
  font-size: 14px;
}

/* НАВИГАЦИЯ */
.nav {
  display: flex;
  justify-content: center;
  gap: 10px;
  padding: 10px;
}

.nav button {
  background: transparent;
  border: 1px solid #333;
  color: #aaa;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  transition: 0.3s;
}

.nav button:hover {
  background: #111;
  color: white;
}

.nav button.active {
  border-color: white;
  color: white;
}

/* КОНТЕНТ */
.content {
  max-width: 700px;
  margin: auto;
  padding: 30px;
  animation: fade 0.6s;
}

@keyframes fade {
  from {opacity: 0; transform: translateY(10px);}
  to {opacity: 1; transform: translateY(0);}
}

/* БЛОК */
.card {
  background: rgba(20,20,20,0.8);
  padding: 25px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: 0 0 20px rgba(0,0,0,0.6);
}

/* СТИХ */
.poem {
  line-height: 1.7;
  font-style: italic;
}

/* КНОПКИ */
button {
  font-family: inherit;
}

/* КРОССВОРД */
.cell {
  width: 35px;
  height: 35px;
  margin: 3px;
  text-align: center;
  background: #111;
  border: 1px solid #444;
  color: white;
}
</style>
</head>

<body>

<div class="header">
  <h1>Слова — это следы души</h1>
  <p>Автор: Ты</p>
</div>

<div class="nav">
  <button onclick="show('home')" class="active">Главная</button>
  <button onclick="show('poems')">Стихи</button>
  <button onclick="show('stories')">Рассказы</button>
  <button onclick="show('game')">Игра</button>
  <button onclick="show('about')">О себе</button>
</div>

<div class="content" id="content"></div>

<script>
function show(section) {

  document.querySelectorAll(".nav button").forEach(b => b.classList.remove("active"));
  event.target.classList.add("active");

  let html = "";

  if (section === "home") {
    html = `
      <div class="card">
        <h2>Добро пожаловать</h2>
        <p>Это не просто сайт. Это отражение мыслей, чувств и тишины между словами.</p>
      </div>
    `;
  }

  if (section === "poems") {
    html = `
      <div class="card poem">
      Тишина говорит со мной,<br>
      Словно ветер в пустом окне...<br><br>
      И я снова ищу покой,<br>
      Но он прячется где-то во мне.
      </div>

      <div class="card poem">
      Слова — это следы души,<br>
      Их нельзя стереть во тьме...
      </div>
    `;
  }

  if (section === "stories") {
    html = `
      <div class="card">
      Однажды ночью город молчал...  
      И только свет в окне говорил о чьей-то душе.
      </div>
    `;
  }

  if (section === "game") {
    html = `
      <div class="card">
      <h2>Кроссворд</h2>
      <input class="cell" maxlength="1">
      <input class="cell" maxlength="1">
      <input class="cell" maxlength="1">
      <br><br>
      <button onclick="check()">Проверить</button>
      <p id="result"></p>
      </div>
    `;
  }

  if (section === "about") {
    html = `
      <div class="card">
      <h2>О себе</h2>
      <p>Я пишу о том, что нельзя сказать вслух.</p>
      </div>
    `;
  }

  document.getElementById("content").innerHTML = html;
  localStorage.setItem("section", section);
}

window.onload = () => {
  let saved = localStorage.getItem("section") || "home";
  show(saved);
};

function check() {
  let letters = document.querySelectorAll('.cell');
  let word = "";
  letters.forEach(l => word += l.value.toLowerCase());

  document.getElementById("result").innerText =
    word === "мир" ? "Правильно ✅" : "Попробуй ещё ❌";
}
</script>

</body>
</html>
