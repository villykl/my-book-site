<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Вера Климошенко — Слова это следы души</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin:0;
  font-family: Georgia, serif;
  background:#fdfbf7;
  color:#111;
  transition:0.3s;
}

/* ТЁМНАЯ ТЕМА */
.dark {
  background:#111;
  color:#eee;
}

/* КОНТЕЙНЕР */
.container {
  max-width:700px;
  margin:auto;
  padding:20px;
}

/* ТЕКСТ */
h1, h2 {
  text-align:center;
}

p {
  line-height:1.8;
  font-size:20px;
  margin-bottom:20px;
}

/* КНОПКИ */
.controls {
  position:fixed;
  bottom:10px;
  width:100%;
  display:flex;
  justify-content:space-around;
}

button {
  padding:10px 15px;
  font-size:16px;
}

/* АВТОР */
.author {
  text-align:center;
  margin-top:40px;
}

.author img {
  width:180px;
  border-radius:50%;
  margin-top:20px;
}
</style>
</head>

<body>

<div class="container" id="content"></div>

<div class="controls">
  <button onclick="prev()">⬅️</button>
  <button onclick="toggleTheme()">🌙</button>
  <button onclick="next()">➡️</button>
</div>

<script>

/* КНИГА */
let pages = [

`<h1>Слова — это следы души</h1>
<p style="text-align:center;">Вера Климошенко</p>`,

`<h2>А ты пойдёшь с нами, Господи?</h2>
<p>
Этот день я вспоминаю всегда, когда проезжаю по мосту.
Этот день навсегда остался в моей памяти.
</p>`,

`<p>
Прямого поезда на Брест не было.
Поэтому нам нужно было торопиться.
</p>`,

`<p>
Оставив вещи, мы поспешили в город.
Ранняя весна наполняла душу радостью.
</p>`,

`<p>
Но вот электричка...
Господь идёт впереди нас.
</p>`,

`<p>
И вдруг — ошибка...
Мы оказались не на том берегу.
</p>`,

`<p>
Господи, что делать?
И вдруг мысль — идти по льду.
</p>`,

`<p>
Первый шаг был самым трудным.
Сердце билось всё сильнее.
</p>`,

`<p>
Мы шли по льду...
Каждый шаг был испытанием.
</p>`,

`<p>
И вот берег...
Мы дошли.
</p>`,

`<p>
Но чудо только начиналось...
Мы оказались в нужном доме.
</p>`,

`<p>
А затем бег к поезду...
И последние секунды.
</p>`,

`<p>
Мы успели.
Слава Богу.
</p>`,

`<p>
Этот день навсегда остался в моей душе —
как свидетельство Божьей помощи.
</p>`,

`<div class="author">
<h2>Об авторе</h2>
<p>Вера Климошенко</p>
<img src="photo.jpg" onerror="this.style.display='none'">
</div>`

];

let current = 0;

/* РЕНДЕР */
function render(){
  content.innerHTML = pages[current];
  localStorage.setItem("page", current);
}

/* НАВИГАЦИЯ */
function next(){
  if(current < pages.length-1){
    current++;
    render();
  }
}

function prev(){
  if(current > 0){
    current--;
    render();
  }
}

/* СВАЙП */
let startX = 0;

document.addEventListener("touchstart", e=>{
  startX = e.touches[0].clientX;
});

document.addEventListener("touchend", e=>{
  let dx = startX - e.changedTouches[0].clientX;

  if(dx > 50) next();
  if(dx < -50) prev();
});

/* ТЕМА */
function toggleTheme(){
  document.body.classList.toggle("dark");
}

/* ЗАПУСК */
window.onload = ()=>{
  current = parseInt(localStorage.getItem("page")) || 0;
  render();
};

</script>

</body>
</html>
