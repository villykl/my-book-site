<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Вера Климошенко — Автор</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin:0;
  font-family: Georgia, serif;
  background:#fdfbf7;
  color:#222;
}

.dark {
  background:#111;
  color:#eee;
}

.container {
  max-width:700px;
  margin:auto;
  padding:20px;
  text-align:center;
}

.hero img {
  width:140px;
  border-radius:50%;
  margin-top:20px;
}

p {
  font-size:20px;
  line-height:1.8;
  text-align:justify;
  text-indent:2em;
}

button {
  padding:12px;
  margin:10px;
  font-size:18px;
  border:none;
  border-radius:10px;
  background:black;
  color:white;
  cursor:pointer;
}

.dark button {
  background:white;
  color:black;
}

.controls {
  position:fixed;
  bottom:10px;
  width:100%;
  display:flex;
  justify-content:space-around;
}

.progress {
  position:fixed;
  top:0;
  left:0;
  height:4px;
  background:black;
  width:0%;
}

.dark .progress {
  background:white;
}
</style>
</head>

<body>

<div class="progress" id="progress"></div>
<div class="container" id="app"></div>

<div class="controls">
  <button onclick="prev()">⬅️</button>
  <button onclick="toggleTheme()">🌙</button>
  <button onclick="next()">➡️</button>
</div>

<script>

/* 👉 ВСТАВЬ СЮДА СВОЮ ССЫЛКУ Gumroad */
const BUY_LINK = "https://ВАША_ССЫЛКА.gumroad.com/l/book";

/* состояние */
let state = {
  screen: "home",
  page: 0
};

/* текст */
let text = `
А ты пойдёшь с нами, Господи?

Этот день я вспоминаю всегда...

Мы шли по льду...

Мы успели. Слава Богу.
`;

/* страницы */
function splitText(t){
  let words = t.split(" ");
  let pages=[],page="";
  words.forEach(w=>{
    page+=w+" ";
    if(page.length>900){
      pages.push("<p>"+page+"</p>");
      page="";
    }
  });
  if(page) pages.push("<p>"+page+"</p>");
  return pages;
}

let pages = splitText(text);

/* ГЛАВНАЯ */
function showHome(){
  app.innerHTML = `
  <div class="hero">
    <h1>Вера Климошенко</h1>
    <p style="opacity:0.7;">Автор книги</p>

    <img src="https://i.postimg.cc/8z0t9b2T/author.jpg">

    <h2 style="margin-top:30px;">Слова — это следы души</h2>

    <p style="opacity:0.8; max-width:500px; margin:auto;">
    Живые истории о вере, надежде и Божьей помощи
    </p>

    <button onclick="openBook()">📖 Читать</button>
    <button onclick="buyBook()">💳 Купить</button>
  </div>
  `;
}

/* ЧТЕНИЕ */
function openBook(){
  state.screen="read";
  state.page=0;
  render();
}

/* 💰 ПОКУПКА */
function buyBook(){
  window.open(BUY_LINK, "_blank");
}

/* РЕНДЕР */
function render(){

  if(state.screen==="home"){
    showHome();
    return;
  }

  let page = pages[state.page];

  app.innerHTML = page + `
  <p style="text-align:center; opacity:0.5;">
  ${state.page+1} / ${pages.length}
  </p>
  `;

  let percent = (state.page+1)/pages.length*100;
  progress.style.width = percent+"%";
}

/* навигация */
function next(){
  if(state.screen!=="read") return;
  if(state.page < pages.length-1){
    state.page++;
    render();
  }
}

function prev(){
  if(state.screen==="read"){
    if(state.page>0){
      state.page--;
    } else {
      state.screen="home";
      showHome();
    }
  }
}

/* тема */
function toggleTheme(){
  document.body.classList.toggle("dark");
}

/* старт */
window.onload = showHome;

</script>

</body>
</html>
