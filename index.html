<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clean Book App</title>

<style>
body{
  margin:0;
  font-family: Georgia, serif;
  background:#0b0b0b;
  overflow:hidden;
}

/* ===== APP WRAPPER ===== */
.app{
  height:100vh;
  width:100vw;
  position:relative;
}

/* ===== COVER SCREEN ===== */
.cover{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;

  background:
    linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.95)),
    url('https://www.transparenttextures.com/patterns/dark-leather.png');
  background-color:#3a2215;

  color:#f3e3d0;
  text-align:center;

  z-index:10;
  transition:0.8s ease;
}

.cover h1{
  font-size:44px;
  margin:0;
}

.cover button{
  margin-top:20px;
  padding:12px 18px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

/* hide cover */
.cover.hide{
  opacity:0;
  transform:scale(1.1);
  pointer-events:none;
}

/* ===== BOOK VIEW ===== */
.book{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  perspective:2000px;
}

.pages{
  width:800px;
  height:500px;
  position:relative;
  transform-style:preserve-3d;
}

/* spine */
.pages::before{
  content:"";
  position:absolute;
  width:28px;
  height:100%;
  left:50%;
  transform:translateX(-50%);
  background:linear-gradient(#111,#000,#111);
}

/* page */
.page{
  position:absolute;
  width:50%;
  height:100%;
  left:50%;
  transform-origin:left;

  background:#f6f1e3;
  padding:40px;
  box-sizing:border-box;

  transition:0.9s ease;
  box-shadow:0 30px 80px rgba(0,0,0,0.6);
}

.page:nth-child(1){ z-index:5; }
.page:nth-child(2){ z-index:4; }
.page:nth-child(3){ z-index:3; }

.page.flipped{
  transform: rotateY(-180deg);
}

/* UI */
.ui{
  position:fixed;
  bottom:20px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:10px;
  z-index:20;
}

button{
  padding:10px 14px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:white;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="app">

  <!-- 📖 COVER -->
  <div class="cover" id="cover">
    <h1>Слова — следы души</h1>
    <button onclick="openApp()">Открыть книгу</button>
  </div>

  <!-- 📚 BOOK -->
  <div class="book">

    <div class="pages">

      <div class="page">
        <h1>Глава 1</h1>
        <p>Это чистая версия приложения книги.</p>
      </div>

      <div class="page">
        <h1>Глава 2</h1>
        <p>GitHub больше не ломает структуру.</p>
      </div>

      <div class="page">
        <h1>Глава 3</h1>
        <p>Обложка всегда первая и не обходится через #hash.</p>
      </div>

    </div>

  </div>

</div>

<!-- UI -->
<div class="ui">
  <button onclick="flip()">➡ Flip</button>
  <button onclick="reset()">🔄 Reset</button>
</div>

<script>

const cover = document.getElementById("cover");
const pages = document.querySelectorAll(".page");

let i = 0;

/* 🚪 OPEN APP */
function openApp(){
  cover.classList.add("hide");
}

/* 📄 FLIP */
function flip(){
  if(i < pages.length){
    pages[i].classList.add("flipped");
    i++;
  }
}

/* 🔄 RESET */
function reset(){
  pages.forEach(p=>p.classList.remove("flipped"));
  i = 0;
}

/* 🚫 HARD BLOCK HASH (CRITICAL FIX) */
if (window.location.hash) {
  history.replaceState(null, null, " ");
}

window.addEventListener("hashchange", ()=>{
  history.replaceState(null, null, " ");
});

</script>

</body>
</html>
