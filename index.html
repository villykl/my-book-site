<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultra Premium Book</title>

<style>
body{
  margin:0;
  background: radial-gradient(circle at center, #2a2a2a, #0f0f0f);
  font-family: Georgia, serif;
  overflow:hidden;
}

/* ===== STAGE ===== */
.stage{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  perspective:2500px;
}

/* ===== BOOK ===== */
.book{
  width:760px;
  height:480px;
  position:relative;
  transform-style:preserve-3d;
  transition:transform 1s ease;
}

/* ===== SPINE (THICKNESS) ===== */
.book::before{
  content:"";
  position:absolute;
  width:20px;
  height:100%;
  left:50%;
  transform:translateX(-50%);
  background:#111;
  z-index:0;
}

/* ===== COVER ===== */
.cover{
  position:absolute;
  width:50%;
  height:100%;
  left:50%;
  transform-origin:left;
  background: url('https://images.unsplash.com/photo-1524995997946-a1c2e315a42f') center/cover;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  box-shadow:0 40px 80px rgba(0,0,0,0.7);
  transition: transform 1.2s ease;
  z-index:10;
}

/* OPEN COVER */
.book.open .cover{
  transform: rotateY(-180deg);
}

/* ===== PAGES ===== */
.page{
  position:absolute;
  width:50%;
  height:100%;
  left:50%;
  transform-origin:left;
  background:#fdfaf3;
  box-shadow:0 20px 50px rgba(0,0,0,0.4);
  padding:40px;
  box-sizing:border-box;
  transition:transform 1s cubic-bezier(.77,0,.18,1);
  overflow:hidden;
}

/* stacking */
.page:nth-child(2){ z-index:5; }
.page:nth-child(3){ z-index:4; }
.page:nth-child(4){ z-index:3; }
.page:nth-child(5){ z-index:2; }

/* flipped */
.page.flipped{
  transform: rotateY(-180deg);
}

/* text */
h1{
  text-align:center;
  font-size:26px;
}

p{
  font-size:17px;
  line-height:1.8;
}

/* ===== LIGHT SHADOW DEPTH ===== */
.page::after{
  content:"";
  position:absolute;
  top:0;
  right:0;
  width:20px;
  height:100%;
  background:linear-gradient(to left, rgba(0,0,0,0.1), transparent);
}

/* ===== CONTROLS ===== */
.controls{
  position:fixed;
  bottom:20px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:10px;
}

button{
  padding:10px 18px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  background:white;
  font-weight:bold;
}
button:hover{
  transform:scale(1.05);
}
</style>
</head>

<body>

<div class="stage">

  <div class="book" id="book">

    <!-- COVER -->
    <div class="cover" onclick="openBook()">
      📖 CLICK TO OPEN
    </div>

    <!-- PAGES -->
    <div class="page">
      <h1>Глава 1</h1>
      <p>Это Ultra Premium книга. Теперь у неё есть глубина, тень и ощущение настоящих страниц.</p>
    </div>

    <div class="page">
      <h1>Глава 2</h1>
      <p>Перелистывание работает как физическая книга с 3D вращением.</p>
    </div>

    <div class="page">
      <h1>Глава 3</h1>
      <p>Ты можешь вставить сюда любые свои тексты — это твоя цифровая книга.</p>
    </div>

  </div>
</div>

<!-- CONTROLS -->
<div class="controls">
  <button onclick="flip()">➡ Перелистнуть</button>
  <button onclick="resetBook()">🔄 Сброс</button>
</div>

<script>
const book = document.getElementById("book");
const pages = document.querySelectorAll(".page");
let index = 0;

function openBook(){
  book.classList.add("open");
}

function flip(){
  if(index < pages.length){
    pages[index].classList.add("flipped");
    index++;
  }
}

/* reset */
function resetBook(){
  pages.forEach(p => p.classList.remove("flipped"));
  book.classList.remove("open");
  index = 0;
}

/* keyboard control */
document.addEventListener("keydown",(e)=>{
  if(e.key==="ArrowRight") flip();
  if(e.key==="ArrowLeft") resetBook();
});
</script>

</body>
</html>
