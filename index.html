<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Вера Климошенко — Слова это следы души</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  background: radial-gradient(circle, #0a0a0a, #000);
  font-family: Georgia, serif;
  overflow: hidden;
}

/* СЦЕНА */
.scene {
  width: 100%;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* КНИГА */
.book {
  width: 320px;
  height: 420px;
  position: relative;
  perspective: 2000px;
}

/* СТРАНИЦА */
.page {
  width: 100%;
  height: 100%;
  position: absolute;
  background: #f4f1ea;
  transform-origin: left;
  transition: transform 1s ease;
  border-radius: 5px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.5);
  padding: 20px;
  box-sizing: border-box;
}

/* ПЕРЕВОРОТ */
.page.flipped {
  transform: rotateY(-180deg);
}

/* ОБЛОЖКА */
.cover {
  background: linear-gradient(145deg, #1a1a1a, #000);
  color: white;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  cursor: pointer;
}

.poem {
  font-style: italic;
  line-height: 1.7;
}
</style>
</head>

<body>

<div class="scene">
  <div class="book" id="book">

    <div class="page cover" onclick="startBook()">
      <div>
        <h2>Слова — это следы души</h2>
        <p>Вера Климошенко</p>
        <small>Нажми, чтобы открыть</small>
      </div>
    </div>

    <div class="page">
      <h3>Добро пожаловать</h3>
      <p>Это книга чувств и мыслей.</p>
    </div>

    <div class="page">
      <h3>Стихи</h3>
      <div class="poem">
      Тишина говорит со мной,<br>
      Словно ветер в пустом окне...
      </div>
    </div>

    <div class="page">
      <h3>Рассказы</h3>
      <p>Однажды ночью город молчал...</p>
    </div>

    <div class="page">
      <h3>Автор</h3>
      <p>Вера Климошенко</p>
    </div>

  </div>
</div>

<audio id="sound" src="https://www.soundjay.com/page-flip-01a.mp3"></audio>

<script>
let pages = document.querySelectorAll(".page");
let current = 0;
let startX = 0;

/* СТАРТ */
function startBook() {
  flipNext();
}

/* ПЕРЕВОРОТ */
function flipNext() {
  if (current < pages.length) {
    pages[current].classList.add("flipped");
    current++;
    playSound();
  }
}

function flipPrev() {
  if (current > 0) {
    current--;
    pages[current].classList.remove("flipped");
    playSound();
  }
}

/* ЗВУК */
function playSound() {
  let s = document.getElementById("sound");
  s.currentTime = 0;
  s.play();
}

/* СВАЙП */
document.addEventListener("touchstart", e => {
  startX = e.touches[0].clientX;
});

document.addEventListener("touchend", e => {
  let endX = e.changedTouches[0].clientX;

  if (endX < startX - 50) flipNext();
  if (endX > startX + 50) flipPrev();
});

/* МЫШКА */
document.addEventListener("mousedown", e => {
  startX = e.clientX;
});

document.addEventListener("mouseup", e => {
  let endX = e.clientX;

  if (endX < startX - 50) flipNext();
  if (endX > startX + 50) flipPrev();
});
</script>

</body>
</html>
