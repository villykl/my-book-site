<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Слова — это следы души</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  background: black;
  font-family: Georgia, serif;
  overflow: hidden;
  color: white;
}

/* ФОН (живой) */
canvas {
  position: fixed;
  top: 0;
  left: 0;
  z-index: -1;
}

/* КНИГА */
.book {
  width: 320px;
  height: 450px;
  position: absolute;
  left: 50%;
  top: 45%;
  transform: translate(-50%, -50%);
  perspective: 3000px;
}

/* СТРАНИЦЫ */
.page {
  width: 100%;
  height: 100%;
  position: absolute;
  background: #f4f1ea;
  transform-origin: left;
  transition: transform 0.8s ease;
  padding: 20px;
  box-sizing: border-box;
  color: #222;
}

.page.flipped {
  transform: rotateY(-180deg);
}

/* ОБЛОЖКА */
.cover {
  background: linear-gradient(145deg, #222, #000);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

/* НАВИГАЦИЯ (как приложение) */
.nav {
  position: fixed;
  bottom: 0;
  width: 100%;
  display: flex;
  justify-content: space-around;
  background: rgba(0,0,0,0.9);
  padding: 10px 0;
}

.nav button {
  background: none;
  border: none;
  color: #aaa;
  font-size: 14px;
}

.nav button.active {
  color: white;
}

/* КРОССВОРД */
.cell {
  width: 35px;
  height: 35px;
  margin: 3px;
  text-align: center;
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="book" id="book">

  <div class="page cover">
    <div>
      <h1>Слова — это следы души</h1>
      <p>Автор: Ты</p>
    </div>
  </div>

  <div class="page">
    <h2>Стихи</h2>
    <p>Тишина говорит со мной...</p>
  </div>

  <div class="page">
    <h2>Рассказы</h2>
    <p>Однажды ночью...</p>
  </div>

  <div class="page">
    <h2>Кроссворд</h2>
    <input class="cell" maxlength="1">
    <input class="cell" maxlength="1">
    <input class="cell" maxlength="1">
    <br><br>
    <button onclick="check(event)">Проверить</button>
    <p id="result"></p>
  </div>

</div>

<!-- НАВИГАЦИЯ -->
<div class="nav">
  <button onclick="go(0)">📕</button>
  <button onclick="go(1)">✍️</button>
  <button onclick="go(2)">📖</button>
  <button onclick="go(3)">🧩</button>
</div>

<audio id="flipSound" src="https://www.soundjay.com/page-flip-01a.mp3"></audio>

<script>
let pages = document.querySelectorAll(".page");
let current = 0;

/* ПЕРЕХОД */
function go(n) {
  pages.forEach(p => p.classList.remove("flipped"));

  for (let i = 0; i < n; i++) {
    pages[i].classList.add("flipped");
  }

  current = n;
  localStorage.setItem("appPage", n);
  sound();
}

/* ЗВУК */
function sound() {
  let s = document.getElementById("flipSound");
  s.currentTime = 0;
  s.play();
}

/* ЗАГРУЗКА */
window.onload = () => {
  let saved = localStorage.getItem("appPage");
  if (saved) go(parseInt(saved));
};

/* КРОССВОРД */
function check(e) {
  e.stopPropagation();
  let letters = document.querySelectorAll('.cell');
  let word = "";
  letters.forEach(l => word += l.value.toLowerCase());
  document.getElementById("result").innerText =
    word === "мир" ? "Правильно ✅" : "Попробуй ещё ❌";
}

/* ЖИВОЙ ФОН */
let canvas = document.getElementById("bg");
let ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

for (let i = 0; i < 60; i++) {
  particles.push({
    x: Math.random()*canvas.width,
    y: Math.random()*canvas.height,
    r: Math.random()*2,
    d: Math.random()*1
  });
}

function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = "white";

  particles.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fill();
    p.y += p.d;

    if (p.y > canvas.height) {
      p.y = 0;
      p.x = Math.random()*canvas.width;
    }
  });

  requestAnimationFrame(draw);
}

draw();
</script>

</body>
</html>
