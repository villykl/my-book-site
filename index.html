<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Слова — это следы души</title>

<style>
:root {
  --bg: #0b0b0b;
  --card: #141414;
  --text: #f5f1e8;
  --muted: rgba(245,241,232,0.6);
  --accent: #d6b36a;
}

/* 🌑 GLOBAL */
body {
  margin: 0;
  font-family: Georgia, serif;
  background: var(--bg);
  color: var(--text);
}

/* 📚 LIBRARY VIEW */
.library {
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}

/* 📕 COVER */
.cover {
  width: 320px;
  height: 460px;
  background: linear-gradient(145deg, #1a1a1a, #0f0f0f);
  border-radius: 18px;
  box-shadow: 0 40px 120px rgba(0,0,0,0.7);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  cursor: pointer;
  transition: transform 0.4s ease;
}

.cover:hover {
  transform: scale(1.03);
}

.cover h1 {
  font-size: 22px;
  text-align: center;
  color: var(--accent);
  margin-bottom: 10px;
}

.cover p {
  color: var(--muted);
  font-size: 14px;
}

/* 📖 READER */
.reader {
  display: none;
  height: 100vh;
  flex-direction: column;
}

/* TOP BAR */
.topbar {
  padding: 20px;
  display: flex;
  justify-content: space-between;
  border-bottom: 1px solid #222;
  background: #0e0e0e;
}

button {
  background: #1c1c1c;
  color: var(--text);
  border: none;
  padding: 8px 14px;
  border-radius: 10px;
  cursor: pointer;
}

/* CONTENT */
.content {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 40px;
}

.page {
  max-width: 700px;
  background: var(--card);
  padding: 60px;
  border-radius: 16px;
  box-shadow: 0 30px 100px rgba(0,0,0,0.6);
}

h2 {
  color: var(--accent);
  margin-bottom: 20px;
}

p {
  line-height: 1.7;
  font-size: 18px;
}

/* 📚 TOC */
.toc {
  position: absolute;
  left: 20px;
  top: 80px;
  width: 220px;
}

.toc-item {
  padding: 10px;
  cursor: pointer;
  color: var(--muted);
}

.toc-item:hover {
  color: var(--text);
}

.toc-item.active {
  color: var(--accent);
}
</style>
</head>

<body>

<!-- 📕 LIBRARY -->
<div class="library" id="library">
  <div class="cover" onclick="openBook()">
    <h1>Слова — это следы души</h1>
    <p>Вера Климошенко</p>
  </div>
</div>

<!-- 📖 READER -->
<div class="reader" id="reader">

  <div class="topbar">
    <button onclick="backToLibrary()">← Библиотека</button>
    <button onclick="prev()">◀</button>
    <button onclick="next()">▶</button>
  </div>

  <div class="toc" id="toc"></div>

  <div class="content">
    <div class="page" id="page"></div>
  </div>

</div>

<script>

/* 📚 BOOK */
const book = {
  title: "Слова — это следы души",
  chapters: [
    { title: "Вступление", text: "Слова сопровождают нас всю жизнь. Они становятся отражением нашего внутреннего мира." },
    { title: "Глава I", text: "Каждое слово — это след души. Оно может ранить или исцелять." },
    { title: "Глава II", text: "Иногда слова становятся светом в темноте, направляя нас вперёд." },
    { title: "Эпилог", text: "Всё сказанное остаётся. В словах живёт память." }
  ]
};

let current = 0;

/* 📕 OPEN BOOK */
function openBook() {
  document.getElementById("library").style.display = "none";
  document.getElementById("reader").style.display = "flex";
  initTOC();
  render();
}

/* 📚 BACK */
function backToLibrary() {
  document.getElementById("reader").style.display = "none";
  document.getElementById("library").style.display = "flex";
}

/* 📑 TOC */
function initTOC() {
  const toc = document.getElementById("toc");
  toc.innerHTML = "";

  book.chapters.forEach((c, i) => {
    const div = document.createElement("div");
    div.className = "toc-item";
    div.innerText = c.title;
    div.onclick = () => go(i);
    toc.appendChild(div);
  });
}

/* 📖 RENDER */
function render() {
  const ch = book.chapters[current];

  document.getElementById("page").innerHTML = `
    <h2>${ch.title}</h2>
    <p>${ch.text}</p>
  `;

  updateTOC();
}

/* 🔥 TOC STATE */
function updateTOC() {
  document.querySelectorAll(".toc-item").forEach((el, i) => {
    el.classList.toggle("active", i === current);
  });
}

/* ▶ NEXT */
function next() {
  if (current < book.chapters.length - 1) {
    current++;
    render();
  }
}

/* ◀ PREV */
function prev() {
  if (current > 0) {
    current--;
    render();
  }
}

/* 📌 GO */
function go(i) {
  current = i;
  render();
}

</script>

</body>
</html>
