<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRO Reader</title>

<style>
:root {
  --bg: #0e0e0e;
  --card: #ffffff;
  --text: #111;
  --accent: #c7a76c;
}

body.dark {
  --bg: #0e0e0e;
  --card: #1b1b1b;
  --text: #f5f1e8;
}

body {
  margin: 0;
  font-family: Georgia, serif;
  background: var(--bg);
  color: var(--text);
  transition: 0.3s;
}

/* 📖 APP */
.app {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

/* 📊 TOP BAR */
.topbar {
  position: sticky;
  top: 0;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(10px);
  padding: 10px;
  display: flex;
  justify-content: space-between;
  gap: 10px;
  z-index: 10;
}

.topbar input {
  flex: 1;
  padding: 8px;
  border-radius: 8px;
  border: none;
}

/* 📖 READER */
.reader {
  background: var(--card);
  color: var(--text);
  padding: 60px;
  margin-top: 20px;
  border-radius: 14px;
  box-shadow: 0 30px 80px rgba(0,0,0,0.4);
  min-height: 60vh;
  transition: opacity 0.2s;
}

h1, h2 { text-align: center; }

/* 📚 NAV */
.nav {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 20px;
}

button {
  padding: 10px 14px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  background: #222;
  color: white;
}

/* 📊 PROGRESS */
.progress {
  height: 4px;
  background: #333;
  margin-top: 10px;
  border-radius: 10px;
  overflow: hidden;
}

.bar {
  height: 100%;
  width: 0%;
  background: var(--accent);
  transition: 0.3s;
}

/* 📌 bookmark */
.bookmark {
  cursor: pointer;
}
</style>
</head>

<body>

<div class="app">

  <!-- 📊 TOP BAR -->
  <div class="topbar">
    <input id="search" placeholder="Поиск по книге..." oninput="searchText()">
    <button onclick="toggleTheme()">🌙</button>
    <button onclick="bookmark()">📌</button>
  </div>

  <!-- 📖 READER -->
  <div class="reader" id="reader"></div>

  <!-- 📊 PROGRESS -->
  <div class="progress">
    <div class="bar" id="bar"></div>
  </div>

  <!-- NAV -->
  <div class="nav">
    <button onclick="prev()">◀</button>
    <button onclick="next()">▶</button>
  </div>

</div>

<script>
const pages = [
"Слова — это следы души. Вера Климошенко.",
"Вступление: Слова сопровождают нас всю жизнь...",
"Глава I: Каждое слово — это след души...",
"Глава II: Иногда слова становятся светом...",
"Эпилог: Всё сказанное остаётся..."
];

let i = parseInt(localStorage.getItem("page") || "0");
let bookmarkPage = localStorage.getItem("bookmark");

const el = document.getElementById("reader");
const bar = document.getElementById("bar");

/* 📖 render */
function render() {
  el.style.opacity = 0;

  setTimeout(() => {
    el.innerHTML = `
      <h2>Слово</h2>
      <p>${pages[i]}</p>
      ${bookmarkPage == i ? "<p class='bookmark'>📌 Закладка</p>" : ""}
    `;

    el.style.opacity = 1;

    localStorage.setItem("page", i);
    updateProgress();
  }, 120);
}

/* 📊 progress */
function updateProgress() {
  let percent = (i / (pages.length - 1)) * 100;
  bar.style.width = percent + "%";
}

/* ➡️ next */
function next() {
  if (i < pages.length - 1) i++;
  render();
}

/* ⬅️ prev */
function prev() {
  if (i > 0) i--;
  render();
}

/* 🌙 theme */
function toggleTheme() {
  document.body.classList.toggle("dark");
}

/* 📌 bookmark */
function bookmark() {
  localStorage.setItem("bookmark", i);
  alert("Закладка сохранена");
  render();
}

/* 🔍 search */
function searchText() {
  let q = document.getElementById("search").value.toLowerCase();

  let found = pages.findIndex(p => p.toLowerCase().includes(q));
  if (found !== -1) {
    i = found;
    render();
  }
}

/* 📱 swipe */
let startX = 0;

document.addEventListener("touchstart", e => startX = e.touches[0].clientX);

document.addEventListener("touchend", e => {
  let diff = e.changedTouches[0].clientX - startX;

  if (diff < -60) next();
  if (diff > 60) prev();
});

/* init */
render();
</script>

</body>
</html>
