<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Вера Климошенко — Книги</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin:0;
  font-family: Georgia, serif;
  background:#fdfbf7;
  color:#222;
}

/* ТЁМНАЯ ТЕМА */
.dark {
  background:#111;
  color:#eee;
}

/* КОНТЕЙНЕР */
.container {
  max-width:700px;
  margin:auto;
  padding:20px;
}

/* КНОПКИ */
button {
  display:block;
  width:100%;
  margin:10px 0;
  padding:12px;
  font-size:18px;
}

/* НАВИГАЦИЯ */
.controls {
  position:fixed;
  bottom:10px;
  width:100%;
  display:flex;
  justify-content:space-around;
}

.controls button {
  width:auto;
}

/* ТЕКСТ */
p {
  font-size:20px;
  line-height:1.8;
}

/* АВТОР */
.author {
  text-align:center;
  margin-top:40px;
}

.author img {
  width:150px;
  border-radius:50%;
}
</style>
</head>

<body>

<div class="container" id="app"></div>

<div class="controls">
  <button onclick="prev()">⬅️</button>
  <button onclick="toggleTheme()">🌙</button>
  <button onclick="next()">➡️</button>
</div>

<script>

/* СОСТОЯНИЕ */
let state = {
  screen: localStorage.getItem("screen") || "books",
  book: parseInt(localStorage.getItem("book")) || 0,
  chapter: parseInt(localStorage.getItem("chapter")) || 0,
  page: parseInt(localStorage.getItem("page")) || 0
};

/* КНИГИ С ГЛАВАМИ */
let books = [

{
title: "Слова — это следы души",
chapters: [

{
title: "А ты пойдёшь с нами, Господи?",
pages: [
`<h2>А ты пойдёшь с нами, Господи?</h2><p>Этот день я вспоминаю всегда...</p>`,
`<p>Прямого поезда не было...</p>`,
`<p>Мы шли по льду...</p>`,
`<p>Мы успели. Слава Богу.</p>`
]
}

]
},

{
title: "Вторая книга",
chapters: [

{
title: "Новый рассказ",
pages: [
`<h2>Новый рассказ</h2><p>Здесь будет твой текст...</p>`,
`<p>Добавь сюда новые истории</p>`
]
}

]
}

];

/* ЭКРАНЫ */
function showBooks(){
  app.innerHTML = "<h1>📚 Книги</h1>";

  books.forEach((b,i)=>{
    app.innerHTML += `<button onclick="openBook(${i})">${b.title}</button>`;
  });

  app.innerHTML += `
  <div class="author">
    <h3>Вера Климошенко</h3>
    <img src="https://i.postimg.cc/8z0t9b2T/author.jpg">
  </div>`;
}

function openBook(i){
  state.book = i;
  state.screen = "chapters";
  save();
  showChapters();
}

function showChapters(){
  let b = books[state.book];
  app.innerHTML = `<h1>${b.title}</h1>`;

  b.chapters.forEach((c,i)=>{
    app.innerHTML += `<button onclick="openChapter(${i})">${c.title}</button>`;
  });
}

function openChapter(i){
  state.chapter = i;
  state.page = 0;
  state.screen = "read";
  save();
  render();
}

/* ЧТЕНИЕ */
function render(){
  if(state.screen === "books") return showBooks();
  if(state.screen === "chapters") return showChapters();

  let page = books[state.book].chapters[state.chapter].pages[state.page];
  app.innerHTML = page;
}

/* НАВИГАЦИЯ */
function next(){
  if(state.screen !== "read") return;

  let pages = books[state.book].chapters[state.chapter].pages;

  if(state.page < pages.length-1){
    state.page++;
  }

  save();
  render();
}

function prev(){
  if(state.screen === "read"){
    if(state.page > 0){
      state.page--;
    } else {
      state.screen = "chapters";
    }
  } else if(state.screen === "chapters"){
    state.screen = "books";
  }

  save();
  render();
}

/* СОХРАНЕНИЕ */
function save(){
  localStorage.setItem("screen", state.screen);
  localStorage.setItem("book", state.book);
  localStorage.setItem("chapter", state.chapter);
  localStorage.setItem("page", state.page);
}

/* ТЕМА */
function toggleTheme(){
  document.body.classList.toggle("dark");
}

/* СТАРТ */
window.onload = render;

</script>

</body>
</html>
