<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Canvas Apple Books Engine</title>

<style>
html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
}

/* 📱 APP STAGE */
.stage {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at center, #151515, #000);
}

/* 📖 CANVAS BOOK */
canvas {
    border-radius: 12px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
}
</style>
</head>

<body>

<div class="stage">
    <canvas id="book" width="1000" height="650"></canvas>
</div>

<script>
const canvas = document.getElementById("book");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;

/* 📖 PAGES (твой контент) */
const pages = [
    {
        type: "cover",
        title: "Слова — это следы души",
        author: "Вера Климошенко",
        image: "https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?auto=format&fit=crop&w=1600&q=80"
    },
    {
        title: "Вступление",
        text: "Слова сопровождают нас всю жизнь. Иногда они становятся домом, иногда — дыханием памяти."
    },
    {
        title: "Глава I",
        text: "Каждое слово — это след души. Оно остаётся даже тогда, когда мы его уже не слышим."
    },
    {
        title: "Глава II",
        text: "Иногда слова становятся светом, который невозможно погасить."
    },
    {
        title: "Эпилог",
        text: "Всё сказанное остаётся. Даже если исчезает голос."
    }
];

let pageIndex = 0;
let anim = 0;
let dragging = false;
let startX = 0;
let offset = 0;

/* 📖 RENDER PAGE */
function drawPage(i, xOffset = 0) {
    const p = pages[i];
    if (!p) return;

    ctx.save();
    ctx.translate(xOffset, 0);

    // background
    if (p.type === "cover") {
        const img = new Image();
        img.src = p.image;

        ctx.drawImage(img, 0, 0, W, H);

        ctx.fillStyle = "rgba(0,0,0,0.55)";
        ctx.fillRect(0, 0, W, H);

        ctx.fillStyle = "#f5e7d3";
        ctx.textAlign = "center";

        ctx.font = "48px Georgia";
        ctx.fillText(p.title, W/2, H/2 - 20);

        ctx.font = "22px Georgia";
        ctx.fillText(p.author, W/2, H/2 + 30);
    } else {
        ctx.fillStyle = "#fffdf7";
        ctx.fillRect(0, 0, W, H);

        ctx.fillStyle = "#111";
        ctx.textAlign = "center";

        ctx.font = "28px Georgia";
        ctx.fillText(p.title, W/2, 100);

        ctx.font = "20px Georgia";

        wrapText(p.text, W/2, 180, 700, 30);
    }

    ctx.restore();
}

/* 📄 TEXT WRAP */
function wrapText(text, x, y, maxWidth, lineHeight) {
    const words = text.split(" ");
    let line = "";

    for (let n = 0; n < words.length; n++) {
        let testLine = line + words[n] + " ";
        let metrics = ctx.measureText(testLine);
        let testWidth = metrics.width;

        if (testWidth > maxWidth && n > 0) {
            ctx.fillText(line, x, y);
            line = words[n] + " ";
            y += lineHeight;
        } else {
            line = testLine;
        }
    }
    ctx.fillText(line, x, y);
}

/* 📖 MAIN DRAW LOOP */
function render() {
    ctx.clearRect(0, 0, W, H);

    let nextIndex = pageIndex + 1;

    drawPage(pageIndex, offset);
    drawPage(nextIndex, offset + W);

    // flip shadow
    ctx.fillStyle = "rgba(0,0,0," + Math.abs(offset)/800 + ")";
    ctx.fillRect(0, 0, W, H);

    requestAnimationFrame(render);
}
render();

/* 📱 DRAG CONTROL */
canvas.addEventListener("mousedown", e => {
    dragging = true;
    startX = e.clientX;
});

canvas.addEventListener("mouseup", e => {
    dragging = false;

    if (offset < -150 && pageIndex < pages.length - 1) {
        pageIndex++;
    }

    if (offset > 150 && pageIndex > 0) {
        pageIndex--;
    }

    offset = 0;
});

canvas.addEventListener("mousemove", e => {
    if (!dragging) return;
    offset = e.clientX - startX;
});

/* 📱 TOUCH */
canvas.addEventListener("touchstart", e => {
    dragging = true;
    startX = e.touches[0].clientX;
});

canvas.addEventListener("touchmove", e => {
    if (!dragging) return;
    offset = e.touches[0].clientX - startX;
});

canvas.addEventListener("touchend", () => {
    dragging = false;

    if (offset < -150 && pageIndex < pages.length - 1) {
        pageIndex++;
    }

    if (offset > 150 && pageIndex > 0) {
        pageIndex--;
    }

    offset = 0;
});
</script>

</body>
</html>
