<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Вера Климошенко — Слова это следы души</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin:0;
  font-family: Georgia, serif;
  background:#111;
  color:#000;
  overflow:hidden;
}

/* КНИГА */
.book {
  width:100%;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  perspective:2000px;
}

/* СТРАНИЦА */
.page {
  width:320px;
  height:440px;
  background:#fdfbf7;
  position:absolute;
  transform-origin:left;
  box-shadow:0 10px 40px rgba(0,0,0,0.7);
  padding:20px;
  box-sizing:border-box;
  border-radius:8px;
}

/* КНОПКИ */
.ui {
  position:fixed;
  bottom:10px;
  width:100%;
  display:flex;
  justify-content:space-around;
}

button {
  padding:10px;
}

/* ТЁМНАЯ ТЕМА */
.dark .page {
  background:#222;
  color:white;
}
</style>
</head>

<body>

<div class="book" id="book"></div>

<div class="ui">
  <button onclick="prev()">⬅️</button>
  <button onclick="toggleTheme()">🌙</button>
  <button onclick="next()">➡️</button>
</div>

<script>

let content = [

`<h2>Слова — это следы души</h2>
<p style="text-align:center;">Вера Климошенко</p>`,

`<h3>А ты пойдёшь с нами, Господи?</h3>
<p>
Этот день я вспоминаю всегда, когда проезжаю по мосту.
</p>`,

`<p>
Прямого поезда не было. Нам нужно было торопиться.
</p>`,

`<p>
Мы шли по льду. Каждый шаг был испытанием.
</p>`,

`<p>
Мы успели. Слава Богу.
</p>`

];

let current = 0;

/* СОЗДАНИЕ СТРАНИЦ */
function render(){
  let book = document.getElementById("book");
  book.innerHTML = "";

  let page = document.createElement("div");
  page.className = "page";
  page.innerHTML = content[current];

  book.appendChild(page);

  localStorage.setItem("page", current);
}

/* ПЕРЕЛИСТЫВАНИЕ */
function next(){
  if(current < content.length-1){
    current++;
    render();
  }
}

function prev(){
  if(current > 0){
    current--;
    render();
  }
}

/* СВАЙП */
let startX=0;

document.addEventListener("touchstart", e=>{
  startX = e.touches[0].clientX;
});

document.addEventListener("touchend", e=>{
  let dx = startX - e.changedTouches[0].clientX;

  if(dx > 50) next();
  if(dx < -50) prev();
});

/* ТЕМА */
function toggleTheme(){
  document.body.classList.toggle("dark");
}

/* ЗАПУСК */
window.onload = ()=>{
  current = parseInt(localStorage.getItem("page")) || 0;
  render();
};

</script>

</body>
</html>
