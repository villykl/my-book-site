<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Вера Климошенко — Слова это следы души</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  background: radial-gradient(circle, #0a0a0a, #000);
  font-family: Georgia, serif;
  overflow: hidden;
}

/* СЦЕНА */
.scene {
  width: 100%;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* КНИГА */
.book {
  width: 340px;
  height: 440px;
  position: relative;
  perspective: 3000px;
}

/* ЛЕВАЯ СТРАНИЦА */
.left-page {
  position: absolute;
  width: 50%;
  height: 100%;
  left: 0;
  background: #f4f1ea;
  padding: 15px;
  box-sizing: border-box;
  border-radius: 5px 0 0 5px;
}

/* ПРАВАЯ */
.right-page {
  position: absolute;
  width: 50%;
  height: 100%;
  right: 0;
  background: #f4f1ea;
  padding: 15px;
  box-sizing: border-box;
  border-radius: 0 5px 5px 0;
}

/* ПЕРЕВОРАЧИВАЕМАЯ */
.flip {
  position: absolute;
  width: 50%;
  height: 100%;
  right: 0;
  background: #f4f1ea;
  transform-origin: left;
  transform-style: preserve-3d;
  box-shadow: 0 0 20px rgba(0,0,0,0.5);
}

/* ОБЛОЖКА */
.cover {
  background: linear-gradient(145deg,#111,#000);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  cursor: pointer;
}

.poem {
  font-style: italic;
  line-height: 1.7;
}
</style>
</head>

<body>

<div class="scene">

<div class="book" id="book">

  <!-- ЛЕВАЯ -->
  <div class="left-page" id="left"></div>

  <!-- ПРАВАЯ -->
  <div class="right-page" id="right"></div>

  <!-- ПЕРЕЛИСТЫВАЕМАЯ -->
  <div class="flip" id="flip"></div>

</div>

</div>

<audio id="sound" src="https://www.soundjay.com/page-flip-01a.mp3"></audio>

<script>
let data = [
  ["", "Слова — это следы души<br><br>Вера Климошенко"],
  ["Добро пожаловать", "Это книга чувств и мыслей."],
  ["Стихи", "Тишина говорит со мной..."],
  ["Рассказы", "Однажды ночью город молчал..."],
  ["Автор", "Вера Климошенко"]
];

let index = 0;
let dragging = false;
let startX = 0;

function render() {
  document.getElementById("left").innerHTML =
    "<h3>"+(data[index][0]||"")+"</h3>";

  document.getElementById("right").innerHTML =
    "<p class='poem'>"+data[index][1]+"</p>";

  document.getElementById("flip").innerHTML =
    "<p class='poem'>"+(data[index+1]?.[1]||"")+"</p>";

  localStorage.setItem("page", index);
}

/* DRAG */
document.addEventListener("mousedown", start);
document.addEventListener("touchstart", start);

function start(e){
  startX = e.touches ? e.touches[0].clientX : e.clientX;
  dragging = true;
}

document.addEventListener("mousemove", move);
document.addEventListener("touchmove", move);

function move(e){
  if(!dragging) return;

  let x = e.touches ? e.touches[0].clientX : e.clientX;
  let dx = startX - x;

  let percent = Math.min(Math.max(dx/300,0),1);
  let angle = percent * -180;

  document.getElementById("flip").style.transform =
    "rotateY("+angle+"deg)";
}

document.addEventListener("mouseup", end);
document.addEventListener("touchend", end);

function end(e){
  if(!dragging) return;
  dragging = false;

  let x = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
  let dx = startX - x;

  if(dx > 100 && index < data.length-1){
    index++;
    play();
  }

  document.getElementById("flip").style.transform = "rotateY(0deg)";
  render();
}

function play(){
  let s = document.getElementById("sound");
  s.currentTime = 0;
  s.play();
}

/* LOAD */
window.onload = () => {
  index = parseInt(localStorage.getItem("page")) || 0;
  render();
};
</script>

</body>
</html>
