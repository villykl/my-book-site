<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Cover Fix</title>

<style>
body{
  margin:0;
  background:#0b0b0b;
  font-family: Georgia, serif;
  overflow:hidden;
}

/* 📖 COVER FIX */
.cover{
  width:340px;
  height:460px;

  background-image:url("cover.jpg");
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;

  border-radius:14px;

  /* ❌ убираем белый фон/плоскость */
  border:none;
  outline:none;

  /* ✨ Apple Books глубина */
  box-shadow:
    0 40px 90px rgba(0,0,0,0.6),
    0 10px 30px rgba(0,0,0,0.4);

  overflow:hidden;

  transform-origin:left;
  transition:1s ease;

  filter: brightness(1.05) contrast(1.08);
}

/* ✨ лёгкий глянец (как у Apple Books) */
.cover::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    135deg,
    rgba(255,255,255,0.22),
    transparent 45%
  );
  pointer-events:none;
  mix-blend-mode:overlay;
}

/* OPEN EFFECT */
.cover.open{
  transform:rotateY(-120deg) translateX(-90px);
  opacity:0;
}
</style>
</head>

<body>

<div class="cover" id="cover"></div>

<script>
document.getElementById("cover").onclick = () => {
  document.getElementById("cover").classList.add("open");
};
</script>

</body>
</html>
