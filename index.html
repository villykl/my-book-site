<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Слова — это следы души</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Georgia, serif;
  background: #0b0b0b;
  color: #eee;
}

/* ШАПКА */
.header {
  text-align: center;
  padding: 40px 20px;
  background: linear-gradient(#000, #111);
}

.header h1 {
  margin: 0;
  font-size: 32px;
}

.header p {
  opacity: 0.6;
}

/* НАВИГАЦИЯ */
.nav {
  display: flex;
  justify-content: center;
  background: #111;
}

.nav button {
  padding: 15px;
  background: none;
  border: none;
  color: #aaa;
  cursor: pointer;
}

.nav button.active {
  color: white;
  border-bottom: 2px solid white;
}

/* КОНТЕНТ */
.content {
  max-width: 700px;
  margin: auto;
  padding: 30px;
  animation: fade 0.5s;
}

@keyframes fade {
  from {opacity: 0;}
  to {opacity: 1;}
}

/* СТИХИ */
.poem {
  margin-bottom: 30px;
  line-height: 1.6;
}

/* КРОССВОРД */
.cell {
  width: 35px;
  height: 35px;
  margin: 3px;
  text-align: center;
}

/* КНОПКИ */
button {
  font-family: inherit;
}
</style>
</head>

<body>

<div class="header">
  <h1>Слова — это следы души</h1>
  <p>Автор: Ты</p>
</div>

<div class="nav">
  <button onclick="show('home')" class="active">Главная</button>
  <button onclick="show('poems')">Стихи</button>
  <button onclick="show('stories')">Рассказы</button>
  <button onclick="show('game')">Игра</button>
  <button onclick="show('about')">О себе</button>
</div>

<div class="content" id="content"></div>

<script>
function show(section) {

  document.querySelectorAll(".nav button").forEach(b => b.classList.remove("active"));
  event.target.classList.add("active");

  let html = "";

  if (section === "home") {
    html = `
      <h2>Добро пожаловать</h2>
      <p>Это моя книга. Здесь мои мысли, чувства и истории.</p>
    `;
  }

  if (section === "poems") {
    html = `
      <h2>Стихи</h2>

      <div class="poem">
      Тишина говорит со мной,<br>
      Словно ветер в пустом окне...<br><br>
      И я снова ищу покой,<br>
      Но он прячется где-то во мне.
      </div>

      <div class="poem">
      Слова — это следы души,<br>
      Их не скрыть и не стереть...
      </div>
    `;
  }

  if (section === "stories") {
    html = `
      <h2>Рассказы</h2>
      <p>Однажды ночью город молчал...</p>
    `;
  }

  if (section === "game") {
    html = `
      <h2>Кроссворд</h2>
      <input class="cell" maxlength="1">
      <input class="cell" maxlength="1">
      <input class="cell" maxlength="1">
      <br><br>
      <button onclick="check()">Проверить</button>
      <p id="result"></p>
    `;
  }

  if (section === "about") {
    html = `
      <h2>О себе</h2>
      <p>Я автор, который пишет о чувствах и жизни.</p>
    `;
  }

  document.getElementById("content").innerHTML = html;

  localStorage.setItem("section", section);
}

/* ЗАГРУЗКА */
window.onload = () => {
  let saved = localStorage.getItem("section") || "home";
  show(saved);
};

/* КРОССВОРД */
function check() {
  let letters = document.querySelectorAll('.cell');
  let word = "";
  letters.forEach(l => word += l.value.toLowerCase());

  document.getElementById("result").innerText =
    word === "мир" ? "Правильно ✅" : "Попробуй ещё ❌";
}
</script>

</body>
</html>
