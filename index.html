<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kindle V3 Flip Engine</title>

<style>
body {
  margin: 0;
  background: #0e0e0e;
  font-family: Georgia, serif;
  color: #f5f1e8;
  overflow: hidden;
}

/* 📚 LAYOUT */
.app {
  display: flex;
  height: 100vh;
}

/* 📑 SIDEBAR */
.sidebar {
  width: 260px;
  background: #111;
  border-right: 1px solid #222;
  padding: 15px;
  overflow-y: auto;
}

.item {
  padding: 10px;
  margin-bottom: 6px;
  border-radius: 8px;
  cursor: pointer;
  opacity: 0.7;
}

.item:hover {
  background: #222;
}

.item.active {
  background: #2a241a;
  color: #c7a76c;
}

/* 📖 BOOK STAGE */
.stage {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  perspective: 2000px;
}

/* 📄 PAGE */
.page {
  width: 60%;
  height: 70%;
  background: #171717;
  border-radius: 12px;
  padding: 60px;
  box-shadow: 0 40px 120px rgba(0,0,0,0.6);
  transform-origin: left center;
  transition: transform 0.8s ease, opacity 0.8s ease;
  position: absolute;
}

/* FLIP ANIMATION */
.flip-next {
  transform: rotateY(-80deg) translateX(-40px);
  opacity: 0;
}

.flip-prev {
  transform: rotateY(80deg) translateX(40px);
  opacity: 0;
}

/* 📊 NAV */
.nav {
  position: absolute;
  bottom: 30px;
  width: 100%;
  display: flex;
  justify-content: center;
  gap: 10px;
}

button {
  padding: 10px 14px;
  border: none;
  border-radius: 10px;
  background: #222;
  color: white;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="app">

  <!-- 📑 SIDEBAR -->
  <div class="sidebar" id="sidebar"></div>

  <!-- 📖 STAGE -->
  <div class="stage">

    <div class="page" id="page"></div>

    <div class="nav">
      <button onclick="prev()">◀</button>
      <button onclick="next()">▶</button>
    </div>

  </div>

</div>

<script>

/* 📚 BOOK */
const book = {
  title: "Слова — это следы души",
  pages: [
    "Вступление: Слова сопровождают нас всю жизнь...",
    "Глава I: Каждое слово — это след души...",
    "Глава II: Иногда слова становятся светом...",
    "Эпилог: Всё сказанное остаётся..."
  ]
};

let current = 0;
let animating = false;

/* 📑 SIDEBAR */
function initSidebar() {
  const el = document.getElementById("sidebar");

  book.pages.forEach((p, i) => {
    const div = document.createElement("div");
    div.className = "item";
    div.innerText = p.slice(0, 40);

    div.onclick = () => go(i);
    el.appendChild(div);
  });
}

/* 📖 RENDER */
function render() {
  const page = document.getElementById("page");

  page.innerHTML = `
    <h2>${book.title}</h2>
    <p>${book.pages[current]}</p>
  `;

  updateSidebar();
}

/* 🔥 FLIP EFFECT */
function flip(direction, callback) {
  if (animating) return;
  animating = true;

  const page = document.getElementById("page");

  page.classList.add(direction === "next" ? "flip-next" : "flip-prev");

  setTimeout(() => {
    page.classList.remove("flip-next", "flip-prev");
    callback();
    render();
    animating = false;
  }, 400);
}

/* ▶ NEXT */
function next() {
  if (current < book.pages.length - 1) {
    flip("next", () => current++);
  }
}

/* ◀ PREV */
function prev() {
  if (current > 0) {
    flip("prev", () => current--);
  }
}

/* 📌 GO */
function go(i) {
  if (i === current) return;

  const dir = i > current ? "next" : "prev";

  flip(dir, () => current = i);
}

/* 🔥 SIDEBAR ACTIVE */
function updateSidebar() {
  document.querySelectorAll(".item").forEach((el, i) => {
    el.classList.toggle("active", i === current);
  });
}

/* 🚀 INIT */
initSidebar();
render();

</script>

</body>
</html>
