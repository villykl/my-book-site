<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Realistic Page Turn Book</title>

<style>
body{
  margin:0;
  font-family: Georgia, serif;
  background:#0b0b0b;
  overflow:hidden;
}

/* ================= COVER ================= */
#cover{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background: radial-gradient(circle at center, #000, #120a06);
  perspective:1800px;
}

.cover-book{
  width:340px;
  height:460px;

  background:
    linear-gradient(135deg, rgba(0,0,0,0.35), rgba(0,0,0,0.85)),
    url("cover.jpg");

  background-size:cover;
  background-position:center;

  border-radius:8px 18px 18px 8px;

  box-shadow:0 60px 140px rgba(0,0,0,0.9);

  transform-origin:left;
  transition:1.2s cubic-bezier(.2,.8,.2,1);

  position:relative;
  overflow:hidden;

  border-left:6px solid rgba(0,0,0,0.35);
}

.cover-open{
  transform: perspective(1400px)
             rotateY(-115deg)
             translateX(-90px)
             scale(0.92);
  opacity:0.15;
  filter: blur(2px);
}

/* ================= BOOK ================= */
#scene{
  display:none;
  height:100vh;
  align-items:center;
  justify-content:center;
  perspective:2600px;
  background: radial-gradient(circle at center, #1a1a1a, #000);
}

.book{
  width:820px;
  height:520px;
  position:relative;
  transform-style:preserve-3d;
  transform: rotateX(10deg);
}

.book::before{
  content:"";
  position:absolute;
  width:30px;
  height:100%;
  left:50%;
  transform:translateX(-50%);
  background:linear-gradient(#111,#000,#111);
}

/* ================= PAGE (REAL PAPER FEEL) ================= */
.page{
  position:absolute;
  width:50%;
  height:100%;
  left:50%;
  transform-origin:left;

  background:
    linear-gradient(to right, #f8f3e7, #efe6d3);

  padding:40px;
  box-sizing:border-box;

  box-shadow:0 30px 90px rgba(0,0,0,0.6);

  transition:
    transform 1.2s cubic-bezier(.2,.8,.2,1),
    box-shadow 1.2s ease;

  backface-visibility:hidden;
}

/* page edge shading */
.page::after{
  content:"";
  position:absolute;
  top:0;
  right:0;
  width:30px;
  height:100%;
  background:linear-gradient(to left, rgba(0,0,0,0.15), transparent);
}

/* STACK ORDER */
.page:nth-child(1){ z-index:3; }
.page:nth-child(2){ z-index:2; }
.page:nth-child(3){ z-index:1; }

/* ================= REALISTIC CURL ================= */
.page.flipped{
  transform:
    rotateY(-180deg)
    skewY(1.5deg)
    translateX(-20px);

  box-shadow:
    -20px 0 40px rgba(0,0,0,0.4);
}

/* “paper bending highlight” */
.page.flipped::before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:linear-gradient(90deg, rgba(255,255,255,0.15), transparent);
  pointer-events:none;
}

/* ================= UI ================= */
.ui{
  position:fixed;
  right:20px;
  top:50%;
  transform:translateY(-50%);

  display:flex;
  flex-direction:column;
  gap:10px;

  z-index:999;
}

button{
  padding:10px 14px;
  border:none;
  border-radius:12px;
  cursor:pointer;

  background:rgba(255,255,255,0.92);
  font-weight:bold;

  box-shadow:0 10px 25px rgba(0,0,0,0.3);
  backdrop-filter: blur(6px);

  transition:0.2s;
}

button:hover{
  transform:scale(1.05);
}
</style>
</head>

<body>

<!-- 📖 COVER -->
<div id="cover">
  <div class="cover-book" id="coverBook"></div>
</div>

<!-- 📚 BOOK -->
<div id="scene">

  <div class="book">

    <div class="page">
      <h1>Глава 1</h1>
      <p>Реальный paper curl эффект активирован.</p>
    </div>

    <div class="page">
      <h1>Глава 2</h1>
      <p>Страница изгибается как настоящая бумага.</p>
    </div>

    <div class="page">
      <h1>Глава 3</h1>
      <p>Физика перелистывания улучшена.</p>
    </div>

  </div>

</div>

<!-- UI -->
<div class="ui">
  <button onclick="openBook()">📖 Open</button>
  <button onclick="flip()">➡ Next</button>
  <button onclick="back()">⬅ Back</button>
  <button onclick="reset()">🔄 Reset</button>
</div>

<script>

let i = 0;
const pages = document.querySelectorAll(".page");

/* OPEN */
function openBook(){
  document.getElementById("coverBook").classList.add("cover-open");

  setTimeout(()=>{
    document.getElementById("cover").style.display = "none";
    document.getElementById("scene").style.display = "flex";
  }, 900);
}

/* NEXT */
function flip(){
  if(i < pages.length){
    pages[i].classList.add("flipped");
    i++;
  }
}

/* BACK */
function back(){
  if(i > 0){
    i--;
    pages[i].classList.remove("flipped");
  }
}

/* RESET */
function reset(){
  pages.forEach(p=>{
    p.classList.remove("flipped");
    p.style.transform = "";
  });
  i = 0;
}

</script>

</body>
</html>
