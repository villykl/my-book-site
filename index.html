<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Apple Books Cover Engine V5</title>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: radial-gradient(circle at center, #111, #000);
}

#scene {
  width: 100vw;
  height: 100vh;
}

/* 🌑 cinematic vignette */
#scene::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at center,
    transparent 40%,
    rgba(0,0,0,0.7) 100%);
  pointer-events: none;
}
</style>
</head>

<body>

<div id="scene"></div>

<script>
/* =========================
   🎬 APPLE BOOKS V5 ENGINE
========================= */

const scene = new THREE.Scene();

/* 🎥 CAMERA */
const camera = new THREE.PerspectiveCamera(
  55,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);
camera.position.z = 3.2;

/* 🖥 RENDERER */
const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.getElementById("scene").appendChild(renderer.domElement);

/* 💡 LIGHTS (APPLE STYLE) */
const keyLight = new THREE.PointLight(0xffffff, 2);
keyLight.position.set(2, 2, 3);
scene.add(keyLight);

const warmLight = new THREE.PointLight(0xd6b36a, 1.2);
warmLight.position.set(-2, -1, 2);
scene.add(warmLight);

scene.add(new THREE.AmbientLight(0x222222, 1));

/* 📕 COVER TEXTURE */
const loader = new THREE.TextureLoader();
const texture = loader.load("cover.jpg");

/* 📦 BOOK OBJECT */
const geometry = new THREE.PlaneGeometry(2, 3);

const material = new THREE.MeshStandardMaterial({
  map: texture,
  roughness: 0.35,
  metalness: 0.25
});

const book = new THREE.Mesh(geometry, material);
scene.add(book);

/* 🧲 PHYSICS */
let targetX = 0;
let targetY = 0;
let velX = 0;
let velY = 0;

/* 🖱 MOUSE */
document.addEventListener("mousemove", (e) => {
  targetY = (e.clientX / window.innerWidth - 0.5) * 1.4;
  targetX = (e.clientY / window.innerHeight - 0.5) * -1.2;

  keyLight.position.x = targetY * 3;
  keyLight.position.y = targetX * 3;
});

/* 🎬 LOOP */
function animate() {
  requestAnimationFrame(animate);

  velX += (targetX - velX) * 0.06;
  velY += (targetY - velY) * 0.06;

  book.rotation.x = velX;
  book.rotation.y = velY;

  book.position.y = Math.sin(Date.now() * 0.001) * 0.05;

  camera.position.x += (targetY * 0.2 - camera.position.x) * 0.03;
  camera.position.y += (targetX * 0.2 - camera.position.y) * 0.03;

  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
}

animate();

/* 📱 RESIZE */
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
