<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Слова — это следы души</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family: Georgia, serif;
  background:#f5f3ef;
  color:#222;
}

/* контейнер */
#app{
  max-width:700px;
  margin:auto;
  padding:30px;
}

/* обложка */
.cover{
  text-align:center;
  margin-top:50px;
}

.cover img{
  width:260px;
  border-radius:14px;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

h1{
  text-align:center;
  font-size:28px;
  margin-top:30px;
}

h2{
  text-align:center;
  margin-top:40px;
}

h3{
  text-align:center;
  color:#666;
}

/* кнопки */
.menu{
  text-align:center;
  margin-top:30px;
}

.menu button{
  padding:12px 18px;
  margin:6px;
  font-size:16px;
  border:none;
  border-radius:8px;
  background:#222;
  color:white;
  cursor:pointer;
}

.menu button:hover{
  background:#444;
}

/* текст */
p{
  line-height:1.9;
  font-size:18px;
  text-indent:2em;
}

/* стихи */
.poem{
  text-align:center;
  white-space:pre-line;
  text-indent:0;
  font-size:18px;
}

/* перелистывание */
.nav{
  position:fixed;
  bottom:20px;
  width:100%;
  display:flex;
  justify-content:space-between;
  padding:0 20px;
}

.nav button{
  padding:10px 16px;
  font-size:16px;
}
</style>
</head>

<body>

<div id="app"></div>

<div class="nav">
  <button onclick="prev()">←</button>
  <button onclick="next()">→</button>
</div>

<script>

const COVER = "https://i.imgur.com/8QZ7Z8T.png";

let book = [

{type:"cover"},

{
type:"menu",
title:"Оглавление",
items:["📚 Рассказы","✨ Стихи"]
},

{type:"section", title:"📚 Рассказы"},

{
type:"story",
title:"А ты пойдёшь с нами, Господи?",
text:`Вставь сюда полный текст рассказа...`
},

{type:"section", title:"✨ Стихи"},

{
type:"poem",
title:"Гимн весны",
text:`Вставь сюда стих полностью...`
}

];

let current=0;

function render(){
let p=book[current];

if(p.type==="cover"){
app.innerHTML=`
<div class="cover">
<img src="${COVER}">
<h1>Слова — это следы души</h1>
<h3>Вера Климошенко</h3>
<div class="menu">
<button onclick="next()">Открыть книгу</button>
</div>
</div>`;
return;
}

if(p.type==="menu"){
app.innerHTML=`
<h2>${p.title}</h2>
<div class="menu">
${p.items.map((t,i)=>`<button onclick="go(${i+2})">${t}</button>`).join("")}
</div>`;
return;
}

if(p.type==="section"){
app.innerHTML=`<h2>${p.title}</h2>`;
return;
}

if(p.type==="story"){
app.innerHTML=`<h2>${p.title}</h2><p>${p.text}</p>`;
}

if(p.type==="poem"){
app.innerHTML=`<h2>${p.title}</h2><p class="poem">${p.text}</p>`;
}
}

function next(){if(current<book.length-1){current++;render();}}
function prev(){if(current>0){current--;render();}}
function go(i){current=i;render();}

document.addEventListener("click", e=>{
if(e.clientX>window.innerWidth/2) next();
else prev();
});

render();

</script>

</body>
</html>
