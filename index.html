<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apple Studio Book Engine</title>

<style>
body{
  margin:0;
  height:100vh;
  font-family: Georgia, serif;
  background: radial-gradient(circle at center, #151515, #000);
  overflow:hidden;
}

/* 📖 COVER */
#cover{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
}

.cover{
  width:340px;
  height:460px;

  background-image:url("cover.jpg");
  background-size:cover;
  background-position:center;

  border-radius:18px;

  box-shadow:0 120px 240px rgba(0,0,0,0.8);

  position:relative;
  overflow:hidden;

  transform-origin:left;
  transition:1s cubic-bezier(.2,.8,.2,1);
}

.cover::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(135deg, rgba(255,255,255,0.25), transparent 55%);
}

.cover.open{
  transform:rotateY(-120deg) translateX(-90px);
  opacity:0;
}

/* 📚 BOOK */
#reader{
  display:none;
  height:100vh;
  align-items:center;
  justify-content:center;
}

.book{
  width:820px;
  height:520px;
  position:relative;
  perspective:2200px;
  touch-action:none;
}

/* spine */
.book::before{
  content:"";
  position:absolute;
  width:40px;
  height:100%;
  left:50%;
  transform:translateX(-50%);
  background:linear-gradient(#0a0a0a,#000,#0a0a0a);
  z-index:0;
}

/* 📄 PAGE */
.page{
  position:absolute;
  width:50%;
  height:100%;
  left:50%;
  transform-origin:left center;

  background:linear-gradient(to right, #f7f2e6, #efe6d3);

  padding:40px;
  box-sizing:border-box;

  box-shadow:0 40px 90px rgba(0,0,0,0.6);

  transition:transform 1.1s cubic-bezier(.2,.8,.2,1);

  will-change: transform;
  overflow:hidden;
}

/* 🌌 APPLE STUDIO LIGHT */
.page::before{
  content:"";
  position:absolute;
  inset:0;

  background: radial-gradient(
    circle at var(--lx, 50%) var(--ly, 20%),
    rgba(255,255,255,0.35),
    rgba(255,255,255,0.12) 25%,
    transparent 60%
  );

  mix-blend-mode: soft-light;
  pointer-events:none;
}

/* page edge shadow */
.page::after{
  content:"";
  position:absolute;
  right:0;
  top:0;
  width:30px;
  height:100%;
  background:linear-gradient(to left, rgba(0,0,0,0.25), transparent);
  pointer-events:none;
}

.page:nth-child(1){ z-index:3; }
.page:nth-child(2){ z-index:2; }
.page:nth-child(3){ z-index:1; }

.page.flipped{
  transform:rotateY(-180deg);
}

/* 🎛 UI */
.ui{
  position:fixed;
  right:20px;
  top:50%;
  transform:translateY(-50%);
  display:flex;
  flex-direction:column;
  gap:12px;
  z-index:9999;
}

button{
  padding:10px 14px;
  border:none;
  border-radius:12px;
  cursor:pointer;

  background:rgba(255,255,255,0.92);
  font-weight:bold;

  box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

button:active{
  transform:scale(0.96);
}
</style>
</head>

<body>

<!-- 📖 COVER -->
<div id="cover">
  <div class="cover" id="coverBook"></div>
</div>

<!-- 📚 BOOK -->
<div id="reader">
  <div class="book">

    <div class="page">📖 Глава 1</div>
    <div class="page">📖 Глава 2</div>
    <div class="page">📖 Глава 3</div>

  </div>
</div>

<!-- 🎛 UI -->
<div class="ui">
  <button onclick="openBook()">📖 Open</button>
  <button onclick="next()">➡ Next</button>
  <button onclick="back()">⬅ Back</button>
</div>

<script>

let pages = document.querySelectorAll(".page");
let current = 0;

/* 📖 OPEN */
function openBook(){
  document.getElementById("coverBook").classList.add("open");

  setTimeout(()=>{
    document.getElementById("cover").style.display = "none";
    document.getElementById("reader").style.display = "flex";
  },900);
}

/* 🔄 RENDER */
function render(){
  pages.forEach((p,i)=>{
    if(i < current){
      p.classList.add("flipped");
      p.style.transform = "rotateY(-180deg)";
    } else {
      p.classList.remove("flipped");
      p.style.transform = "translateX(0) rotateY(0deg)";
    }
  });
}

/* ➡ NEXT */
function next(){
  if(current < pages.length){
    current++;
    render();
  }
}

/* ⬅ BACK */
function back(){
  if(current > 0){
    current--;
    render();
  }
}

/* 📱 SWIPE PHYSICS */
let startX = 0;
let dragging = false;

function start(e){
  dragging = true;
  startX = e.touches ? e.touches[0].clientX : e.clientX;
}

function move(e){
  if(!dragging) return;

  let x = e.touches ? e.touches[0].clientX : e.clientX;
  let delta = x - startX;

  let page = pages[current];

  if(page){
    let bend = delta * 0.35;
    let rotate = delta * 0.06;

    page.style.transform = `
      translateX(${bend}px)
      rotateY(${rotate}deg)
    `;
  }
}

function end(e){
  if(!dragging) return;
  dragging = false;

  let x = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
  let delta = x - startX;

  let threshold = 90;

  if(delta < -threshold && current < pages.length){
    current++;
  }
  else if(delta > threshold && current > 0){
    current--;
  }

  render();
}

/* 🎛 EVENTS */
document.addEventListener("mousedown", start);
document.addEventListener("mousemove", move);
document.addEventListener("mouseup", end);

document.addEventListener("touchstart", start);
document.addEventListener("touchmove", move);
document.addEventListener("touchend", end);

/* 🌌 APPLE STUDIO LIGHT TRACKING */
document.addEventListener("mousemove", (e) => {
  let x = (e.clientX / window.innerWidth) * 100;
  let y = (e.clientY / window.innerHeight) * 100;

  document.querySelectorAll(".page").forEach(p => {
    p.style.setProperty("--lx", x + "%");
    p.style.setProperty("--ly", y + "%");
  });
});

/* INIT */
render();

</script>

</body>
</html>
