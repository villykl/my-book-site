<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clean Final Book App</title>

<style>
:root {
  --bg: #0e0e0e;
  --card: #171717;
  --text: #f5f1e8;
  --accent: #c7a76c;
}

body {
  margin: 0;
  font-family: Georgia, serif;
  background: var(--bg);
  color: var(--text);
}

/* 📚 LAYOUT */
.container {
  display: flex;
  height: 100vh;
}

/* 📚 SIDEBAR */
.sidebar {
  width: 280px;
  background: #111;
  border-right: 1px solid #222;
  padding: 15px;
  overflow-y: auto;
}

.item {
  padding: 10px;
  margin-bottom: 6px;
  border-radius: 8px;
  cursor: pointer;
  opacity: 0.7;
  transition: 0.2s;
}

.item:hover {
  background: #222;
  opacity: 1;
}

.item.active {
  background: #2a241a;
  color: var(--accent);
  opacity: 1;
}

/* 📖 READER */
.reader {
  flex: 1;
  padding: 40px;
  overflow-y: auto;
}

.page {
  max-width: 800px;
  margin: auto;
  background: var(--card);
  padding: 60px;
  border-radius: 14px;
  box-shadow: 0 30px 100px rgba(0,0,0,0.5);
}

/* 📊 TOP BAR */
.topbar {
  display: flex;
  justify-content: space-between;
  margin-bottom: 20px;
}

button {
  padding: 10px 14px;
  border: none;
  border-radius: 10px;
  background: #222;
  color: white;
  cursor: pointer;
}

/* 📊 PROGRESS */
.progress {
  height: 4px;
  background: #333;
  border-radius: 10px;
  overflow: hidden;
  margin-top: 15px;
}

.bar {
  height: 100%;
  width: 0%;
  background: var(--accent);
  transition: 0.2s;
}

/* 📱 MOBILE */
@media (max-width: 800px) {
  .container { flex-direction: column; }
  .sidebar { width: 100%; display: flex; gap: 10px; }
  .item { white-space: nowrap; }
}
</style>

</head>

<body>

<div class="container">

  <!-- 📚 SIDEBAR -->
  <div class="sidebar" id="sidebar"></div>

  <!-- 📖 READER -->
  <div class="reader">

    <div class="topbar">
      <button onclick="prev()">◀</button>
      <button onclick="next()">▶</button>
    </div>

    <div class="page" id="page"></div>

    <div class="progress">
      <div class="bar" id="bar"></div>
    </div>

  </div>

</div>

<script>

/* 🔒 SINGLE SOURCE OF TRUTH */
const book = {
  title: "Слова — это следы души",
  chapters: [
    "Вступление: Слова сопровождают нас всю жизнь...",
    "Глава I: Каждое слово — это след души...",
    "Глава II: Иногда слова становятся светом...",
    "Эпилог: Всё сказанное остаётся..."
  ]
};

let current = 0;

/* 📚 INIT SIDEBAR */
function init() {
  const sidebar = document.getElementById("sidebar");
  sidebar.innerHTML = "";

  book.chapters.forEach((ch, i) => {
    const div = document.createElement("div");
    div.className = "item";
    div.innerText = ch.slice(0, 40);
    div.onclick = () => go(i);
    sidebar.appendChild(div);
  });
}

/* 📖 RENDER */
function render() {
  document.getElementById("page").innerHTML = `
    <h2>${book.title}</h2>
    <p>${book.chapters[current]}</p>
  `;

  updateSidebar();
  updateProgress();
}

/* 🔥 ACTIVE CHAPTER */
function updateSidebar() {
  const items = document.querySelectorAll(".item");

  items.forEach((el, i) => {
    el.classList.toggle("active", i === current);
  });
}

/* 📊 PROGRESS */
function updateProgress() {
  const percent = (current / (book.chapters.length - 1)) * 100;
  document.getElementById("bar").style.width = percent + "%";
}

/* ▶ NEXT */
function next() {
  if (current < book.chapters.length - 1) {
    current++;
    render();
  }
}

/* ◀ PREV */
function prev() {
  if (current > 0) {
    current--;
    render();
  }
}

/* 📌 GO */
function go(i) {
  current = i;
  render();
}

/* 🚀 START */
init();
render();

</script>

</body>
</html>
