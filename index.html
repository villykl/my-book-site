<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Вера Климошенко — Слова это следы души</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  background: radial-gradient(circle, #0a0a0a, #000);
  font-family: Georgia, serif;
  overflow: hidden;
}

/* СЦЕНА */
.scene {
  width: 100%;
  height: 100vh;
  perspective: 2000px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* КНИГА */
.book {
  width: 320px;
  height: 420px;
  position: relative;
  transform-style: preserve-3d;
}

/* ОБЛОЖКА */
.cover {
  position: absolute;
  width: 100%;
  height: 100%;
  background: linear-gradient(145deg, #1a1a1a, #000);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  transform-origin: left;
  transition: transform 1.5s ease;
  z-index: 5;
  border-radius: 8px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.8);
}

.book.open .cover {
  transform: rotateY(-160deg);
}

/* СТРАНИЦЫ */
.page {
  position: absolute;
  width: 100%;
  height: 100%;
  background: #f4f1ea;
  padding: 20px;
  box-sizing: border-box;
  border-radius: 5px;
}

.pages {
  display: flex;
}

.left, .right {
  width: 50%;
  padding: 10px;
}

/* НАВИГАЦИЯ */
.nav {
  position: fixed;
  bottom: 0;
  width: 100%;
  display: none;
  justify-content: space-around;
  background: rgba(0,0,0,0.9);
  padding: 10px 0;
}

.nav button {
  background: none;
  border: none;
  color: white;
}

.poem {
  font-style: italic;
}
</style>
</head>

<body>

<div class="scene">

  <div class="book" id="book">

    <div class="cover" onclick="openBook()">
      <div>
        <h2>Слова — это следы души</h2>
        <p>Вера Климошенко</p>
        <small>Нажми, чтобы открыть</small>
      </div>
    </div>

    <div class="page">
      <div class="pages">
        <div class="left" id="left"></div>
        <div class="right" id="right"></div>
      </div>
    </div>

  </div>

</div>

<div class="nav" id="nav">
  <button onclick="show(0)">📕</button>
  <button onclick="show(1)">✍️</button>
  <button onclick="show(2)">📖</button>
  <button onclick="show(3)">👤</button>
</div>

<audio id="sound" src="https://www.soundjay.com/page-flip-01a.mp3"></audio>

<script>
let pages = [
  ["Добро пожаловать", "Это книга чувств и мыслей."],
  ["Стихи", "Тишина говорит со мной..."],
  ["Рассказы", "Однажды ночью город молчал..."],
  ["Автор", "Вера Климошенко"]
];

function openBook() {
  document.getElementById("book").classList.add("open");

  let s = document.getElementById("sound");
  s.play();

  setTimeout(() => {
    document.getElementById("nav").style.display = "flex";
    show(0);
  }, 1200);
}

function show(i) {
  document.getElementById("left").innerHTML =
    "<h3>" + pages[i][0] + "</h3>";

  document.getElementById("right").innerHTML =
    "<p class='poem'>" + pages[i][1] + "</p>";
}
</script>

</body>
</html>
