<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Книга — Вера Климошенко</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin:0;
  background:#1e1e1e;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  overflow:hidden;
  font-family: Georgia, serif;
}

#book {
  width:90%;
  max-width:900px;
  height:90vh;
}

.page {
  background:#fdfbf7;
}

.page-content {
  padding:30px;
  font-size:20px;
  line-height:1.8;
  text-indent:2em;
}

.cover {
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100%;
}

.cover img {
  width:220px;
  margin:20px;
  border-radius:10px;
}
</style>
</head>

<body>

<div id="book">
  <div class="page">
    <div class="page-content cover">
      <h1>Слова — это следы души</h1>
      <img src="https://i.imgur.com/8QZ7Z8T.png">
      <h3>Вера Климошенко</h3>
    </div>
  </div>

  <div class="page">
    <div class="page-content">
      А ты пойдёшь с нами, Господи?

      Этот день я вспоминаю всегда, когда проезжаю по мосту.

      Прямого поезда не было. Нам нужно было торопиться.

      Мы оказались не на том берегу...

      Мы шли по льду...

      Мы успели. Слава Богу.
    </div>
  </div>

</div>

<!-- 🔥 БИБЛИОТЕКА КАК В iBooks -->
<script src="https://cdn.jsdelivr.net/npm/turn.js@4/turn.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function(){

  let book = document.getElementById("book");

  if (typeof $(book).turn === "function") {
    $(book).turn({
      width: window.innerWidth * 0.9,
      height: window.innerHeight * 0.9,
      autoCenter: true,
      gradients: true,
      elevation: 50
    });
  }

});
</script>

</body>
</html>
