<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Слова — это следы души</title>

<style>
body {
  margin: 0;
  background: radial-gradient(circle, #111, #000);
  font-family: Georgia, serif;
  color: white;
}

/* МЕНЮ */
.menu {
  position: fixed;
  top: 20px;
  width: 100%;
  text-align: center;
}

.menu button {
  margin: 5px;
  padding: 8px 15px;
  background: #111;
  border: 1px solid #333;
  color: white;
  cursor: pointer;
}

.menu button:hover {
  background: #333;
}

/* КНИГА */
.book {
  width: 90%;
  max-width: 600px;
  margin: 100px auto;
}

.page {
  display: none;
  padding: 20px;
  background: #1a1a1a;
  margin-bottom: 20px;
  border-radius: 10px;
  animation: fadeIn 0.5s;
}

.page.active {
  display: block;
}

/* АНИМАЦИЯ */
@keyframes fadeIn {
  from {opacity: 0; transform: translateY(10px);}
  to {opacity: 1; transform: translateY(0);}
}

/* КРОССВОРД */
.cell {
  width: 40px;
  height: 40px;
  text-align: center;
  font-size: 20px;
  margin: 5px;
}
</style>
</head>

<body>

<div class="menu">
  <button onclick="showPage(1)">Обложка</button>
  <button onclick="showPage(2)">Стихи</button>
  <button onclick="showPage(3)">Рассказы</button>
  <button onclick="showPage(4)">Кроссворд</button>
</div>

<div class="book">

  <div class="page active" id="p1">
    <h1>Слова — это следы души</h1>
    <p>Автор: Ты</p>
  </div>

  <div class="page" id="p2">
    <h2>Глава I — Стихи</h2>
    <p>
    Тишина говорит со мной,<br>
    Словно ветер в пустом окне...<br><br>
    И я снова ищу покой,<br>
    Но он прячется где-то во мне.
    </p>
  </div>

  <div class="page" id="p3">
    <h2>Глава II — Рассказы</h2>
    <p>Однажды ночью город молчал...</p>
  </div>

  <div class="page" id="p4">
    <h2>Глава III — Кроссворд</h2>

    <input maxlength="1" class="cell">
    <input maxlength="1" class="cell">
    <input maxlength="1" class="cell">

    <br><br>

    <button onclick="check()">Проверить</button>
    <p id="result"></p>
  </div>

</div>

<script>
function showPage(n) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('p' + n).classList.add('active');
}

function check() {
  let letters = document.querySelectorAll('.cell');
  let word = "";

  letters.forEach(l => word += l.value.toLowerCase());

  if (word === "мир") {
    document.getElementById("result").innerText = "Правильно ✅";
  } else {
    document.getElementById("result").innerText = "Попробуй ещё ❌";
  }
}
</script>

</body>
</html>
