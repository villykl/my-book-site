<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Single Perfect Book System</title>

<style>
:root {
  --bg: #0e0e0e;
  --card: #171717;
  --text: #f5f1e8;
  --accent: #c7a76c;
}

body {
  margin: 0;
  font-family: Georgia, serif;
  background: var(--bg);
  color: var(--text);
}

/* 📚 LIBRARY */
.header {
  display: flex;
  gap: 10px;
  padding: 15px;
}

.header input {
  flex: 1;
  padding: 10px;
  border-radius: 10px;
  border: none;
}

/* GRID */
.library {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 16px;
  padding: 20px;
}

.book {
  background: var(--card);
  border-radius: 14px;
  overflow: hidden;
  cursor: pointer;
  transition: 0.2s;
}

.book:hover {
  transform: translateY(-4px);
}

.cover {
  height: 220px;
  background-size: cover;
  background-position: center;
}

.title {
  padding: 10px;
  font-size: 14px;
}

/* 📖 READER */
.reader {
  display: none;
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

.page {
  background: var(--card);
  padding: 60px;
  border-radius: 14px;
  min-height: 60vh;
  box-shadow: 0 30px 100px rgba(0,0,0,0.5);
}

/* TOP BAR */
.topbar {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
}

button {
  padding: 10px 14px;
  border: none;
  border-radius: 10px;
  background: #222;
  color: white;
  cursor: pointer;
}

/* PROGRESS */
.progress {
  height: 4px;
  background: #333;
  border-radius: 10px;
  overflow: hidden;
  margin-top: 10px;
}

.bar {
  height: 100%;
  width: 0%;
  background: var(--accent);
  transition: 0.3s;
}

/* TOC */
.toc {
  margin-top: 15px;
  font-size: 13px;
  opacity: 0.8;
}

.toc div {
  padding: 4px 0;
  cursor: pointer;
}

.toc div:hover {
  color: var(--accent);
}
</style>
</head>

<body>

<!-- 📚 LIBRARY VIEW -->
<div id="libraryView">

  <div class="header">
    <input id="search" placeholder="Поиск книги..." oninput="searchBooks()">
  </div>

  <div class="library" id="library"></div>
</div>

<!-- 📖 READER VIEW -->
<div id="readerView" class="reader">

  <div class="topbar">
    <button onclick="back()">⬅ Назад</button>
    <button onclick="bookmark()">📌</button>
  </div>

  <div class="page" id="page"></div>

  <div class="toc" id="toc"></div>

  <div class="progress">
    <div class="bar" id="bar"></div>
  </div>

  <div style="margin-top:10px; display:flex; gap:10px; justify-content:center;">
    <button onclick="prev()">◀</button>
    <button onclick="next()">▶</button>
  </div>

</div>

<script>

/* 📚 SINGLE SOURCE OF TRUTH */
const books = [
{
  title: "Слова — это следы души",
  cover: "YOUR_COVER.jpg",
  pages: [
    "Вера Климошенко",
    "Вступление: Слова сопровождают нас...",
    "Глава I: Каждое слово — это след души...",
    "Глава II: Иногда слова становятся светом...",
    "Эпилог: Всё сказанное остаётся..."
  ]
}
];

let book = null;
let page = 0;

/* 📚 render library */
function renderLibrary(list = books) {
  const el = document.getElementById("library");
  el.innerHTML = "";

  list.forEach((b, i) => {
    const div = document.createElement("div");
    div.className = "book";
    div.onclick = () => openBook(i);

    div.innerHTML = `
      <div class="cover" style="background-image:url('${b.cover}')"></div>
      <div class="title">${b.title}</div>
    `;

    el.appendChild(div);
  });
}

/* 📖 open */
function openBook(i) {
  book = books[i];
  page = 0;

  document.getElementById("libraryView").style.display = "none";
  document.getElementById("readerView").style.display = "block";

  renderTOC();
  render();
}

/* 📄 render page */
function render() {
  document.getElementById("page").innerHTML = `
    <h2>${book.title}</h2>
    <p>${book.pages[page]}</p>
  `;

  updateProgress();
}

/* 📑 TOC */
function renderTOC() {
  const toc = document.getElementById("toc");
  toc.innerHTML = "";

  book.pages.forEach((p, i) => {
    const d = document.createElement("div");
    d.innerText = "• " + p.slice(0, 40);
    d.onclick = () => {
      page = i;
      render();
    };
    toc.appendChild(d);
  });
}

/* 📊 progress */
function updateProgress() {
  let percent = (page / (book.pages.length - 1)) * 100;
  document.getElementById("bar").style.width = percent + "%";
}

/* ⬅ back */
function back() {
  document.getElementById("libraryView").style.display = "block";
  document.getElementById("readerView").style.display = "none";
}

/* ▶ next */
function next() {
  if (page < book.pages.length - 1) {
    page++;
    render();
  }
}

/* ◀ prev */
function prev() {
  if (page > 0) {
    page--;
    render();
  }
}

/* 📌 bookmark */
function bookmark() {
  localStorage.setItem("bookmark", page);
  alert("Закладка сохранена");
}

/* 🔍 search */
function searchBooks() {
  const q = document.getElementById("search").value.toLowerCase();
  renderLibrary(books.filter(b => b.title.toLowerCase().includes(q)));
}

/* INIT */
renderLibrary();

</script>

</body>
</html>
