<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Apple Books ULTRA V4</title>

<style>
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #151515, #000);
}

/* 📱 APP STAGE */
.stage {
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* 📖 CANVAS BOOK */
canvas {
  border-radius: 14px;
  box-shadow: 0 40px 120px rgba(0,0,0,0.7);
  cursor: grab;
}
canvas:active { cursor: grabbing; }
</style>
</head>

<body>

<div class="stage">
  <canvas id="book" width="1000" height="650"></canvas>
</div>

<script>
const canvas = document.getElementById("book");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;

/* 📖 YOUR BOOK */
const pages = [
  {
    cover: true,
    title: "Слова — это следы души",
    author: "Вера Климошенко",
    img: "https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?auto=format&fit=crop&w=1600&q=80"
  },
  {
    title: "Вступление",
    text: "Слова сопровождают нас всю жизнь. Они остаются даже тогда, когда мы молчим."
  },
  {
    title: "Глава I",
    text: "Каждое слово — это след души, который нельзя стереть временем."
  },
  {
    title: "Глава II",
    text: "Иногда слова становятся светом, который ведёт нас через темноту."
  },
  {
    title: "Эпилог",
    text: "Всё сказанное остаётся. Даже если исчезает голос."
  }
];

let index = 0;
let dragging = false;
let startX = 0;
let offset = 0;

/* 📄 DRAW PAGE */
function drawPage(p, xShift = 0, next = false) {
  ctx.save();
  ctx.translate(xShift, 0);

  // background
  if (p.cover) {
    let img = new Image();
    img.src = p.img;

    ctx.drawImage(img, 0, 0, W, H);
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    ctx.fillRect(0,0,W,H);

    ctx.fillStyle = "#f5e7d3";
    ctx.textAlign = "center";

    ctx.font = "48px Georgia";
    ctx.fillText(p.title, W/2, H/2 - 20);

    ctx.font = "22px Georgia";
    ctx.fillText(p.author, W/2, H/2 + 30);

  } else {
    ctx.fillStyle = "#fffdf7";
    ctx.fillRect(0,0,W,H);

    ctx.fillStyle = "#111";
    ctx.textAlign = "center";

    ctx.font = "28px Georgia";
    ctx.fillText(p.title, W/2, 100);

    ctx.font = "20px Georgia";

    wrapText(p.text, W/2, 180, 700, 30);
  }

  ctx.restore();

  // 📌 shadow (page curl feel)
  if (next) {
    ctx.fillStyle = "rgba(0,0,0,0.25)";
    ctx.fillRect(0,0,W,H);
  }
}

/* 📄 TEXT WRAP */
function wrapText(text, x, y, maxWidth, lineHeight) {
  let words = text.split(" ");
  let line = "";

  for (let n = 0; n < words.length; n++) {
    let test = line + words[n] + " ";
    if (ctx.measureText(test).width > maxWidth && n > 0) {
      ctx.fillText(line, x, y);
      line = words[n] + " ";
      y += lineHeight;
    } else {
      line = test;
    }
  }
  ctx.fillText(line, x, y);
}

/* 📖 CURL EFFECT */
function curlEffect(x) {
  return Math.sin(x / 200) * 30;
}

/* 🎨 RENDER LOOP */
function render() {
  ctx.clearRect(0,0,W,H);

  let next = pages[index + 1];

  drawPage(pages[index], offset);

  if (next) {
    let curl = curlEffect(offset);
    drawPage(next, offset + W + curl, true);
  }

  // shadow overlay
  ctx.fillStyle = "rgba(0,0,0," + Math.min(Math.abs(offset)/800, 0.6) + ")";
  ctx.fillRect(0,0,W,H);

  requestAnimationFrame(render);
}
render();

/* 📱 DRAG */
canvas.addEventListener("mousedown", e => {
  dragging = true;
  startX = e.clientX;
});

canvas.addEventListener("mousemove", e => {
  if (!dragging) return;
  offset = e.clientX - startX;
});

canvas.addEventListener("mouseup", () => {
  dragging = false;

  if (offset < -150 && index < pages.length - 1) index++;
  if (offset > 150 && index > 0) index--;

  offset = 0;
});

/* 📱 TOUCH */
canvas.addEventListener("touchstart", e => {
  dragging = true;
  startX = e.touches[0].clientX;
});

canvas.addEventListener("touchmove", e => {
  if (!dragging) return;
  offset = e.touches[0].clientX - startX;
});

canvas.addEventListener("touchend", () => {
  dragging = false;

  if (offset < -150 && index < pages.length - 1) index++;
  if (offset > 150 && index > 0) index--;

  offset = 0;
});
</script>

</body>
</html>
