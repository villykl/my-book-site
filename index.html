<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Apple Shader Book Engine</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
  margin:0;
  overflow:hidden;
  background:#000;
}
canvas{ display:block; }

/* UI */
.ui{
  position:fixed;
  right:20px;
  top:50%;
  transform:translateY(-50%);
  display:flex;
  flex-direction:column;
  gap:10px;
  z-index:10;
}
button{
  padding:10px 14px;
  border:none;
  border-radius:12px;
  background:rgba(255,255,255,0.9);
  font-weight:bold;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="ui">
  <button onclick="nextPage()">➡ Next</button>
  <button onclick="prevPage()">⬅ Back</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

let scene, camera, renderer;
let pages = [];
let current = 0;

let drag = false;
let startX = 0;
let velocity = 0;

/* ================= INIT ================= */
init();
animate();

function init(){

  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.z = 4;

  renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  /* LIGHT (Apple-style soft key light) */
  const light = new THREE.DirectionalLight(0xffffff, 1.2);
  light.position.set(2,2,3);
  scene.add(light);

  const ambient = new THREE.AmbientLight(0x333333);
  scene.add(ambient);

  /* ================= SHADER PAGE ================= */
  const geo = new THREE.PlaneGeometry(2.2,3.2,60,60);

  const shaderMat = new THREE.ShaderMaterial({

    uniforms:{
      time:{value:0},
      curl:{value:0}
    },

    vertexShader:`
      uniform float time;
      uniform float curl;

      varying vec2 vUv;

      void main(){
        vUv = uv;

        vec3 pos = position;

        // 📖 PAGE CURL CORE (APPLE STYLE)
        float bend = curl * 2.0;

        float x = pos.x;

        pos.z += sin(x * 3.0 + bend) * curl * 0.6;
        pos.y += cos(x * 2.0 + bend) * curl * 0.2;

        gl_Position = projectionMatrix * modelViewMatrix * vec4(pos,1.0);
      }
    `,

    fragmentShader:`
      varying vec2 vUv;

      void main(){

        vec3 base = vec3(0.95,0.92,0.85);

        float shadow = smoothstep(0.0,1.0,vUv.x);

        vec3 color = base - shadow * 0.25;

        gl_FragColor = vec4(color,1.0);
      }
    `,

    side:THREE.DoubleSide
  });

  /* PAGES */
  for(let i=0;i<3;i++){

    let mesh = new THREE.Mesh(geo, shaderMat.clone());
    mesh.position.z = -i * 0.02;

    scene.add(mesh);
    pages.push(mesh);
  }

  /* DRAG */
  window.addEventListener("mousedown",(e)=>{
    drag = true;
    startX = e.clientX;
  });

  window.addEventListener("mouseup",()=>{
    drag = false;

    if(velocity < -0.02) nextPage();
    if(velocity > 0.02) prevPage();

    velocity *= 0.8;
  });

  window.addEventListener("mousemove",(e)=>{
    if(!drag) return;

    velocity = (e.clientX - startX) * 0.002;
    startX = e.clientX;

    applyCurl(velocity);
  });

  window.addEventListener("resize",onResize);
}

/* ================= REAL SHADER CURL CONTROL ================= */
function applyCurl(v){

  let mesh = pages[current];
  mesh.material.uniforms.curl.value = v;

}

/* ================= PAGE FLIP ================= */
function nextPage(){
  if(current < pages.length-1){
    animateFlip(pages[current], -1);
    current++;
  }
}

function prevPage(){
  if(current > 0){
    current--;
    animateFlip(pages[current], 1);
  }
}

/* smooth rotation */
function animateFlip(mesh, dir){

  let a = 0;

  function step(){
    a += 0.08;

    mesh.rotation.y = dir * -a;

    if(a < Math.PI){
      requestAnimationFrame(step);
    }
  }

  step();
}

/* ================= LOOP ================= */
function animate(){

  requestAnimationFrame(animate);

  pages.forEach(p=>{
    p.material.uniforms.time.value += 0.01;
  });

  renderer.render(scene,camera);
}

/* ================= RESIZE ================= */
function onResize(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

/* UI */
function nextPage(){ if(current < pages.length-1){ animateFlip(pages[current],-1); current++; } }
function prevPage(){ if(current > 0){ current--; animateFlip(pages[current],1); } }

</script>

</body>
</html>
