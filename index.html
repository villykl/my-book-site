<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Слова — это следы души</title>

<style>
body {
  margin: 0;
  background: #0d0d0d;
  font-family: Georgia, serif;
  color: white;
  overflow: hidden;
}

/* КНИГА */
.book {
  position: absolute;
  width: 320px;
  height: 450px;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  perspective: 2000px;
}

/* СТРАНИЦЫ */
.page {
  position: absolute;
  width: 100%;
  height: 100%;
  background: linear-gradient(145deg, #1c1c1c, #111);
  border-radius: 10px;
  transform-origin: left;
  transition: transform 0.6s;
  padding: 20px;
  box-shadow: 0 0 20px black;
}

/* ПЕРЕЛИСТЫВАНИЕ */
.page.flipped {
  transform: rotateY(-180deg);
}

/* ТЕКСТ */
h1 { text-align: center; }
h2 { margin-bottom: 10px; }

.cell {
  width: 40px;
  height: 40px;
  margin: 4px;
  text-align: center;
  font-size: 20px;
  background: #222;
  border: 1px solid #555;
  color: white;
}
</style>
</head>

<body>

<div class="book" id="book">

  <div class="page" onclick="flip(this)">
    <h1>Слова — это следы души</h1>
    <p style="text-align:center; opacity:0.6;">Автор: Ты</p>
  </div>

  <div class="page" onclick="flip(this)">
    <h2>Глава I — Стихи</h2>
    <p>
    Тишина говорит со мной,<br>
    Словно ветер в пустом окне...<br><br>
    И я снова ищу покой,<br>
    Но он прячется где-то во мне.
    </p>
  </div>

  <div class="page" onclick="flip(this)">
    <h2>Глава II — Рассказы</h2>
    <p>Однажды ночью город молчал...</p>
  </div>

  <div class="page" onclick="flip(this)">
    <h2>Глава III — Кроссворд</h2>

    <input maxlength="1" class="cell">
    <input maxlength="1" class="cell">
    <input maxlength="1" class="cell">

    <br><br>
    <button onclick="check(event)">Проверить</button>
    <p id="result"></p>
  </div>

</div>

<!-- ЗВУК -->
<audio id="flipSound" src="https://www.soundjay.com/page-flip-01a.mp3"></audio>

<script>
let z = 1;

/* ПЕРЕЛИСТЫВАНИЕ */
function flip(page) {
  page.classList.toggle("flipped");
  page.style.zIndex = z++;

  document.getElementById("flipSound").play();
}

/* DRAG (телефон + мышь) */
let book = document.getElementById("book");
let isDown = false;

book.addEventListener("mousedown", () => isDown = true);
document.addEventListener("mouseup", () => isDown = false);

document.addEventListener("mousemove", (e) => {
  if (!isDown) return;
  book.style.left = e.clientX + "px";
  book.style.top = e.clientY + "px";
});

/* ТЕЛЕФОН */
book.addEventListener("touchmove", (e) => {
  book.style.left = e.touches[0].clientX + "px";
  book.style.top = e.touches[0].clientY + "px";
});

/* КРОССВОРД */
function check(e) {
  e.stopPropagation();

  let letters = document.querySelectorAll('.cell');
  let word = "";

  letters.forEach(l => word += l.value.toLowerCase());

  if (word === "мир") {
    document.getElementById("result").innerText = "Правильно ✅";
  } else {
    document.getElementById("result").innerText = "Попробуй ещё ❌";
  }
}
</script>

</body>
</html>
