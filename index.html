<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Вера Климошенко — Слова это следы души</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Georgia, serif;
  background: #0b0b0b;
  color: white;
}

/* ГЛАВНАЯ */
.hero {
  height: 100vh;
  background: radial-gradient(circle, #111, #000);
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.hero h1 {
  font-size: 42px;
}

.btn {
  margin-top: 20px;
  padding: 12px 25px;
  border: 1px solid white;
  background: none;
  color: white;
  cursor: pointer;
}

/* КНИГА */
.book {
  background: #fdfbf7;
  color: black;
  padding: 30px;
  border-radius: 10px;
  max-width: 700px;
  margin: 40px auto;
}

.page {
  font-size: 18px;
  line-height: 1.8;
}

.controls {
  display: flex;
  justify-content: space-between;
  margin-top: 20px;
}

/* АВТОР */
.about {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  align-items: center;
  max-width: 900px;
  margin: 40px auto;
  padding: 20px;
}

.about img {
  width: 240px;
  border-radius: 10px;
}
</style>
</head>

<body>

<!-- ГЛАВНАЯ -->
<div class="hero">
  <div>
    <h1>Вера Климошенко</h1>
    <p>Слова — это следы души</p>
    <button class="btn" onclick="scrollToBook()">Читать книгу</button>
  </div>
</div>

<!-- КНИГА -->
<div class="book" id="book">
  <div id="content" class="page"></div>

  <div class="controls">
    <button onclick="prev()">⬅️</button>
    <button onclick="next()">➡️</button>
  </div>
</div>

<!-- АВТОР -->
<div class="about">

<img src="data:image/jpeg;base64,REPLACE_BASE64">

<div>
<h2>Об авторе</h2>
<p>
Вера Климошенко — автор произведений о вере, тишине и глубине души.
</p>
</div>

</div>

<script>

/* ТВОЯ КНИГА */
let pages = [

`<h2>Слова — это следы души</h2>
<p style="text-align:center;">Вера Климошенко</p>`,

`<h3>А ты пойдёшь с нами, Господи?</h3>
<p>
Этот день я вспоминаю всегда, когда проезжаю по мосту...
</p>`,

`<p>
Прямого поезда не было. Нам нужно было торопиться.
</p>`,

`<p>
Мы шли по льду. Каждый шаг был испытанием.
</p>`,

`<p>
Мы успели. Слава Богу.
</p>`

];

let current = 0;

function render(){
  document.getElementById("content").innerHTML = pages[current];
}

function next(){
  if(current < pages.length-1){
    current++;
    render();
  }
}

function prev(){
  if(current > 0){
    current--;
    render();
  }
}

function scrollToBook(){
  document.getElementById("book").scrollIntoView({behavior:"smooth"});
}

window.onload = render;

</script>

</body>
</html>
