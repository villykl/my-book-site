<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Apple Books Engine</title>

<style>
html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Georgia, serif;
}

/* 📱 APP STAGE */
.stage {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at center, #151515, #000);
}

/* 📖 BOOK SHELL */
#book {
    width: 900px;
    height: 600px;
    perspective: 2000px;
    position: relative;
}

/* 📄 PAGE */
.page {
    width: 50%;
    height: 100%;
    position: absolute;
    top: 0;
    background: #fffdf7;
    padding: 50px;
    box-sizing: border-box;
    transform-origin: left;
    transition: transform 0.6s ease;
    backface-visibility: hidden;
}

/* left & right pages */
.page.left {
    left: 0;
}

.page.right {
    right: 0;
    transform-origin: right;
}

/* cover */
.cover {
    background:
        linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.85)),
        url('https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?auto=format&fit=crop&w=1600&q=80')
        center/cover;
    color: #f5e7d3;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
}

/* shadow realism */
.page::after {
    content: "";
    position: absolute;
    inset: 0;
    box-shadow: inset 0 0 40px rgba(0,0,0,0.05);
    pointer-events: none;
}
</style>
</head>

<body>

<div class="stage">

<div id="book">

    <div class="page left cover" id="p0">
        <h1>Слова — это следы души</h1>
        <p>Вера Климошенко</p>
    </div>

    <div class="page right" id="p1">
        <h2>Вступление</h2>
        <p>Слова сопровождают нас всю жизнь...</p>
    </div>

    <div class="page left" id="p2">
        <h2>Глава I</h2>
        <p>Каждое слово — это след души...</p>
    </div>

    <div class="page right" id="p3">
        <h2>Глава II</h2>
        <p>Иногда слова становятся светом...</p>
    </div>

    <div class="page left" id="p4">
        <h2>Эпилог</h2>
        <p>Всё сказанное остаётся...</p>
    </div>

</div>

</div>

<script>
let currentPage = 0;
const pages = document.querySelectorAll(".page");

let isDragging = false;
let startX = 0;

/* 📱 TOUCH / MOUSE CONTROL */
function goNext() {
    if (currentPage < pages.length - 1) {
        flipPage(currentPage + 1);
    }
}

function goPrev() {
    if (currentPage > 0) {
        flipPage(currentPage - 1);
    }
}

/* 📖 REAL BOOK FEEL */
function flipPage(index) {
    pages.forEach((p, i) => {

        if (i < index) {
            p.style.transform = "rotateY(-180deg)";
            p.style.zIndex = i;
        } else {
            p.style.transform = "rotateY(0deg)";
            p.style.zIndex = pages.length - i;
        }

    });

    currentPage = index;
}

/* 🖱️ MOUSE */
document.addEventListener("mousedown", (e) => {
    isDragging = true;
    startX = e.clientX;
});

document.addEventListener("mouseup", (e) => {
    if (!isDragging) return;
    isDragging = false;

    let diff = e.clientX - startX;

    if (diff < -50) goNext();
    if (diff > 50) goPrev();
});

/* 📱 TOUCH */
document.addEventListener("touchstart", (e) => {
    startX = e.touches[0].clientX;
});

document.addEventListener("touchend", (e) => {
    let endX = e.changedTouches[0].clientX;
    let diff = endX - startX;

    if (diff < -50) goNext();
    if (diff > 50) goPrev();
});

/* INIT */
flipPage(0);
</script>

</body>
</html>
