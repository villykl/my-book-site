<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Слова — это следы души</title>

<link rel="manifest" href="manifest.json">

<style>
html, body {
  margin: 0;
  height: 100%;
  background: #000;
  font-family: Georgia, serif;
  overflow: hidden;
}

/* 📱 APP MODE */
.app {
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  background: radial-gradient(circle at center, #151515, #000);
}

/* 📖 BOOK */
.book {
  width: 900px;
  height: 600px;
  background: #fffdf7;
  padding: 60px;
  box-sizing: border-box;
  border-radius: 12px;
  box-shadow: 0 30px 100px rgba(0,0,0,0.6);
}

/* text */
h1, h2 {
  text-align: center;
}
p {
  font-size: 20px;
  line-height: 1.7;
}

/* buttons */
.nav {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 10px;
}

button {
  padding: 10px 15px;
  border: none;
  border-radius: 8px;
  background: #222;
  color: #fff;
}
</style>
</head>

<body>

<div class="app">
  <div class="book" id="book"></div>
</div>

<div class="nav">
  <button onclick="prev()">◀</button>
  <button onclick="next()">▶</button>
</div>

<script>
const pages = [
`<h1>Слова — это следы души</h1><p>Вера Климошенко</p>`,

`<h2>Вступление</h2><p>Слова сопровождают нас всю жизнь...</p>`,

`<h2>Глава I</h2><p>Каждое слово — это след души...</p>`,

`<h2>Глава II</h2><p>Иногда слова становятся светом...</p>`,

`<h2>Эпилог</h2><p>Всё сказанное остаётся...</p>`
];

let i = localStorage.getItem("page") || 0;
const el = document.getElementById("book");

function render() {
  el.innerHTML = pages[i];
  localStorage.setItem("page", i);
}

function next() {
  if (i < pages.length - 1) i++;
  render();
}

function prev() {
  if (i > 0) i--;
  render();
}

render();

/* 📱 swipe */
let startX = 0;

document.addEventListener("touchstart", e => startX = e.touches[0].clientX);

document.addEventListener("touchend", e => {
  let diff = e.changedTouches[0].clientX - startX;
  if (diff < -50) next();
  if (diff > 50) prev();
});
</script>

</body>
</html>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}
</script>
