<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Вера Климошенко — Книги</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin:0;
  font-family: Georgia, serif;
  background:#fdfbf7;
  color:#222;
}

.dark {
  background:#111;
  color:#eee;
}

/* КОНТЕЙНЕР */
.container {
  max-width:680px;
  margin:auto;
  padding:30px 20px;
}

/* ТИПОГРАФИКА */
h1 {
  text-align:center;
  margin-bottom:30px;
}

h2 {
  margin-top:40px;
}

p {
  font-size:20px;
  line-height:1.9;
  margin-bottom:18px;
  text-align:justify;
  text-indent:2em;
}

/* КНОПКИ */
button {
  display:block;
  width:100%;
  margin:10px 0;
  padding:12px;
  font-size:18px;
}

.controls {
  position:fixed;
  bottom:10px;
  width:100%;
  display:flex;
  justify-content:space-around;
}

.controls button {
  width:auto;
}

/* АВТОР */
.author {
  text-align:center;
  margin-top:40px;
}

.author img {
  width:140px;
  border-radius:50%;
}
</style>
</head>

<body>

<div class="container" id="app"></div>

<div class="controls">
  <button onclick="prev()">⬅️</button>
  <button onclick="toggleTheme()">🌙</button>
  <button onclick="next()">➡️</button>
</div>

<script>

/* СОСТОЯНИЕ */
let state = {
  screen: localStorage.getItem("screen") || "books",
  book: parseInt(localStorage.getItem("book")) || 0,
  chapter: parseInt(localStorage.getItem("chapter")) || 0,
  page: parseInt(localStorage.getItem("page")) || 0
};

/* 🔥 ВСТАВЛЯЙ СЮДА ТЕКСТЫ */
let texts = [

{
title: "Слова — это следы души",
content: `
А ты пойдёшь с нами, Господи?

Этот день я вспоминаю всегда, когда проезжаю по мосту.
Этот день навсегда остался в моей памяти.

Прямого поезда на Брест не было.
Поэтому нам нужно было торопиться.

Оставив вещи, мы поспешили в город.
Ранняя весна наполняла душу радостью.

Но вот электричка...
Господь идёт впереди нас.

И вдруг — ошибка...
Мы оказались не на том берегу.

Господи, что делать?
И вдруг мысль — идти по льду.

Первый шаг был самым трудным.
Сердце билось всё сильнее.

Мы шли по льду...
Каждый шаг был испытанием.

И вот берег...
Мы дошли.

Но чудо только начиналось...

Мы успели. Слава Богу.
`
},

{
title: "Вторая книга",
content: `
Это вторая книга.

Здесь ты можешь писать новые рассказы.

Просто вставляй текст —
и всё оформится автоматически.
`
}

];

/* 📑 АВТО ГЛАВЫ */
function splitChapters(text){
  return text.split("\n\n").filter(t=>t.trim() !== "");
}

/* 📖 АВТО СТРАНИЦЫ */
function splitPages(paragraphs){
  let pages = [];
  let page = "";

  paragraphs.forEach(p=>{
    let block = `<p>${p}</p>`;

    if((page + block).length > 1200){
      pages.push(page);
      page = block;
    } else {
      page += block;
    }
  });

  if(page) pages.push(page);

  return pages;
}

/* 📚 СОЗДАНИЕ КНИГИ */
let books = texts.map(t=>{
  let chapters = splitChapters(t.content);

  return {
    title: t.title,
    chapters: chapters.map(ch => ({
      title: ch.split("\n")[0].slice(0,40),
      pages: splitPages(ch.split("\n"))
    }))
  };
});

/* ЭКРАНЫ */
function showBooks(){
  app.innerHTML = `<h1>📚 Книги</h1>`;

  books.forEach((b,i)=>{
    app.innerHTML += `<button onclick="openBook(${i})">${b.title}</button>`;
  });
}

function openBook(i){
  state.book = i;
  state.screen = "chapters";
  save();
  showChapters();
}

function showChapters(){
  let b = books[state.book];

  app.innerHTML = `<h1>${b.title}</h1>`;

  b.chapters.forEach((c,i)=>{
    app.innerHTML += `<button onclick="openChapter(${i})">${c.title}</button>`;
  });
}

function openChapter(i){
  state.chapter = i;
  state.page = 0;
  state.screen = "read";
  save();
  render();
}

/* ЧТЕНИЕ */
function render(){

  if(state.screen === "books") return showBooks();
  if(state.screen === "chapters") return showChapters();

  let page = books[state.book].chapters[state.chapter].pages[state.page];
  app.innerHTML = page;
}

/* НАВИГАЦИЯ */
function next(){
  if(state.screen !== "read") return;

  let pages = books[state.book].chapters[state.chapter].pages;

  if(state.page < pages.length-1){
    state.page++;
  }

  save();
  render();
}

function prev(){
  if(state.screen === "read"){
    if(state.page > 0){
      state.page--;
    } else {
      state.screen = "chapters";
    }
  } else if(state.screen === "chapters"){
    state.screen = "books";
  }

  save();
  render();
}

/* СОХРАНЕНИЕ */
function save(){
  localStorage.setItem("screen", state.screen);
  localStorage.setItem("book", state.book);
  localStorage.setItem("chapter", state.chapter);
  localStorage.setItem("page", state.page);
}

/* ТЕМА */
function toggleTheme(){
  document.body.classList.toggle("dark");
}

/* СТАРТ */
window.onload = render;

</script>

</body>
</html>
