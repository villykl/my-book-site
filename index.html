<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Вера Климошенко — Слова это следы души</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  background: radial-gradient(circle, #0a0a0a, #000);
  font-family: Georgia, serif;
  overflow: hidden;
}

.scene {
  width: 100%;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.book {
  width: 360px;
  height: 460px;
  perspective: 3000px;
  position: relative;
}

.left, .right {
  position: absolute;
  width: 50%;
  height: 100%;
  background: #f4f1ea;
  padding: 15px;
  box-sizing: border-box;
}

.left { left: 0; }
.right { right: 0; }

.flip {
  position: absolute;
  width: 50%;
  height: 100%;
  right: 0;
  background: #f4f1ea;
  transform-origin: left;
}

.title {
  text-align: center;
  margin-bottom: 10px;
}

.text {
  line-height: 1.6;
}

.poem {
  font-style: italic;
  line-height: 1.7;
}
</style>
</head>

<body>

<div class="scene">
  <div class="book">
    <div class="left" id="left"></div>
    <div class="right" id="right"></div>
    <div class="flip" id="flip"></div>
  </div>
</div>

<audio id="sound" src="https://www.soundjay.com/page-flip-01a.mp3"></audio>

<script>
let book = [

["", "Слова — это следы души<br><br>Вера Климошенко"],

["Предисловие",
"Это книга тишины.<br><br>Книга чувств, которые не всегда можно сказать вслух."],

["Рассказ",
"Ночь была тихой.<br><br>Город словно замер, слушая свои собственные мысли."],

["Продолжение",
"Окна домов светились мягким светом,<br>словно внутри каждого происходило что-то важное."],

["Ещё",
"Иногда кажется, что тишина говорит громче слов."],

["Финал",
"И, возможно, именно в этой тишине мы находим себя."]

];

let index = 0;
let startX = 0;
let dragging = false;

function render() {
  left.innerHTML = "<h3 class='title'>"+book[index][0]+"</h3>";
  right.innerHTML = "<div class='text'>"+book[index][1]+"</div>";
  flip.innerHTML = "<div class='text'>"+(book[index+1]?.[1]||"")+"</div>";
}

/* DRAG */
document.addEventListener("mousedown", start);
document.addEventListener("touchstart", start);

function start(e){
  startX = e.touches ? e.touches[0].clientX : e.clientX;
  dragging = true;
}

document.addEventListener("mousemove", move);
document.addEventListener("touchmove", move);

function move(e){
  if(!dragging) return;

  let x = e.touches ? e.touches[0].clientX : e.clientX;
  let dx = startX - x;

  let percent = Math.min(Math.max(dx/300,0),1);
  let angle = percent * -180;

  flip.style.transform = "rotateY("+angle+"deg)";
}

document.addEventListener("mouseup", end);
document.addEventListener("touchend", end);

function end(e){
  if(!dragging) return;
  dragging = false;

  let x = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
  let dx = startX - x;

  if(dx > 100 && index < book.length-1){
    index++;
    play();
  }

  flip.style.transform = "rotateY(0deg)";
  render();
}

function play(){
  let s = document.getElementById("sound");
  s.currentTime = 0;
  s.play();
}

window.onload = render;
</script>

</body>
</html>
