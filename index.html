<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate Drag Physics Book</title>

<style>
body{
  margin:0;
  font-family: Georgia, serif;
  background:#0b0b0b;
  overflow:hidden;
}

/* ================= COVER ================= */
#cover{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background: radial-gradient(circle at center, #000, #120a06);
  perspective:1800px;
}

/* 📖 BRIGHTER COVER */
.cover-book{
  width:340px;
  height:460px;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,0.12),
      rgba(0,0,0,0.65)
    ),
    url("cover.jpg");

  background-size:cover;
  background-position:center;

  filter: brightness(1.15) contrast(1.05);

  border-radius:8px 18px 18px 8px;

  box-shadow:0 60px 150px rgba(0,0,0,0.9);

  transform-origin:left;

  position:relative;
  overflow:hidden;

  border-left:6px solid rgba(0,0,0,0.35);

  transition:1.2s cubic-bezier(.2,.8,.2,1);
}

/* OPEN COVER */
.cover-open{
  transform: perspective(1400px)
             rotateY(-115deg)
             translateX(-90px)
             scale(0.92);
  opacity:0.15;
  filter: blur(2px) brightness(1.0);
}

/* ================= BOOK ================= */
#scene{
  display:none;
  height:100vh;
  align-items:center;
  justify-content:center;
  perspective:2600px;
  background: radial-gradient(circle at center, #1a1a1a, #000);
}

.book{
  width:820px;
  height:520px;
  position:relative;
  transform-style:preserve-3d;
  transform: rotateX(10deg);
}

.book::before{
  content:"";
  position:absolute;
  width:30px;
  height:100%;
  left:50%;
  transform:translateX(-50%);
  background:linear-gradient(#111,#000,#111);
}

/* ================= PAGES ================= */
.page{
  position:absolute;
  width:50%;
  height:100%;
  left:50%;
  transform-origin:left;

  background:linear-gradient(to right, #f8f3e7, #efe6d3);

  padding:40px;
  box-sizing:border-box;

  box-shadow:0 30px 90px rgba(0,0,0,0.6);

  transition:
    transform 0.9s cubic-bezier(.2,.8,.2,1),
    box-shadow 0.9s ease;

  backface-visibility:hidden;
}

/* stack */
.page:nth-child(1){ z-index:3; }
.page:nth-child(2){ z-index:2; }
.page:nth-child(3){ z-index:1; }

/* ================= DRAG STATE ================= */
.page.dragging{
  transition:none !important;
}

/* flipped page physics */
.page.flipped{
  transform:
    rotateY(-180deg)
    skewY(2deg)
    translateX(-25px);
}

/* curl highlight */
.page.flipped::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(90deg, rgba(255,255,255,0.18), transparent);
  pointer-events:none;
}

/* ================= UI ================= */
.ui{
  position:fixed;
  right:20px;
  top:50%;
  transform:translateY(-50%);

  display:flex;
  flex-direction:column;
  gap:10px;

  z-index:999;
}

button{
  padding:10px 14px;
  border:none;
  border-radius:12px;
  cursor:pointer;

  background:rgba(255,255,255,0.92);
  font-weight:bold;

  box-shadow:0 10px 25px rgba(0,0,0,0.3);
  backdrop-filter: blur(6px);

  transition:0.2s;
}

button:hover{
  transform:scale(1.05);
}
</style>
</head>

<body>

<!-- 📖 COVER -->
<div id="cover">
  <div class="cover-book" id="coverBook"></div>
</div>

<!-- 📚 BOOK -->
<div id="scene">

  <div class="book">

    <div class="page">
      <h1>Глава 1</h1>
      <p>Ultimate drag physics активирован.</p>
    </div>

    <div class="page">
      <h1>Глава 2</h1>
      <p>Теперь страницы можно тянуть мышью.</p>
    </div>

    <div class="page">
      <h1>Глава 3</h1>
      <p>Почти как реальная бумага.</p>
    </div>

  </div>

</div>

<!-- UI -->
<div class="ui">
  <button onclick="openBook()">📖 Open</button>
  <button onclick="reset()">🔄 Reset</button>
</div>

<script>

let i = 0;
const pages = document.querySelectorAll(".page");

let isDragging = false;
let startX = 0;

/* OPEN */
function openBook(){
  document.getElementById("coverBook").classList.add("cover-open");

  setTimeout(()=>{
    document.getElementById("cover").style.display = "none";
    document.getElementById("scene").style.display = "flex";
  }, 900);
}

/* RESET */
function reset(){
  pages.forEach(p=>{
    p.classList.remove("flipped","dragging");
    p.style.transform = "";
  });
  i = 0;
}

/* ================= DRAG PHYSICS ================= */
document.addEventListener("mousedown", (e)=>{
  startX = e.clientX;
  isDragging = true;
});

document.addEventListener("mouseup", (e)=>{
  if(!isDragging) return;

  let diff = e.clientX - startX;

  let page = pages[i];

  if(!page){
    isDragging = false;
    return;
  }

  page.classList.add("dragging");

  if(diff < -80){
    // FLIP FORWARD
    page.classList.remove("dragging");
    page.classList.add("flipped");
    i++;
  }

  if(diff > 80){
    // BACK
    if(i > 0){
      i--;
      pages[i].classList.remove("flipped");
    }
  }

  isDragging = false;
});

</script>

</body>
</html>
