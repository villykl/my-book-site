<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Слова — это следы души</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin:0;
  font-family: Georgia, serif;
  background:#fdfbf7;
  color:#222;
  overflow:hidden;
}

#book {
  display:flex;
  width:100vw;
  height:100vh;
  transition:transform 0.4s ease;
}

.page {
  min-width:100vw;
  height:100vh;
  padding:30px;
  box-sizing:border-box;
  overflow-y:auto;
}

.cover {
  text-align:center;
}

.cover img {
  width:200px;
  margin:20px;
  border-radius:12px;
}

p {
  line-height:1.8;
  text-indent:2em;
  font-size:20px;
}
</style>
</head>

<body>

<div id="book"></div>

<script>

/* обложка */
const COVER = "https://i.imgur.com/8QZ7Z8T.png";

/* текст */
let text = `
А ты пойдёшь с нами, Господи?

Этот день я вспоминаю всегда, когда проезжаю по мосту.

Прямого поезда не было. Нам нужно было торопиться.

Мы оказались не на том берегу...

Мы шли по льду...

Мы успели. Слава Богу.
`;

/* разбивка */
function splitText(t){
  let words = t.split(" ");
  let pages=[],page="";
  words.forEach(w=>{
    page+=w+" ";
    if(page.length>800){
      pages.push(page);
      page="";
    }
  });
  if(page) pages.push(page);
  return pages;
}

let content = splitText(text);

/* создаём страницы */
let pages = [
  `<div class="cover">
     <h1>Слова — это следы души</h1>
     <img src="${COVER}">
     <h3>Вера Климошенко</h3>
   </div>`,
  ...content.map(p => `<p>${p}</p>`)
];

let current = 0;

/* рендер */
function render(){
  book.innerHTML = pages.map(p => `<div class="page">${p}</div>`).join("");
  update();
}

/* движение */
function update(){
  book.style.transform = `translateX(-${current * 100}vw)`;
}

/* свайп */
let startX = 0;

document.addEventListener("touchstart", e=>{
  startX = e.touches[0].clientX;
});

document.addEventListener("touchend", e=>{
  let endX = e.changedTouches[0].clientX;

  if(startX - endX > 50 && current < pages.length-1){
    current++;
  }

  if(endX - startX > 50 && current > 0){
    current--;
  }

  update();
});

/* клик (ПК) */
document.addEventListener("click", e=>{
  if(e.clientX > window.innerWidth/2 && current < pages.length-1){
    current++;
  } else if(current > 0){
    current--;
  }
  update();
});

render();

</script>

</body>
</html>
