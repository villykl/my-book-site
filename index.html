<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Слова — это следы души</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin:0;
  font-family: Georgia, serif;
  background:#fdfbf7;
  color:#222;
}

#app {
  max-width:700px;
  margin:auto;
  padding:20px;
}

.cover {
  width:220px;
  display:block;
  margin:20px auto;
  border-radius:12px;
}

.controls {
  position:fixed;
  bottom:0;
  width:100%;
  background:white;
  display:flex;
  justify-content:space-around;
  padding:10px;
}

button {
  padding:10px;
  font-size:16px;
}

p {
  line-height:1.8;
  text-indent:2em;
}
</style>
</head>

<body>

<div id="app"></div>

<div class="controls">
  <button onclick="prev()">⬅️</button>
  <button onclick="next()">➡️</button>
</div>

<script>

/* 🔥 РАБОЧАЯ ОБЛОЖКА */
const COVER = "https://i.imgur.com/8QZ7Z8T.png";

/* текст */
let text = `
А ты пойдёшь с нами, Господи?

Этот день я вспоминаю всегда, когда проезжаю по мосту.

Прямого поезда не было. Нам нужно было торопиться.

Мы оказались не на том берегу...

Мы шли по льду...

Мы успели. Слава Богу.
`;

/* разбивка */
function splitText(t){
  let words = t.split(" ");
  let pages=[],page="";
  words.forEach(w=>{
    page+=w+" ";
    if(page.length>800){
      pages.push(page);
      page="";
    }
  });
  if(page) pages.push(page);
  return pages;
}

let pages = splitText(text);
let page = -1;

/* рендер */
function render(){

  if(page === -1){
    app.innerHTML = `
    <h1 style="text-align:center;">Слова — это следы души</h1>
    <img class="cover" src="${COVER}">
    <h3 style="text-align:center;">Вера Климошенко</h3>
    `;
    return;
  }

  app.innerHTML = `<p>${pages[page]}</p>`;
}

/* кнопки */
function next(){
  if(page < pages.length-1){
    page++;
  }
  render();
}

function prev(){
  if(page > 0){
    page--;
  } else {
    page = -1;
  }
  render();
}

render();

</script>

</body>
</html>
