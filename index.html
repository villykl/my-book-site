<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Вера Климошенко — Слова это следы души</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  background: radial-gradient(circle, #0a0a0a, #000);
  font-family: Georgia, serif;
  overflow: hidden;
}

/* СЦЕНА */
.scene {
  width: 100%;
  height: 100vh;
  perspective: 2000px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* КНИГА */
.book {
  width: 320px;
  height: 420px;
  position: relative;
  transform-style: preserve-3d;
}

/* ОБЛОЖКА */
.cover {
  position: absolute;
  width: 100%;
  height: 100%;
  background: linear-gradient(145deg, #1a1a1a, #000);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  transform-origin: left;
  transition: transform 1.5s ease;
  z-index: 5;
  border-radius: 8px;
}

.book.open .cover {
  transform: rotateY(-160deg);
}

/* СТРАНИЦЫ */
.page {
  position: absolute;
  width: 100%;
  height: 100%;
  background: #f4f1ea;
  padding: 20px;
  box-sizing: border-box;
  border-radius: 5px;
}

.pages {
  display: flex;
  height: 100%;
}

.left, .right {
  width: 50%;
  padding: 10px;
}

.poem {
  font-style: italic;
  line-height: 1.7;
}
</style>
</head>

<body>

<div class="scene">

  <div class="book" id="book">

    <!-- ОБЛОЖКА -->
    <div class="cover" onclick="openBook()">
      <div>
        <h2>Слова — это следы души</h2>
        <p>Вера Климошенко</p>
        <small>Нажми, чтобы открыть</small>
      </div>
    </div>

    <!-- СТРАНИЦЫ -->
    <div class="page">
      <div class="pages">
        <div class="left" id="left"></div>
        <div class="right" id="right"></div>
      </div>
    </div>

  </div>

</div>

<audio id="sound" src="https://www.soundjay.com/page-flip-01a.mp3"></audio>

<script>
let pages = [
  ["Добро пожаловать", "Это книга чувств и мыслей."],
  ["Стихи", "Тишина говорит со мной..."],
  ["Рассказы", "Однажды ночью город молчал..."],
  ["Автор", "Вера Климошенко"]
];

let current = 0;

/* ОТКРЫТИЕ */
function openBook() {
  document.getElementById("book").classList.add("open");
  document.getElementById("sound").play();
  setTimeout(() => show(0), 1200);
}

/* ПОКАЗ СТРАНИЦЫ */
function show(i) {
  current = i;

  document.getElementById("left").innerHTML =
    "<h3>" + pages[i][0] + "</h3>";

  document.getElementById("right").innerHTML =
    "<p class='poem'>" + pages[i][1] + "</p>";
}

/* 👉 СВАЙП (главное) */
let startX = 0;

document.addEventListener("touchstart", e => {
  startX = e.touches[0].clientX;
});

document.addEventListener("touchend", e => {
  let endX = e.changedTouches[0].clientX;

  if (endX < startX - 50) {
    nextPage();
  }

  if (endX > startX + 50) {
    prevPage();
  }
});

/* МЫШКА */
document.addEventListener("mousedown", e => {
  startX = e.clientX;
});

document.addEventListener("mouseup", e => {
  let endX = e.clientX;

  if (endX < startX - 50) nextPage();
  if (endX > startX + 50) prevPage();
});

/* ПЕРЕЛИСТЫВАНИЕ */
function nextPage() {
  if (current < pages.length - 1) {
    current++;
    show(current);
    document.getElementById("sound").play();
  }
}

function prevPage() {
  if (current > 0) {
    current--;
    show(current);
    document.getElementById("sound").play();
  }
}
</script>

</body>
</html>
