<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Слова — это следы души</title>

<link rel="manifest" href="manifest.json">

<style>
html, body {
  margin: 0;
  height: 100%;
  background: #000;
  font-family: Georgia, serif;
  overflow: hidden;
}

/* 📱 APP */
.app {
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  background: radial-gradient(circle at center, #1a1a1a, #000);
}

/* 📖 READER */
.reader {
  width: min(900px, 92vw);
  height: min(600px, 80vh);
  background: #fffdf7;
  border-radius: 14px;
  padding: 50px;
  box-sizing: border-box;
  box-shadow: 0 30px 120px rgba(0,0,0,0.7);
  transition: opacity .2s ease;
}

/* TEXT */
h1, h2 { text-align: center; }
p { font-size: 20px; line-height: 1.7; }

/* NAV */
.nav {
  position: fixed;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 10px;
}

button {
  padding: 10px 14px;
  border: none;
  border-radius: 10px;
  background: rgba(255,255,255,0.1);
  color: white;
  backdrop-filter: blur(10px);
}
</style>
</head>

<body>

<div class="app">
  <div class="reader" id="reader"></div>
</div>

<div class="nav">
  <button onclick="prev()">◀</button>
  <button onclick="next()">▶</button>
</div>

<script>
const pages = [
`<h1>Слова — это следы души</h1><p>Вера Климошенко</p>`,

`<h2>Вступление</h2><p>Слова сопровождают нас всю жизнь...</p>`,

`<h2>Глава I</h2><p>Каждое слово — это след души...</p>`,

`<h2>Глава II</h2><p>Иногда слова становятся светом...</p>`,

`<h2>Эпилог</h2><p>Всё сказанное остаётся...</p>`
];

let i = parseInt(localStorage.getItem("page") || "0");
const el = document.getElementById("reader");

/* 📄 render */
function render() {
  el.style.opacity = 0;

  setTimeout(() => {
    el.innerHTML = pages[i];
    el.style.opacity = 1;
    localStorage.setItem("page", i);
  }, 120);
}

/* ➡️ next */
function next() {
  if (i < pages.length - 1) i++;
  render();
}

/* ⬅️ prev */
function prev() {
  if (i > 0) i--;
  render();
}

/* 📱 swipe */
let startX = 0;

document.addEventListener("touchstart", e => {
  startX = e.touches[0].clientX;
});

document.addEventListener("touchend", e => {
  let diff = e.changedTouches[0].clientX - startX;

  if (diff < -60) next();
  if (diff > 60) prev();
});

render();

/* 📲 SAFE PWA REGISTER */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js")
      .catch(err => console.log("SW error:", err));
  });
}
</script>

</body>
</html>
