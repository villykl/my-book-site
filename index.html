<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Вера Климошенко — Слова это следы души</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  background: #111;
  font-family: Georgia, serif;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 20px;
  background: #fdfbf7;
  min-height: 100vh;
}

h1 {
  text-align: center;
  margin-top: 40px;
}

h2 {
  margin-top: 40px;
}

.page {
  margin-bottom: 60px;
  line-height: 1.8;
  font-size: 18px;
}

.nav {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: #000;
  color: white;
  display: flex;
  justify-content: space-around;
  padding: 10px;
}

button {
  background: none;
  border: none;
  color: white;
  font-size: 16px;
}
</style>
</head>

<body>

<div class="container" id="content"></div>

<div class="nav">
  <button onclick="prev()">⬅️</button>
  <button onclick="next()">➡️</button>
</div>

<script>

let pages = [

`<h1>Слова — это следы души</h1>
<p style="text-align:center;">Вера Климошенко</p>`,

`<h2>А ты пойдёшь с нами, Господи?</h2>
<p>
Этот день я вспоминаю всегда, когда проезжаю по Спрингфилдскому мосту.
Этот день навсегда остался в моей памяти.
</p>`,

`<p>
Прямого поезда на Брест не было.  
Поэтому нам нужно было торопиться.
</p>`,

`<p>
Оставив вещи, мы поспешили в город.  
Ранняя весна наполняла душу радостью.
</p>`,

`<p>
Но вот электричка...  
Господь идёт впереди нас.
</p>`,

`<p>
И вдруг — ошибка...  
Мы оказались не на том берегу.
</p>`,

`<p>
Господи, что делать?  
И вдруг мысль — идти по льду.
</p>`,

`<p>
Первый шаг был самым трудным.  
Сердце билось всё сильнее.
</p>`,

`<p>
Мы шли по льду...  
Каждый шаг был испытанием.
</p>`,

`<p>
И вот берег.  
Мы дошли.
</p>`,

`<p>
Но чудо только начиналось...  
Мы оказались в нужном доме.
</p>`,

`<p>
А затем бег к поезду...  
И последние секунды.
</p>`,

`<p>
Мы успели.  
Слава Богу.
</p>`,

`<p>
Этот день навсегда остался в моей душе —  
как свидетельство Божьей помощи.
</p>`

];

let current = 0;

function render() {
  document.getElementById("content").innerHTML =
    "<div class='page'>" + pages[current] + "</div>";

  localStorage.setItem("page", current);
}

function next() {
  if (current < pages.length - 1) {
    current++;
    render();
  }
}

function prev() {
  if (current > 0) {
    current--;
    render();
  }
}

window.onload = () => {
  current = parseInt(localStorage.getItem("page")) || 0;
  render();
};
</script>

</body>
</html>
