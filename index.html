<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kindle Pro Max Library</title>

<style>
body {
  margin: 0;
  font-family: Georgia, serif;
  background: #0b0b0b;
  color: #f5f1e8;
}

/* 📚 LIBRARY */
.library {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 20px;
  padding: 30px;
}

/* 📖 BOOK CARD */
.book {
  background: #1a1a1a;
  border-radius: 14px;
  overflow: hidden;
  cursor: pointer;
  transition: 0.3s;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.book:hover {
  transform: scale(1.05);
}

/* 📕 COVER */
.cover {
  height: 220px;
  background-size: cover;
  background-position: center;
}

/* TEXT */
.info {
  padding: 12px;
}

.title {
  font-size: 16px;
}

/* 📖 READER */
.reader {
  display: none;
  padding: 40px;
  max-width: 800px;
  margin: auto;
}

.page {
  background: #fffdf7;
  color: #111;
  padding: 50px;
  border-radius: 14px;
  box-shadow: 0 20px 80px rgba(0,0,0,0.6);
}

/* NAV */
.nav {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 20px;
}

button {
  padding: 10px 14px;
  border: none;
  border-radius: 10px;
  background: #222;
  color: white;
}
</style>
</head>

<body>

<!-- 📚 LIBRARY VIEW -->
<div id="library" class="library"></div>

<!-- 📖 READER VIEW -->
<div id="reader" class="reader">
  <div class="page" id="page"></div>

  <div class="nav">
    <button onclick="backToLibrary()">⬅ Library</button>
    <button onclick="prev()">◀</button>
    <button onclick="next()">▶</button>
  </div>
</div>

<script>

/* 📚 BOOK DATA */
const books = [
{
  title: "Слова — это следы души",
  cover: "YOUR_COVER.jpg", // ← ВСТАВЬ СЮДА СВОЮ ОБЛОЖКУ
  pages: [
    "Вера Климошенко",
    "Вступление: Слова сопровождают нас...",
    "Глава I: Каждое слово — это след души...",
    "Эпилог: Всё сказанное остаётся..."
  ]
},
{
  title: "Вторая книга",
  cover: "https://images.unsplash.com/photo-1524995997946-a1c2e315a42f",
  pages: [
    "Начало второй книги...",
    "Глава 1...",
    "Финал..."
  ]
}
];

let currentBook = null;
let pageIndex = 0;

/* 📚 render library */
const lib = document.getElementById("library");

function renderLibrary() {
  lib.innerHTML = "";

  books.forEach((b, i) => {
    const el = document.createElement("div");
    el.className = "book";
    el.onclick = () => openBook(i);

    el.innerHTML = `
      <div class="cover" style="background-image:url('${b.cover}')"></div>
      <div class="info">
        <div class="title">${b.title}</div>
      </div>
    `;

    lib.appendChild(el);
  });
}

/* 📖 open book */
function openBook(i) {
  currentBook = books[i];
  pageIndex = 0;

  document.getElementById("library").style.display = "none";
  document.getElementById("reader").style.display = "block";

  renderPage();
}

/* 📄 render page */
function renderPage() {
  document.getElementById("page").innerHTML =
    `<h2>${currentBook.title}</h2><p>${currentBook.pages[pageIndex]}</p>`;
}

/* ⬅ library */
function backToLibrary() {
  document.getElementById("library").style.display = "grid";
  document.getElementById("reader").style.display = "none";
}

/* ▶ next */
function next() {
  if (pageIndex < currentBook.pages.length - 1) {
    pageIndex++;
    renderPage();
  }
}

/* ◀ prev */
function prev() {
  if (pageIndex > 0) {
    pageIndex--;
    renderPage();
  }
}

/* init */
renderLibrary();

</script>

</body>
</html>
