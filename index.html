<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apple Book Ultra Cover</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background: radial-gradient(circle at center, #1a1a1a, #000);
  overflow:hidden;
}

/* 📖 COVER */
.cover{
  width:340px;
  height:460px;

  background-image:url("cover.jpg");
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;

  border-radius:18px;

  position:relative;
  overflow:hidden;

  /* 🍎 deep Apple shadow */
  box-shadow:
    0 90px 180px rgba(0,0,0,0.75),
    0 25px 60px rgba(0,0,0,0.5),
    inset 0 1px 0 rgba(255,255,255,0.08);

  transform-origin:left;
  transition:1s cubic-bezier(.2,.8,.2,1);

  filter: contrast(1.08) saturate(1.05);
}

/* ✨ LIGHT REFLECTION */
.cover::before{
  content:"";
  position:absolute;
  inset:0;

  background: linear-gradient(
    135deg,
    rgba(255,255,255,0.22),
    transparent 45%,
    rgba(0,0,0,0.25)
  );

  mix-blend-mode: overlay;
  pointer-events:none;
}

/* 🌌 subtle depth glow */
.cover::after{
  content:"";
  position:absolute;
  inset:0;

  background: radial-gradient(
    circle at 30% 20%,
    rgba(255,255,255,0.18),
    transparent 60%
  );

  pointer-events:none;
}

/* OPEN ANIMATION */
.cover.open{
  transform: rotateY(-120deg) translateX(-90px);
  opacity:0;
}

/* CLICK FEEL */
.cover:active{
  transform: scale(0.98);
}
</style>
</head>

<body>

<div class="cover" id="cover"></div>

<script>
document.getElementById("cover").onclick = () => {
  document.getElementById("cover").classList.add("open");
};
</script>

</body>
</html>
