<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Вера Климошенко — Автор</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Georgia, serif;
  background: #000;
  color: white;
  overflow-x: hidden;
}

/* 🌌 ФОН */
.bg {
  position: fixed;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at 50% 50%, #111, #000);
  overflow: hidden;
  z-index: -1;
}

.star {
  position: absolute;
  width: 2px;
  height: 2px;
  background: white;
  animation: move 10s linear infinite;
}

@keyframes move {
  from {transform: translateY(0);}
  to {transform: translateY(100vh);}
}

/* МЕНЮ */
.nav {
  position: fixed;
  top: 0;
  width: 100%;
  display: flex;
  justify-content: center;
  gap: 30px;
  padding: 15px;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(10px);
  z-index: 100;
}

.nav button {
  background: none;
  border: none;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

/* СЕКЦИИ */
.section {
  display: none;
  padding: 100px 20px;
  max-width: 900px;
  margin: auto;
  animation: fade 0.6s;
}

.active {
  display: block;
}

@keyframes fade {
  from {opacity:0; transform: translateY(20px);}
  to {opacity:1;}
}

/* ГЛАВНАЯ */
.hero {
  text-align: center;
  margin-top: 120px;
}

.hero h1 {
  font-size: 48px;
}

.hero p {
  opacity: 0.7;
}

/* КНОПКА */
.btn {
  margin-top: 20px;
  padding: 10px 20px;
  border: 1px solid white;
  background: none;
  color: white;
  cursor: pointer;
}

/* КНИГА */
.book {
  background: #fdfbf7;
  color: black;
  padding: 30px;
  border-radius: 15px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.7);
}

.page {
  line-height: 1.8;
  font-size: 18px;
}

/* КНОПКИ */
.controls {
  display: flex;
  justify-content: space-between;
  margin-top: 20px;
}

/* АВТОР */
.about {
  line-height: 1.8;
  font-size: 18px;
}
</style>
</head>

<body>

<div class="bg" id="bg"></div>

<!-- МЕНЮ -->
<div class="nav">
  <button onclick="show('home')">Главная</button>
  <button onclick="show('book')">Книга</button>
  <button onclick="show('about')">Об авторе</button>
</div>

<!-- ГЛАВНАЯ -->
<div id="home" class="section active">
  <div class="hero">
    <h1>Вера Климошенко</h1>
    <p>Слова — это следы души</p>
    <button class="btn" onclick="show('book')">Читать книгу</button>
  </div>
</div>

<!-- КНИГА -->
<div id="book" class="section">
  <div class="book" id="bookContent"></div>

  <div class="controls">
    <button onclick="prev()">⬅️</button>
    <button onclick="next()">➡️</button>
  </div>
</div>

<!-- ОБ АВТОРЕ -->
<div id="about" class="section">
  <h2>Об авторе</h2>
  <div class="about">
    Вера Климошенко — автор, создающий тексты о тишине,
    внутреннем мире и переживаниях души.
  </div>
</div>

<script>

/* 🌌 ЗВЁЗДЫ */
for(let i=0;i<80;i++){
  let s=document.createElement("div");
  s.className="star";
  s.style.left=Math.random()*100+"%";
  s.style.top=Math.random()*100+"%";
  s.style.opacity=Math.random();
  document.getElementById("bg").appendChild(s);
}

/* НАВИГАЦИЯ */
function show(id){
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* КНИГА */
let pages = [

`<h2>Слова — это следы души</h2>
<p style="text-align:center;">Вера Климошенко</p>`,

`<h3>А ты пойдёшь с нами, Господи?</h3>
<p>
Этот день я вспоминаю всегда, когда проезжаю по мосту...
</p>`,

`<p>
Мы шли по льду.  
Каждый шаг был испытанием.
</p>`,

`<p>
Мы успели.  
Слава Богу.
</p>`

];

let current = 0;

function render(){
  document.getElementById("bookContent").innerHTML =
    "<div class='page'>" + pages[current] + "</div>";
}

function next(){
  if(current < pages.length-1){
    current++;
    render();
  }
}

function prev(){
  if(current > 0){
    current--;
    render();
  }
}

window.onload = render;

</script>

</body>
</html>
