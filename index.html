<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Книга</title>

<style>
body {
    margin: 0;
    padding: 0;
    background: #f3f1ea;
    font-family: Georgia, "Times New Roman", serif;
    color: #2b2b2b;
    line-height: 1.8;
}

/* Book container */
.book {
    max-width: 800px;
    margin: 60px auto;
    background: #fff;
    padding: 80px 60px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
    border-radius: 8px;
}

/* Cover page */
.cover {
    height: 90vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    background: linear-gradient(135deg, #fff, #f7f3ec);
    border-bottom: 1px solid #ddd;
}

.cover h1 {
    font-size: 48px;
    margin-bottom: 20px;
    letter-spacing: 2px;
}

.cover p {
    font-size: 20px;
    opacity: 0.7;
}

/* Chapter styles */
.chapter {
    margin-top: 80px;
    page-break-before: always;
}

.chapter h2 {
    font-size: 28px;
    margin-bottom: 20px;
    border-bottom: 1px solid #ddd;
    padding-bottom: 10px;
}

p {
    text-align: justify;
    font-size: 18px;
}

/* Table of contents */
.toc {
    margin: 40px 0;
    padding: 20px;
    border: 1px solid #ddd;
    background: #fafafa;
}

.toc h3 {
    margin-top: 0;
}

.toc a {
    display: block;
    text-decoration: none;
    color: #333;
    margin: 5px 0;
}

.toc a:hover {
    text-decoration: underline;
}

/* Print style */
@media print {
    body {
        background: white;
    }
    .book {
        box-shadow: none;
        margin: 0;
        padding: 0;
    }
}
</style>
</head>

<body>

<div class="cover">
    <h1>Слова — это следы души</h1>
    <p>Вера Климошенко</p>
</div>

<div class="book">

<div class="toc">
    <h3>Содержание</h3>
    <a href="#ch1">Глава 1</a>
    <a href="#ch2">Глава 2</a>
</div>

<div id="ch1" class="chapter">
    <h2>Глава 1</h2>
    <p>Здесь будет твой текст первой главы. Ты можешь вставить сюда свои рассказы полностью, без сокращений.</p>
</div>

<div id="ch2" class="chapter">
    <h2>Глава 2</h2>
    <p>Здесь будет вторая глава твоей книги. Текст автоматически выглядит как печатная книга.</p>
</div>

</div>

</body>
</html>
