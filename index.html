<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Absolute God Mode WebGL Book</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  overflow:hidden;
  background:#000;
}
canvas{
  display:block;
}
.ui{
  position:fixed;
  right:20px;
  top:50%;
  transform:translateY(-50%);
  display:flex;
  flex-direction:column;
  gap:10px;
  z-index:10;
}
button{
  padding:10px 14px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  background:rgba(255,255,255,0.9);
  font-weight:bold;
}
</style>

</head>
<body>

<div class="ui">
  <button onclick="openBook()">📖 Open</button>
  <button onclick="nextPage()">➡ Next</button>
  <button onclick="prevPage()">⬅ Back</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

let scene, camera, renderer;
let pages = [];
let current = 0;

let dragging = false;
let lastX = 0;
let velocity = 0;

/* INIT WEBGL */
init();
animate();

function init(){

  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth/window.innerHeight,
    0.1,
    1000
  );

  camera.position.z = 4;

  renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  /* LIGHT (dynamic) */
  const light = new THREE.PointLight(0xffffff, 1.2);
  light.position.set(2,2,3);
  scene.add(light);

  const ambient = new THREE.AmbientLight(0x222222);
  scene.add(ambient);

  /* CREATE PAGES */
  const geo = new THREE.PlaneGeometry(2,3,30,30);

  const materials = [
    new THREE.MeshStandardMaterial({color:0xf5f1e6, side:THREE.DoubleSide}),
    new THREE.MeshStandardMaterial({color:0xf0e7d2, side:THREE.DoubleSide}),
    new THREE.MeshStandardMaterial({color:0xece2c8, side:THREE.DoubleSide})
  ];

  for(let i=0;i<3;i++){

    let mesh = new THREE.Mesh(geo, materials[i]);

    mesh.position.x = 0;
    mesh.position.z = -i * 0.02;

    scene.add(mesh);
    pages.push(mesh);
  }

  /* DRAG EVENTS */
  window.addEventListener("mousedown",(e)=>{
    dragging = true;
    lastX = e.clientX;
  });

  window.addEventListener("mouseup",()=>{
    dragging = false;

    if(Math.abs(velocity) > 0.02){
      if(velocity < 0) nextPage();
      else prevPage();
    }

    velocity = 0;
  });

  window.addEventListener("mousemove",(e)=>{
    if(!dragging) return;

    velocity = (e.clientX - lastX) * 0.002;
    lastX = e.clientX;

    applyCurl(velocity);
  });

  window.addEventListener("resize",onResize);
}

/* REALISTIC CURL (WEBGL DEFORM) */
function applyCurl(v){

  let mesh = pages[current];
  let pos = mesh.geometry.attributes.position;

  for(let i=0;i<pos.count;i++){

    let x = pos.getX(i);

    let bend = v * 1.5;

    pos.setZ(i, Math.sin(x * 2 + bend) * Math.abs(v) * 0.5);
  }

  pos.needsUpdate = true;
}

/* NEXT PAGE */
function nextPage(){
  if(current < pages.length-1){
    animateFlip(pages[current], -1);
    current++;
  }
}

/* PREV PAGE */
function prevPage(){
  if(current > 0){
    current--;
    animateFlip(pages[current], 1);
  }
}

/* FLIP ANIMATION */
function animateFlip(mesh, dir){

  let angle = 0;
  let speed = 0.1;

  function step(){
    angle += speed;

    mesh.rotation.y = dir * -angle;

    if(angle < Math.PI){
      requestAnimationFrame(step);
    }
  }

  step();
}

/* OPEN */
function openBook(){
  camera.position.z = 4;
}

/* RENDER LOOP */
function animate(){

  requestAnimationFrame(animate);

  renderer.render(scene,camera);
}

/* RESIZE */
function onResize(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

</script>

</body>
</html>
