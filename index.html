<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Слова — это следы души</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family: Georgia, serif;
  background:#fdfbf7;
}

#app{
  max-width:700px;
  margin:auto;
  padding:20px;
}

h1,h2{
  text-align:center;
}

.cover img{
  width:220px;
  display:block;
  margin:20px auto;
}

.menu{
  text-align:center;
}

.menu button{
  margin:5px;
  padding:10px;
}

p{
  line-height:1.8;
  text-indent:2em;
}

.poem{
  white-space:pre-line;
  text-align:center;
  text-indent:0;
}
</style>
</head>

<body>

<div id="app"></div>

<script>

const COVER = "https://i.imgur.com/8QZ7Z8T.png";

let book = [

{type:"cover"},

{
type:"menu",
title:"Оглавление",
items:[
"📚 Рассказы",
"✨ Стихи"
]
},

/* ===== РАССКАЗЫ ===== */

{
type:"section",
title:"📚 Рассказы"
},

{
type:"story",
title:"Валяй-бригада",
text:`ВСТАВЬ СЮДА ПОЛНЫЙ ТЕКСТ РАССКАЗА`
},

/* ===== СТИХИ ===== */

{
type:"section",
title:"✨ Стихи"
},

{
type:"poem",
title:"Спасибо за Молитвы Дом",
text:`ВСТАВЬ ПОЛНЫЙ ТЕКСТ`
},

{
type:"poem",
title:"Гимн весны",
text:`ВСТАВЬ ПОЛНЫЙ ТЕКСТ`
},

{
type:"poem",
title:"Направляйте взор на Христа",
text:`ВСТАВЬ ПОЛНЫЙ ТЕКСТ`
}

/* ➕ ДОБАВЛЯЙ СКОЛЬКО ХОЧЕШЬ */

];

let current=0;

function render(){
let p=book[current];

if(p.type==="cover"){
app.innerHTML=`
<h1>Слова — это следы души</h1>
<img src="${COVER}">
<h3 style="text-align:center;">Вера Климошенко</h3>
<div class="menu">
<button onclick="next()">Открыть книгу</button>
</div>`;
return;
}

if(p.type==="menu"){
app.innerHTML=`
<h2>${p.title}</h2>
<div class="menu">
${p.items.map((t,i)=>`<button onclick="go(${i+2})">${t}</button>`).join("")}
</div>`;
return;
}

if(p.type==="section"){
app.innerHTML=`<h2>${p.title}</h2>`;
return;
}

if(p.type==="story"){
app.innerHTML=`<h2>${p.title}</h2><p>${p.text}</p>`;
}

if(p.type==="poem"){
app.innerHTML=`<h2>${p.title}</h2><p class="poem">${p.text}</p>`;
}
}

function next(){ if(current<book.length-1){current++;render();}}
function prev(){ if(current>0){current--;render();}}
function go(i){ current=i; render(); }

document.addEventListener("click", e=>{
if(e.clientX>window.innerWidth/2) next();
else prev();
});

render();

</script>

</body>
</html>
