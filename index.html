<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Моя книга</title>

<style>
body {
  margin: 0;
  background: #0b0b0b;
  font-family: Georgia, serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  color: white;
}

.book {
  width: 600px;
  height: 400px;
  position: relative;
  perspective: 1500px;
}
  .page {
  width: 50%;
  height: 100%;
  background: linear-gradient(to right, #1a1a1a, #111);
  position: absolute;
  top: 0;
  left: 50%;
  transform-origin: left;
  transform-style: preserve-3d;
  transition: transform 1s cubic-bezier(0.4, 0.2, 0.2, 1);
  padding: 20px;
  box-sizing: border-box;
  box-shadow: 
    inset 0 0 40px rgba(0,0,0,0.6),
    0 0 20px rgba(0,0,0,0.4);
  border-left: 1px solid rgba(255,255,255,0.05);
}
.page::after {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  background: #0f0f0f;
  top: 0;
  left: 0;
  transform: rotateY(180deg);
  backface-visibility: hidden;
}
.page:nth-child(1) { z-index: 3; }
.page:nth-child(2) { z-index: 2; }
.page:nth-child(3) { z-index: 1; }

.flipped {
  transform: rotateY(-180deg) scale(0.98);
}

button {
  position: absolute;
  bottom: -60px;
  padding: 10px 20px;
  background: #222;
  color: white;
  border: none;
  cursor: pointer;
}

.prev {
  left: 0;
}

.next {
  right: 0;
}
</style>
</head>
<audio id="flipSound" src="https://www.soundjay.com/page-flip-01a.mp3"></audio> 
<body>

<div class="book">

  <div class="page" id="p1">
    <h2>Моя книга</h2>
    <p>"Слова — это следы души"</p>
  </div>

  <div class="page" id="p2">
    <h2>Стихи</h2>
    <p>
    Тишина говорит со мной,<br>
    Словно ветер в пустом окне...<br><br>
    И я снова ищу покой,<br>
    Но он прячется где-то во мне.
    </p>
  </div>

  <div class="page" id="p3">
    <h2>Продолжение</h2>
    <p>Здесь будут твои рассказы и кроссворды...</p>
  </div>

  <button class="prev" onclick="prevPage()">← Назад</button>
  <button class="next" onclick="nextPage()">Вперёд →</button>

</div>

<script>
let current = 1;
const total = 3;

function playSound() {
  document.getElementById("flipSound").play();
}

function nextPage() {
  if (current <= total) {
    document.getElementById("p" + current).classList.add("flipped");
    playSound();
    current++;
  }
}

function prevPage() {
  if (current > 1) {
    current--;
    document.getElementById("p" + current).classList.remove("flipped");
    playSound();
  }
}
</script>

</body>background: radial-gradient(circle at center, #111 0%, #000 100%);
</html>
