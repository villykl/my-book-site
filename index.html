<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Digital Book</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background: radial-gradient(circle at center, #0a0a0a, #000);
  font-family: Georgia, serif;
}

/* STAGE */
.stage{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  perspective:2600px;
}

/* BOOK */
.book{
  width:820px;
  height:520px;
  position:relative;
  transform-style:preserve-3d;
  transform: rotateX(6deg);
}

/* spine */
.book::before{
  content:"";
  position:absolute;
  width:28px;
  height:100%;
  left:50%;
  transform:translateX(-50%);
  background:linear-gradient(#111,#000,#111);
  box-shadow:0 0 60px rgba(0,0,0,0.8);
}

/* COVER (LEATHER) */
.cover{
  position:absolute;
  width:50%;
  height:100%;
  left:50%;
  transform-origin:left;

  background:
    linear-gradient(135deg, rgba(0,0,0,0.55), rgba(255,255,255,0.05)),
    url('https://www.transparenttextures.com/patterns/dark-leather.png');

  background-color:#3a2215;
  background-size:cover;

  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;

  color:#f3e3d0;
  text-align:center;

  box-shadow:
    inset 0 0 80px rgba(0,0,0,0.9),
    0 70px 140px rgba(0,0,0,0.95);

  transition: transform 1.5s cubic-bezier(.2,.8,.2,1);
  z-index:10;
}

.cover h1{
  font-size:32px;
  margin:0;
}

.cover p{
  font-size:14px;
  opacity:0.8;
}

.book.open .cover{
  transform: rotateY(-180deg);
}

/* PAGES */
.page{
  position:absolute;
  width:50%;
  height:100%;
  left:50%;
  transform-origin:left;
  background:#f6f1e3;

  box-shadow:0 30px 80px rgba(0,0,0,0.6);

  padding:45px;
  box-sizing:border-box;

  transition:transform 1.1s cubic-bezier(.77,0,.18,1);
}

.page:nth-child(2){ z-index:5; }
.page:nth-child(3){ z-index:4; }
.page:nth-child(4){ z-index:3; }

.page.flipped{
  transform: rotateY(-180deg);
}

/* shadow */
.page::after{
  content:"";
  position:absolute;
  top:0;
  right:0;
  width:30px;
  height:100%;
  background:linear-gradient(to left, rgba(0,0,0,0.15), transparent);
}

/* TEXT */
h1{
  text-align:center;
  font-size:26px;
}

p{
  font-size:17px;
  line-height:1.8;
}

/* LIGHT */
.light{
  position:fixed;
  width:100%;
  height:100%;
  background: radial-gradient(circle at var(--x,50%) var(--y,50%), rgba(255,255,255,0.07), transparent 45%);
  pointer-events:none;
}

/* UI */
.ui{
  position:fixed;
  bottom:20px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:10px;
}

button{
  padding:10px 14px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:white;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="light"></div>

<div class="stage">

  <div class="book" id="book">

    <div class="cover" onclick="openBook()">
      <h1>Слова — следы души</h1>
      <p>Нажми, чтобы открыть</p>
    </div>

    <div class="page">
      <h1>Глава 1</h1>
      <p>Это твоя финальная цифровая книга. Она выглядит как реальный кожаный том.</p>
    </div>

    <div class="page">
      <h1>Глава 2</h1>
      <p>Перелистывание страниц имитирует физическую бумагу.</p>
    </div>

    <div class="page">
      <h1>Глава 3</h1>
      <p>Ты можешь заменить текст на свою книгу, стихи или истории.</p>
    </div>

  </div>
</div>

<!-- UI -->
<div class="ui">
  <button onclick="flip()">➡ Flip</button>
  <button onclick="resetBook()">🔄 Reset</button>
</div>

<script>

const book = document.getElementById("book");
const pages = document.querySelectorAll(".page");
let i = 0;

/* OPEN */
function openBook(){
  book.classList.add("open");
}

/* FLIP */
function flip(){
  if(i < pages.length){
    pages[i].classList.add("flipped");
    i++;
  }
}

/* RESET */
function resetBook(){
  pages.forEach(p=>p.classList.remove("flipped"));
  book.classList.remove("open");
  i = 0;
}

/* LIGHT FOLLOW */
document.addEventListener("mousemove",(e)=>{
  document.documentElement.style.setProperty("--x", e.clientX+"px");
  document.documentElement.style.setProperty("--y", e.clientY+"px");
});

/* SWIPE */
let startX = 0;

document.addEventListener("touchstart",(e)=>{
  startX = e.touches[0].clientX;
});

document.addEventListener("touchend",(e)=>{
  let endX = e.changedTouches[0].clientX;
  if(endX - startX > 40) resetBook();
  if(startX - endX > 40) flip();
});

/* KEYBOARD */
document.addEventListener("keydown",(e)=>{
  if(e.key==="ArrowRight") flip();
  if(e.key==="ArrowLeft") resetBook();
});

</script>

</body>
</html>
