<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Вера Климошенко — Автор</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: 'Georgia', serif;
  background: #0a0a0a;
  color: white;
}

/* МЕНЮ */
.nav {
  position: fixed;
  top: 0;
  width: 100%;
  display: flex;
  justify-content: center;
  gap: 30px;
  padding: 15px;
  backdrop-filter: blur(10px);
  background: rgba(0,0,0,0.5);
  z-index: 100;
}

.nav button {
  background: none;
  border: none;
  color: white;
  font-size: 16px;
  transition: 0.3s;
}

.nav button:hover {
  opacity: 0.6;
}

/* СЕКЦИИ */
.section {
  display: none;
  padding: 100px 20px;
  max-width: 900px;
  margin: auto;
  animation: fade 0.6s;
}

.active {
  display: block;
}

@keyframes fade {
  from {opacity:0; transform: translateY(20px);}
  to {opacity:1; transform: translateY(0);}
}

/* ГЛАВНАЯ */
.hero {
  text-align: center;
  margin-top: 120px;
}

.hero h1 {
  font-size: 42px;
  letter-spacing: 2px;
}

.hero p {
  opacity: 0.7;
  font-size: 18px;
}

/* КНОПКА */
.btn {
  margin-top: 20px;
  padding: 10px 20px;
  border: 1px solid white;
  background: none;
  color: white;
  cursor: pointer;
}

/* КНИГА */
.book {
  background: #fdfbf7;
  color: black;
  padding: 30px;
  border-radius: 15px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.7);
}

.page {
  line-height: 1.8;
  font-size: 18px;
}

.controls {
  display: flex;
  justify-content: space-between;
  margin-top: 20px;
}

/* ОБ АВТОРЕ */
.about {
  line-height: 1.8;
  font-size: 18px;
}

/* КОНТАКТЫ */
.contact input, .contact textarea {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  background: #111;
  border: 1px solid #333;
  color: white;
}
</style>
</head>

<body>

<!-- МЕНЮ -->
<div class="nav">
  <button onclick="show('home')">Главная</button>
  <button onclick="show('book')">Книга</button>
  <button onclick="show('about')">Об авторе</button>
  <button onclick="show('contact')">Контакты</button>
</div>

<!-- ГЛАВНАЯ -->
<div id="home" class="section active">
  <div class="hero">
    <h1>Вера Климошенко</h1>
    <p>Слова — это следы души</p>
    <button class="btn" onclick="show('book')">Читать книгу</button>
  </div>
</div>

<!-- КНИГА -->
<div id="book" class="section">
  <div class="book" id="bookContent"></div>

  <div class="controls">
    <button onclick="prev()">⬅️ Назад</button>
    <button onclick="next()">Вперёд ➡️</button>
  </div>
</div>

<!-- ОБ АВТОРЕ -->
<div id="about" class="section">
  <h2>Об авторе</h2>
  <div class="about">
    Вера Климошенко — автор произведений о внутреннем мире человека,
    тишине, вере и переживаниях души.
    <br><br>
    Её тексты — это отражение чувств и глубоких размышлений.
  </div>
</div>

<!-- КОНТАКТЫ -->
<div id="contact" class="section">
  <h2>Контакты</h2>
  <div class="contact">
    <input placeholder="Ваше имя">
    <input placeholder="Email">
    <textarea placeholder="Сообщение"></textarea>
  </div>
</div>

<script>

/* НАВИГАЦИЯ */
function show(id){
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* КНИГА */
let pages = [

`<h2>Слова — это следы души</h2>
<p style="text-align:center;">Вера Климошенко</p>`,

`<h3>А ты пойдёшь с нами, Господи?</h3>
<p>Этот день я вспоминаю всегда...</p>`,

`<p>Мы шли по льду...</p>`,

`<p>Мы успели. Слава Богу.</p>`

];

let current = 0;

function render(){
  document.getElementById("bookContent").innerHTML =
    "<div class='page'>" + pages[current] + "</div>";
}

function next(){
  if(current < pages.length-1){
    current++;
    render();
  }
}

function prev(){
  if(current > 0){
    current--;
    render();
  }
}

window.onload = render;

</script>

</body>
</html>
