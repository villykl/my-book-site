<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Книга</title>

<style>
body {
  margin: 0;
  font-family: Georgia, serif;
  background: #1b1b1b;
  overflow: hidden;
}

/* ===== STAGE ===== */
.stage {
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  perspective: 2000px;
}

/* ===== BOOK ===== */
.book {
  width: 700px;
  height: 450px;
  position: relative;
  transform-style: preserve-3d;
}

/* ===== COVER ===== */
.cover {
  position: absolute;
  width: 50%;
  height: 100%;
  left: 50%;
  transform-origin: left;
  background: url('https://images.unsplash.com/photo-1524995997946-a1c2e315a42f') center/cover;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  box-shadow: 0 30px 80px rgba(0,0,0,0.6);
  transition: transform 1.2s ease;
  z-index: 5;
}

/* OPEN COVER */
.book.open .cover {
  transform: rotateY(-180deg);
}

/* ===== PAGES ===== */
.page {
  position: absolute;
  width: 50%;
  height: 100%;
  left: 50%;
  transform-origin: left;
  background: #fff;
  box-shadow: 0 20px 40px rgba(0,0,0,0.3);
  padding: 40px;
  box-sizing: border-box;
  transition: transform 1s ease;
  overflow: hidden;
}

/* stack pages */
.page:nth-child(2) { z-index: 4; }
.page:nth-child(3) { z-index: 3; }
.page:nth-child(4) { z-index: 2; }

/* flipped pages */
.page.flipped {
  transform: rotateY(-180deg);
}

/* TEXT */
h1 {
  font-size: 24px;
  text-align: center;
}

p {
  font-size: 16px;
  line-height: 1.7;
}

/* BUTTONS */
.controls {
  position: fixed;
  bottom: 20px;
  width: 100%;
  display: flex;
  justify-content: center;
  gap: 10px;
}

button {
  padding: 10px 20px;
  border: none;
  cursor: pointer;
  background: white;
  border-radius: 8px;
}
</style>
</head>

<body>

<div class="stage">

  <div class="book" id="book">

    <!-- COVER -->
    <div class="cover" onclick="openBook()">
      📖 НАЖМИ ЧТОБЫ ОТКРЫТЬ
    </div>

    <!-- PAGES -->
    <div class="page">
      <h1>Глава 1</h1>
      <p>Это первая страница твоей книги. Она выглядит как настоящая бумага.</p>
    </div>

    <div class="page">
      <h1>Глава 2</h1>
      <p>Перелистывание страниц происходит с 3D эффектом.</p>
    </div>

    <div class="page">
      <h1>Глава 3</h1>
      <p>Ты можешь заменить этот текст на свои рассказы.</p>
    </div>

  </div>
</div>

<!-- CONTROLS -->
<div class="controls">
  <button onclick="flipPage()">📄 Перелистнуть</button>
  <button onclick="resetBook()">🔄 Сброс</button>
</div>

<script>
let current = 0;
const pages = document.querySelectorAll('.page');
const book = document.getElementById('book');

function openBook() {
  book.classList.add('open');
}

function flipPage() {
  if (current < pages.length) {
    pages[current].classList.add('flipped');
    current++;
  }
}

function resetBook() {
  pages.forEach(p => p.classList.remove('flipped'));
  book.classList.remove('open');
  current = 0;
}
</script>

</body>
</html>
