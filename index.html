<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Книга</title>

<style>
body {
    margin: 0;
    padding: 0;
    background: #f3f1ea;
    font-family: Georgia, "Times New Roman", serif;
    color: #2b2b2b;
    line-height: 1.8;
}

.book {
    max-width: 800px;
    margin: 60px auto;
    background: #fff;
    padding: 80px 60px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
    border-radius: 8px;
}

.cover {
    height: 90vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    background: url('images/cover.jpg') center/cover no-repeat;
    color: white;
    text-shadow: 0 2px 10px rgba(0,0,0,0.6);
}

.cover-inner {
    background: rgba(0,0,0,0.35);
    padding: 60px 40px;
    border-radius: 12px;
}

.cover h1 {
    font-size: 48px;
    margin-bottom: 20px;
    letter-spacing: 2px;
}

.cover p {
    font-size: 20px;
    opacity: 0.9;
}

.chapter {
    margin-top: 80px;
    page-break-before: always;
}

.chapter h2 {
    font-size: 28px;
    margin-bottom: 20px;
    border-bottom: 1px solid #ddd;
    padding-bottom: 10px;
}

p {
    text-align: justify;
    font-size: 18px;
}

.toc {
    margin: 40px 0;
    padding: 20px;
    border: 1px solid #ddd;
    background: #fafafa;
}

.toc a {
    display: block;
    text-decoration: none;
    color: #333;
    margin: 5px 0;
}

.toc a:hover {
    text-decoration: underline;
}

@media print {
    body { background: white; }
    .book { box-shadow: none; margin: 0; padding: 0; }
}
</style>
</head>

<body>

<!-- ОБЛОЖКА -->
<div class="cover">
    <div class="cover-inner">
        <h1>Слова — это следы души</h1>
        <p>Вера Климошенко</p>
    </div>
</div>

<div class="book">

<div class="toc">
    <h3>Содержание</h3>
    <a href="#ch1">Глава 1</a>
    <a href="#ch2">Глава 2</a>
</div>

<div id="ch1" class="chapter">
    <h2>Глава 1</h2>
    <p>Твой текст первой главы здесь...</p>
</div>

<div id="ch2" class="chapter">
    <h2>Глава 2</h2>
    <p>Твой текст второй главы здесь...</p>
</div>

</div>

</body>
</html
