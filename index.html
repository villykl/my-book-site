<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultra Polish Book</title>

<style>
body{
  margin:0;
  font-family: Georgia, serif;
  background:#0b0b0b;
  overflow:hidden;
}

/* ================= COVER ================= */
#cover{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background: radial-gradient(circle at center, #000, #120a06);
  perspective:1400px;
}

/* 📖 BOOK COVER */
.cover-book{
  width:340px;
  height:460px;

  background:
    linear-gradient(135deg, rgba(0,0,0,0.3), rgba(0,0,0,0.8)),
    url("cover.jpg");

  background-size:cover;
  background-position:center;

  border-radius:8px 18px 18px 8px;

  box-shadow:
    -14px 0 0 rgba(0,0,0,0.25),
    0 50px 120px rgba(0,0,0,0.9);

  transform-origin:left;
  transition:1s cubic-bezier(.2,.8,.2,1);

  position:relative;
  overflow:hidden;

  border-left:6px solid rgba(0,0,0,0.35);
}

/* 📖 TITLE */
.cover-text{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;

  color:white;
  font-size:26px;
  font-weight:bold;
  text-align:center;
  padding:30px;

  text-shadow:
    0 3px 15px rgba(0,0,0,0.9),
    0 0 40px rgba(0,0,0,0.6);
}

/* OPEN ANIMATION (REAL BOOK FEEL) */
.cover-open{
  transform:
    rotateY(-120deg)
    translateX(-40px);
  opacity:0;
}

/* BUTTON */
#openBtn{
  position:absolute;
  bottom:70px;
  padding:12px 18px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

/* ================= SCENE ================= */
#scene{
  display:none;
  height:100vh;
  align-items:center;
  justify-content:center;
  perspective:2000px;
  background: radial-gradient(circle at center, #1a1a1a, #000);
}

/* BOOK */
.book{
  width:820px;
  height:520px;
  position:relative;
  transform-style:preserve-3d;
  transform: rotateX(10deg);
}

/* SPINE */
.book::before{
  content:"";
  position:absolute;
  width:30px;
  height:100%;
  left:50%;
  transform:translateX(-50%);
  background:linear-gradient(#111,#000,#111);
}

/* ================= PAGES ================= */
.page{
  position:absolute;
  width:50%;
  height:100%;
  left:50%;
  transform-origin:left;

  background:
    linear-gradient(to right, #f7f2e6, #efe7d5);

  padding:40px;
  box-sizing:border-box;

  transition:1s cubic-bezier(.2,.8,.2,1);

  box-shadow:
    0 30px 80px rgba(0,0,0,0.6);

  border-radius:0 10px 10px 0;

  cursor:grab;
}

.page:active{
  cursor:grabbing;
}

.page:nth-child(1){ z-index:3; }
.page:nth-child(2){ z-index:2; }
.page:nth-child(3){ z-index:1; }

.page.flipped{
  transform: rotateY(-180deg);
}

/* ================= UI ================= */
.ui{
  position:fixed;
  bottom:20px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:10px;
}

button{
  padding:10px 14px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:white;
  font-weight:bold;
}
</style>
</head>

<body>

<!-- 📖 COVER -->
<div id="cover">

  <div class="cover-book" id="coverBook">
    <div class="cover-text">
      Вест-Спрингфилд 2025
    </div>
  </div>

  <button id="openBtn" onclick="openBook()">Открыть книгу</button>
</div>

<!-- 📚 BOOK -->
<div id="scene">

  <div class="book">

    <div class="page">
      <h1>Глава 1</h1>
      <p>Ultra Polish версия книги.</p>
    </div>

    <div class="page">
      <h1>Глава 2</h1>
      <p>Теперь это ощущается как Apple Books.</p>
    </div>

    <div class="page">
      <h1>Глава 3</h1>
      <p>Перелистывание с физическим ощущением.</p>
    </div>

  </div>

</div>

<!-- UI -->
<div class="ui">
  <button onclick="flip()">➡ Next</button>
  <button onclick="reset()">🔄 Reset</button>
</div>

<script>

let i = 0;
const pages = document.querySelectorAll(".page");

/* 📖 OPEN BOOK */
function openBook(){
  document.getElementById("coverBook").classList.add("cover-open");

  setTimeout(()=>{
    document.getElementById("cover").style.display = "none";
    document.getElementById("scene").style.display = "flex";
  }, 900);
}

/* 📄 FLIP */
function flip(){
  if(i < pages.length){
    pages[i].classList.add("flipped");
    i++;
  }
}

/* 🔄 RESET */
function reset(){
  pages.forEach(p => p.classList.remove("flipped"));
  i = 0;
}

/* ✋ SWIPE (simple drag feel) */
let startX = 0;

document.addEventListener("mousedown", e=>{
  startX = e.clientX;
});

document.addEventListener("mouseup", e=>{
  let diff = e.clientX - startX;

  if(diff < -50){
    flip();
  }
  if(diff > 50){
    if(i > 0){
      pages[i-1].classList.remove("flipped");
      i--;
    }
  }
});

</script>

</body>
</html>
