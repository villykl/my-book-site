<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kindle Ultra Reader</title>

<style>
:root {
  --bg: #0b0b0b;
  --card: #171717;
  --text: #f5f1e8;
  --accent: #c7a76c;
}

body.light {
  --bg: #f4f4f4;
  --card: #ffffff;
  --text: #111;
}

body {
  margin: 0;
  font-family: Georgia, serif;
  background: var(--bg);
  color: var(--text);
  transition: 0.3s;
}

/* 📚 LIBRARY */
.header {
  padding: 20px;
  display: flex;
  gap: 10px;
  align-items: center;
}

input {
  flex: 1;
  padding: 10px;
  border-radius: 10px;
  border: none;
}

/* GRID */
.library {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 16px;
  padding: 20px;
}

/* BOOK CARD */
.book {
  background: var(--card);
  border-radius: 14px;
  overflow: hidden;
  cursor: pointer;
  transition: 0.25s;
  box-shadow: 0 10px 30px rgba(0,0,0,0.4);
}

.book:hover {
  transform: translateY(-5px);
}

.cover {
  height: 210px;
  background-size: cover;
  background-position: center;
}

.title {
  padding: 10px;
  font-size: 14px;
}

/* 📖 READER */
.reader {
  display: none;
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

.page {
  background: var(--card);
  padding: 60px;
  border-radius: 14px;
  box-shadow: 0 30px 100px rgba(0,0,0,0.5);
  min-height: 60vh;
  transition: opacity 0.2s;
}

/* TOP BAR */
.topbar {
  display: flex;
  justify-content: space-between;
  margin-bottom: 15px;
}

/* NAV */
.nav {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 15px;
}

button {
  padding: 10px 14px;
  border: none;
  border-radius: 10px;
  background: #222;
  color: white;
  cursor: pointer;
}

/* PROGRESS */
.progress {
  height: 4px;
  background: #333;
  border-radius: 10px;
  overflow: hidden;
  margin-top: 10px;
}

.bar {
  height: 100%;
  width: 0%;
  background: var(--accent);
}

/* ANIMATION */
.fade {
  animation: fade .25s ease;
}

@keyframes fade {
  from { opacity: 0; transform: scale(0.98); }
  to { opacity: 1; transform: scale(1); }
}
</style>
</head>

<body>

<!-- 📚 LIBRARY -->
<div id="libraryView">

  <div class="header">
    <input id="search" placeholder="Поиск книг..." oninput="filterBooks()">
    <button onclick="toggleTheme()">🌙</button>
  </div>

  <div class="library" id="library"></div>
</div>

<!-- 📖 READER -->
<div id="readerView" class="reader">

  <div class="topbar">
    <button onclick="back()">⬅</button>
    <button onclick="bookmark()">📌</button>
  </div>

  <div class="page fade" id="page"></div>

  <div class="progress"><div class="bar" id="bar"></div></div>

  <div class="nav">
    <button onclick="prev()">◀</button>
    <button onclick="next()">▶</button>
  </div>

</div>

<script>

/* 📚 BOOK DATA */
const books = [
{
  title: "Слова — это следы души",
  cover: "YOUR_COVER.jpg",
  pages: [
    "Вера Климошенко",
    "Вступление: Слова сопровождают нас...",
    "Глава I: Каждое слово — это след души...",
    "Эпилог: Всё сказанное остаётся..."
  ]
},
{
  title: "Вторая книга",
  cover: "https://images.unsplash.com/photo-1524995997946-a1c2e315a42f",
  pages: ["Начало...", "Глава 1...", "Финал..."]
}
];

let current = null;
let page = 0;

/* 📚 render library */
function renderLibrary(list = books) {
  const el = document.getElementById("library");
  el.innerHTML = "";

  list.forEach((b, i) => {
    const div = document.createElement("div");
    div.className = "book";
    div.onclick = () => openBook(i);

    div.innerHTML = `
      <div class="cover" style="background-image:url('${b.cover}')"></div>
      <div class="title">${b.title}</div>
    `;

    el.appendChild(div);
  });
}

/* 📖 open */
function openBook(i) {
  current = books[i];
  page = 0;

  document.getElementById("libraryView").style.display = "none";
  document.getElementById("readerView").style.display = "block";

  renderPage();
}

/* 📄 render page */
function renderPage() {
  const el = document.getElementById("page");

  el.classList.remove("fade");
  void el.offsetWidth;
  el.classList.add("fade");

  el.innerHTML = `
    <h2>${current.title}</h2>
    <p>${current.pages[page]}</p>
  `;

  updateProgress();
}

/* 📊 progress */
function updateProgress() {
  let percent = (page / (current.pages.length - 1)) * 100;
  document.getElementById("bar").style.width = percent + "%";
}

/* ⬅ back */
function back() {
  document.getElementById("libraryView").style.display = "block";
  document.getElementById("readerView").style.display = "none";
}

/* ▶ next */
function next() {
  if (page < current.pages.length - 1) {
    page++;
    renderPage();
  }
}

/* ◀ prev */
function prev() {
  if (page > 0) {
    page--;
    renderPage();
  }
}

/* 📌 bookmark */
function bookmark() {
  localStorage.setItem("bookmark_" + current.title, page);
  alert("Закладка сохранена");
}

/* 🌙 theme */
function toggleTheme() {
  document.body.classList.toggle("light");
}

/* 🔍 search */
function filterBooks() {
  const q = document.getElementById("search").value.toLowerCase();
  const filtered = books.filter(b => b.title.toLowerCase().includes(q));
  renderLibrary(filtered);
}

/* init */
renderLibrary();

</script>

</body>
</html>
