<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Моя книга</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  background:#0f0f0f;
  font-family:"Playfair Display", serif;
}

/* 📚 LAYOUT */
.wrapper{
  display:flex;
  height:100vh;
}

/* 📖 CONTENT LIST */
.toc{
  width:260px;
  background:#151515;
  padding:20px;
  overflow:auto;
  color:#fff;
}

.toc h2{
  font-size:16px;
  color:#aaa;
}

/* 📖 BUTTONS */
.toc button{
  width:100%;
  padding:10px;
  margin-bottom:8px;
  background:#222;
  color:#fff;
  border:none;
  cursor:pointer;
  text-align:left;
  border-radius:6px;
}

/* 📖 BOOK AREA */
.book-area{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:30px;
}

/* 📄 PAGE */
.page{
  width:750px;
  max-width:95%;
  background:#f6f1e6;
  color:#222;

  padding:60px 70px;
  line-height:1.8;
  font-size:18px;

  border-radius:10px;
  box-shadow:0 30px 80px rgba(0,0,0,0.6);

  display:none;
}

.page.active{
  display:block;
}

/* 📖 TITLE */
.page h1{
  text-align:center;
  margin-bottom:30px;
}

/* ✍️ POEM */
.poem{
  white-space:pre-line;
  text-align:center;
}

/* 📱 MOBILE */
@media(max-width:768px){
  .wrapper{
    flex-direction:column;
  }
  .toc{
    width:100%;
    display:flex;
    overflow-x:auto;
  }
  .toc button{
    min-width:160px;
  }
}

</style>
</head>

<body>

<div class="wrapper">

  <!-- 📚 ОГЛАВЛЕНИЕ -->
  <div class="toc">
    <h2>Оглавление</h2>
  </div>

  <!-- 📖 КНИГА -->
  <div class="book-area">
    <div id="book"></div>
  </div>

</div>

<!-- 📖 СЮДА ТЫ ВСТАВЛЯЕШЬ ВСЕ СТИХИ -->
<div id="data" style="display:none">

<h1>Тебе, мой Создатель</h1>

<div class="poem">
Тебе, мой Создатель, всё лучшее в мире:
И море стихов. И море цветов.
Это Тебе летят по эфиру
Сонеты прекрасных возвышенных слов.
</div>

<h1>Свет внутри</h1>

<div class="poem">
И в тишине рождается свет,
Когда душа устала от тревог.
И даже там, где будто света нет,
Горит внутри незримый Бог.
</div>

</div>

<script>

/* 📚 ДАННЫЕ */
const data = document.getElementById("data").innerHTML;
const parts = data.split("<h1>");

const book = document.getElementById("book");
const toc = document.querySelector(".toc");

let pages = [];

/* 📖 СОЗДАЁМ КНИГУ */
parts.forEach((p,i)=>{
  if(!p.trim()) return;

  let page = document.createElement("div");
  page.className="page";

  page.innerHTML="<h1>"+p;

  book.appendChild(page);
  pages.push(page);

  /* 📚 ОГЛАВЛЕНИЕ */
  let title = p.split("</h1>")[0];

  let btn = document.createElement("button");
  btn.innerText = title;
  btn.onclick = ()=>openPage(i-1);

  toc.appendChild(btn);
});

/* 📖 ОТКРЫТЬ СТРАНИЦУ */
function openPage(i){
  pages.forEach(p=>p.classList.remove("active"));
  if(pages[i]) pages[i].classList.add("active");
}

/* 📖 СТАРТ */
openPage(0);

</script>

</body>
</html>
