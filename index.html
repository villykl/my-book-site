<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Apple Books V5 WebGL Engine</title>

<style>
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #111, #000);
}

/* 📱 stage */
#stage {
  position: fixed;
  inset: 0;
}
canvas {
  display: block;
}
</style>
</head>

<body>

<div id="stage"></div>

<!-- three.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
/* =========================
   📖 WEBGL APPLE BOOKS ENGINE
   ========================= */

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 1000);
camera.position.z = 6;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(innerWidth, innerHeight);
document.getElementById("stage").appendChild(renderer.domElement);

/* 📖 TEXTURES (pages) */
const loader = new THREE.TextureLoader();

const textures = [
  makeCover(),
  makePage("Вступление\nСлова сопровождают нас всю жизнь."),
  makePage("Глава I\nКаждое слово — это след души."),
  makePage("Глава II\nИногда слова становятся светом."),
  makePage("Эпилог\nВсё сказанное остаётся.")
];

/* 📄 BOOK GEOMETRY */
const geometry = new THREE.PlaneGeometry(3.5, 5);
const materials = textures.map(t => new THREE.MeshBasicMaterial({ map: t }));

const pages = [];

for (let i = 0; i < materials.length; i++) {
  const mesh = new THREE.Mesh(geometry, materials[i]);
  mesh.position.x = i * 0.01;
  mesh.userData.index = i;
  scene.add(mesh);
  pages.push(mesh);
}

let current = 0;

/* 📱 PHYSICS */
let targetRotation = 0;
let rotation = 0;

/* 📖 INPUT */
let dragging = false;
let startX = 0;

window.addEventListener("mousedown", e => {
  dragging = true;
  startX = e.clientX;
});

window.addEventListener("mouseup", e => {
  dragging = false;

  const diff = e.clientX - startX;

  if (diff < -80 && current < pages.length - 1) current++;
  if (diff > 80 && current > 0) current--;

  targetRotation = current * -Math.PI * 0.9;
});

window.addEventListener("mousemove", e => {
  if (!dragging) return;

  const diff = e.clientX - startX;
  targetRotation = current * -Math.PI * 0.9 + diff * 0.005;
});

/* 📱 TOUCH */
window.addEventListener("touchstart", e => {
  startX = e.touches[0].clientX;
  dragging = true;
});

window.addEventListener("touchmove", e => {
  const diff = e.touches[0].clientX - startX;
  targetRotation = current * -Math.PI * 0.9 + diff * 0.005;
});

window.addEventListener("touchend", e => {
  dragging = false;

  const diff = e.changedTouches[0].clientX - startX;

  if (diff < -80 && current < pages.length - 1) current++;
  if (diff > 80 && current > 0) current--;

  targetRotation = current * -Math.PI * 0.9;
});

/* 📖 ANIMATION LOOP (physics smoothing) */
function animate() {
  requestAnimationFrame(animate);

  rotation += (targetRotation - rotation) * 0.08;

  pages.forEach((page, i) => {
    const offset = i * -Math.PI * 0.9;

    page.rotation.y = rotation - offset;

    /* 📌 fake curl physics */
    const bend = Math.sin(rotation - offset) * 0.2;
    page.position.z = Math.abs(rotation - offset) * 0.5;

    page.rotation.z = bend;
  });

  renderer.render(scene, camera);
}
animate();

/* 📖 PAGE TEXTURE GENERATORS */
function makePage(text) {
  const c = document.createElement("canvas");
  c.width = 1024;
  c.height = 1024;

  const ctx = c.getContext("2d");

  ctx.fillStyle = "#fffdf7";
  ctx.fillRect(0,0,c.width,c.height);

  ctx.fillStyle = "#111";
  ctx.font = "40px Georgia";
  ctx.textAlign = "center";

  const lines = text.split("\n");

  lines.forEach((l, i) => {
    ctx.fillText(l, c.width/2, 400 + i*60);
  });

  return new THREE.CanvasTexture(c);
}

/* 📘 COVER */
function makeCover() {
  const c = document.createElement("canvas");
  c.width = 1024;
  c.height = 1024;

  const ctx = c.getContext("2d");

  const img = new Image();
  img.src = "https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?auto=format&fit=crop&w=1600&q=80";

  img.onload = () => {
    ctx.drawImage(img, 0, 0, c.width, c.height);

    ctx.fillStyle = "rgba(0,0,0,0.55)";
    ctx.fillRect(0,0,c.width,c.height);

    ctx.fillStyle = "#f5e7d3";
    ctx.font = "60px Georgia";
    ctx.textAlign = "center";

    ctx.fillText("Слова — это следы души", c.width/2, 500);
    ctx.font = "30px Georgia";
    ctx.fillText("Вера Климошенко", c.width/2, 580);
  };

  return new THREE.CanvasTexture(c);
}

/* 📱 RESIZE */
window.addEventListener("resize", () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>

</body>
</html>
