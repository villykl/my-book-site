<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iPad Books Engine</title>

<style>
body{
  margin:0;
  background:#0b0b0b;
  font-family: Georgia, serif;
  overflow:hidden;
}

/* ================= COVER ================= */
#cover{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background: radial-gradient(circle at center, #000, #1a0f0a);
}

.cover{
  width:340px;
  height:460px;
  background:url("cover.jpg");
  background-size:cover;
  border-radius:10px;
  box-shadow:0 70px 160px rgba(0,0,0,0.9);
  transition:1s ease;
  transform-origin:left;
}

.open{
  transform:rotateY(-120deg) translateX(-80px);
  opacity:0;
}

/* ================= READER ================= */
#reader{
  display:none;
  height:100vh;
  justify-content:center;
  align-items:center;
  background: radial-gradient(circle at center, #1a1a1a, #000);
}

/* BOOK */
.book{
  width:820px;
  height:520px;
  position:relative;
  perspective:2500px;
}

/* SPINE */
.book::before{
  content:"";
  position:absolute;
  width:30px;
  height:100%;
  left:50%;
  transform:translateX(-50%);
  background:linear-gradient(#111,#000,#111);
}

/* PAGE */
.page{
  position:absolute;
  width:50%;
  height:100%;
  left:50%;
  transform-origin:left;

  background:linear-gradient(to right, #f7f2e6, #efe6d3);
  padding:40px;
  box-sizing:border-box;

  box-shadow:0 30px 80px rgba(0,0,0,0.5);

  transition:transform 0.2s linear;

  user-select:none;
}

/* stack */
.page:nth-child(1){ z-index:3; }
.page:nth-child(2){ z-index:2; }
.page:nth-child(3){ z-index:1; }

/* ================= UI ================= */
.ui{
  position:fixed;
  right:20px;
  top:50%;
  transform:translateY(-50%);
  display:flex;
  flex-direction:column;
  gap:10px;
  z-index:999;
}

button{
  padding:10px 14px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  background:rgba(255,255,255,0.9);
  font-weight:bold;
}

/* ================= CURVE EFFECT LAYER ================= */
.curve{
  transform-style:preserve-3d;
}
</style>
</head>

<body>

<!-- 📖 COVER -->
<div id="cover">
  <div class="cover" id="coverBook"></div>
</div>

<!-- 📚 BOOK -->
<div id="reader">

  <div class="book">

    <div class="page">📖 Глава 1 — начало</div>
    <div class="page">📖 Глава 2 — развитие</div>
    <div class="page">📖 Глава 3 — финал</div>

  </div>

</div>

<!-- UI -->
<div class="ui">
  <button onclick="openBook()">📖 Open</button>
</div>

<script>

let pages = document.querySelectorAll(".page");
let i = 0;

/* OPEN */
function openBook(){
  document.getElementById("coverBook").classList.add("open");

  setTimeout(()=>{
    document.getElementById("cover").style.display = "none";
    document.getElementById("reader").style.display = "flex";
  },900);
}

/* ================= iPAD CORNER DRAG PHYSICS ================= */
let dragging = false;
let startX = 0;
let current = null;
let velocity = 0;

document.addEventListener("mousedown",(e)=>{
  dragging = true;
  startX = e.clientX;
  current = pages[i];
});

document.addEventListener("mousemove",(e)=>{
  if(!dragging || !current) return;

  let dx = e.clientX - startX;

  velocity = dx * 0.01;

  // CURVE SIMULATION (corner drag feel)
  let bend = Math.max(Math.min(velocity * 40, 180), -180);

  current.style.transform = `
    rotateY(${bend}deg)
    skewY(${bend/25}deg)
  `;
});

/* RELEASE = SNAP PHYSICS */
document.addEventListener("mouseup",(e)=>{
  if(!dragging || !current) return;

  let dx = e.clientX - startX;

  // NEXT PAGE
  if(dx < -100){
    current.style.transform = "rotateY(-180deg)";
    i++;
  }
  // BACK SNAP
  else if(dx > 100 && i > 0){
    i--;
    pages[i].style.transform = "rotateY(0deg)";
  }
  // RETURN
  else{
    current.style.transform = "rotateY(0deg)";
  }

  dragging = false;
  current = null;
});

/* TOUCH SUPPORT (iPad-like) */
document.addEventListener("touchstart",(e)=>{
  startX = e.touches[0].clientX;
  dragging = true;
  current = pages[i];
});

document.addEventListener("touchmove",(e)=>{
  if(!dragging || !current) return;

  let dx = e.touches[0].clientX - startX;

  let bend = dx * 0.02;

  current.style.transform = `
    rotateY(${bend}deg)
    skewY(${bend/30}deg)
  `;
});

document.addEventListener("touchend",(e)=>{
  dragging = false;

  if(!current) return;

  current.style.transform = "rotateY(0deg)";
  current = null;
});

</script>

</body>
</html>
