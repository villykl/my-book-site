<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Слова — это следы души</title>

<style>
body {
  margin: 0;
  background: radial-gradient(circle, #111, #000);
  font-family: Georgia, serif;
  color: #222;
  overflow: hidden;
}

/* КНИГА */
.book {
  width: 90%;
  max-width: 800px;
  height: 500px;
  margin: 50px auto;
  display: flex;
  perspective: 2000px;
}

/* СТРАНИЦЫ */
.page {
  width: 50%;
  height: 100%;
  background: #f4f1ea;
  padding: 30px;
  box-sizing: border-box;
  box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
  position: relative;
}

/* ЛЕВАЯ/ПРАВАЯ */
.left {
  border-right: 1px solid #ccc;
}

.right {
  border-left: 1px solid #ccc;
}

/* ОБЛОЖКА */
.cover {
  background: linear-gradient(145deg, #222, #000);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

/* КНОПКИ */
.controls {
  text-align: center;
  margin-top: 10px;
}

button {
  padding: 10px 20px;
  margin: 5px;
  border: none;
  background: #222;
  color: white;
  cursor: pointer;
  border-radius: 6px;
}

/* КРОССВОРД */
.cell {
  width: 40px;
  height: 40px;
  text-align: center;
  font-size: 20px;
  margin: 4px;
  border: 1px solid #999;
}
</style>
</head>

<body>

<div class="book">
  <div class="page left" id="leftPage"></div>
  <div class="page right" id="rightPage"></div>
</div>

<div class="controls">
  <button onclick="prevPage()">⬅ Назад</button>
  <button onclick="nextPage()">Вперёд ➡</button>
</div>

<audio id="flipSound" src="https://www.soundjay.com/page-flip-01a.mp3"></audio>

<script>
let pages = [

  "<div class='cover'><h1>Слова — это следы души</h1><br><p>Автор: Ты</p></div>",

  "<h2>Глава I — Стихи</h2><p>Тишина говорит со мной,<br>Словно ветер в пустом окне...<br><br>И я снова ищу покой,<br>Но он прячется где-то во мне.</p>",

  "<h2>Продолжение</h2><p>Слова — это тени мыслей...</p>",

  "<h2>Глава II — Рассказы</h2><p>Однажды ночью город молчал...</p>",

  "<h2>Глава III — Кроссворд</h2>\
   <input class='cell' maxlength='1'>\
   <input class='cell' maxlength='1'>\
   <input class='cell' maxlength='1'>\
   <br><br>\
   <button onclick='check(event)'>Проверить</button>\
   <p id='result'></p>"

];

let index = 0;

/* ЗАГРУЗКА */
window.onload = function() {
  let saved = localStorage.getItem("pageIndex");
  if (saved) index = parseInt(saved);
  render();
};

/* ОТОБРАЖЕНИЕ */
function render() {
  document.getElementById("leftPage").innerHTML = pages[index] || "";
  document.getElementById("rightPage").innerHTML = pages[index + 1] || "";
  localStorage.setItem("pageIndex", index);
}

/* ВПЕРЁД */
function nextPage() {
  if (index < pages.length - 2) {
    index += 2;
    render();
    sound();
  }
}

/* НАЗАД */
function prevPage() {
  if (index > 0) {
    index -= 2;
    render();
    sound();
  }
}

/* ЗВУК */
function sound() {
  let s = document.getElementById("flipSound");
  s.currentTime = 0;
  s.play();
}

/* КРОССВОРД */
function check(e) {
  e.stopPropagation();

  let letters = document.querySelectorAll('.cell');
  let word = "";

  letters.forEach(l => word += l.value.toLowerCase());

  document.getElementById("result").innerText =
    word === "мир" ? "Правильно ✅" : "Попробуй ещё ❌";
}
</script>

</body>
</html>
