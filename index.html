<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apple Books Reader</title>

<style>
body{
  margin:0;
  font-family: Georgia, serif;
  background:#0b0b0b;
  overflow:hidden;
}

/* ================= COVER ================= */
#cover{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background: radial-gradient(circle at center, #000, #120a06);
}

/* 📖 COVER */
.cover-book{
  width:340px;
  height:460px;

  background-image:url("cover.jpg");
  background-size:cover;
  background-position:center;

  border-radius:10px;

  box-shadow:0 70px 160px rgba(0,0,0,0.9);

  transform-origin:left;
  transition:1s cubic-bezier(.2,.8,.2,1);
}

.cover-open{
  transform: perspective(1200px) rotateY(-120deg) translateX(-80px);
  opacity:0;
}

/* ================= READER ================= */
#reader{
  display:none;
  height:100vh;
  align-items:center;
  justify-content:center;
  background: radial-gradient(circle at center, #1a1a1a, #000);
}

/* BOOK SHELL */
.book{
  width:820px;
  height:520px;
  position:relative;
  perspective:2000px;
}

/* SPINE */
.book::before{
  content:"";
  position:absolute;
  width:30px;
  height:100%;
  left:50%;
  transform:translateX(-50%);
  background:linear-gradient(#111,#000,#111);
}

/* PAGE */
.page{
  position:absolute;
  width:50%;
  height:100%;
  left:50%;
  transform-origin:left;

  background:linear-gradient(to right, #f7f2e6, #efe6d3);

  padding:40px;
  box-sizing:border-box;

  box-shadow:0 30px 80px rgba(0,0,0,0.5);

  transition:transform 0.6s cubic-bezier(.2,.8,.2,1);

  user-select:none;
}

/* STACK */
.page:nth-child(1){ z-index:3; }
.page:nth-child(2){ z-index:2; }
.page:nth-child(3){ z-index:1; }

/* flipped */
.page.flipped{
  transform:rotateY(-180deg);
}

/* ================= UI ================= */
.ui{
  position:fixed;
  right:20px;
  top:50%;
  transform:translateY(-50%);

  display:flex;
  flex-direction:column;
  gap:10px;
  z-index:999;
}

button{
  padding:10px 14px;
  border:none;
  border-radius:12px;
  cursor:pointer;

  background:rgba(255,255,255,0.92);
  font-weight:bold;
}

/* subtle fade UI */
.ui button{
  opacity:0.9;
}
.ui button:hover{
  opacity:1;
}
</style>
</head>

<body>

<!-- 📖 COVER -->
<div id="cover">
  <div class="cover-book" id="coverBook"></div>
</div>

<!-- 📚 READER -->
<div id="reader">

  <div class="book" id="book">

    <div class="page">📖 Глава 1 — начало истории</div>
    <div class="page">📖 Глава 2 — развитие</div>
    <div class="page">📖 Глава 3 — финал</div>

  </div>

</div>

<!-- UI -->
<div class="ui">
  <button onclick="openBook()">📖 Open</button>
  <button onclick="next()">➡ Next</button>
  <button onclick="back()">⬅ Back</button>
</div>

<script>

let pages = document.querySelectorAll(".page");
let i = 0;

/* OPEN */
function openBook(){
  document.getElementById("coverBook").classList.add("cover-open");

  setTimeout(()=>{
    document.getElementById("cover").style.display = "none";
    document.getElementById("reader").style.display = "flex";
  }, 900);
}

/* NEXT (SWIPE STYLE) */
function next(){
  if(i < pages.length){
    pages[i].style.transform = "rotateY(-180deg)";
    pages[i].classList.add("flipped");
    i++;
  }
}

/* BACK */
function back(){
  if(i > 0){
    i--;
    pages[i].classList.remove("flipped");
    pages[i].style.transform = "rotateY(0deg)";
  }
}

/* ================= TOUCH / DRAG SWIPE ================= */
let startX = 0;
let dragging = false;

document.addEventListener("mousedown",(e)=>{
  startX = e.clientX;
  dragging = true;
});

document.addEventListener("mouseup",(e)=>{
  if(!dragging) return;

  let diff = e.clientX - startX;

  if(diff < -80) next();
  if(diff > 80) back();

  dragging = false;
});

/* TOUCH (MOBILE) */
document.addEventListener("touchstart",(e)=>{
  startX = e.touches[0].clientX;
});

document.addEventListener("touchend",(e)=>{
  let endX = e.changedTouches[0].clientX;
  let diff = endX - startX;

  if(diff < -80) next();
  if(diff > 80) back();
});

</script>

</body>
</html>
