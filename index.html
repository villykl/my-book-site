<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Вера Климошенко — Автор</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin:0;
  font-family: Georgia, serif;
  background:#fdfbf7;
  color:#222;
}

.container {
  max-width:700px;
  margin:auto;
  padding:20px;
  text-align:center;
}

.cover {
  width:240px;
  margin:20px auto;
  border-radius:12px;
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

.author img {
  width:120px;
  border-radius:50%;
}

button {
  padding:12px;
  margin:10px;
  font-size:18px;
  border:none;
  border-radius:10px;
  background:black;
  color:white;
}

p {
  font-size:20px;
  line-height:1.8;
  text-align:justify;
  text-indent:2em;
}
</style>
</head>

<body>

<div class="container" id="app"></div>

<script>

/* 🔥 ВСТРОЕННАЯ ОБЛОЖКА */
const COVER = "data:image/png;base64,<?=BASE64?>";

/* текст */
let text = `
А ты пойдёшь с нами, Господи?

Этот день я вспоминаю всегда...

Мы шли по льду...

Мы успели. Слава Богу.
`;

function splitText(t){
  let words = t.split(" ");
  let pages=[],page="";
  words.forEach(w=>{
    page+=w+" ";
    if(page.length>900){
      pages.push("<p>"+page+"</p>");
      page="";
    }
  });
  if(page) pages.push("<p>"+page+"</p>");
  return pages;
}

let pages = splitText(text);

let state = { screen:"home", page:0 };

function showHome(){
  app.innerHTML = `
  <h1>Вера Климошенко</h1>

  <div class="author">
    <img src="https://i.postimg.cc/8z0t9b2T/author.jpg">
  </div>

  <h2>Слова — это следы души</h2>

  <img class="cover" src="${COVER}">

  <p style="opacity:0.8; max-width:500px; margin:auto;">
  Эта книга — живые истории о вере, надежде и Божьей помощи.
  </p>

  <button onclick="openBook()">📖 Читать</button>
  `;
}

function openBook(){
  state.screen="read";
  state.page=0;
  render();
}

function render(){
  if(state.screen==="home"){
    showHome();
    return;
  }

  let page = pages[state.page];

  app.innerHTML = page + `
  <p style="text-align:center; opacity:0.5;">
  ${state.page+1} / ${pages.length}
  </p>
  `;
}

function next(){
  if(state.page < pages.length-1){
    state.page++;
    render();
  }
}

function prev(){
  if(state.page>0){
    state.page--;
    render();
  } else {
    state.screen="home";
    showHome();
  }
}

window.onload = showHome;

</script>

</body>
</html>
