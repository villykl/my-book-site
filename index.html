<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clean Book</title>

<style>
body{
  margin:0;
  font-family: Georgia, serif;
  background:#111;
}

/* COVER */
#cover{
  position:fixed;
  inset:0;
  background:#3a2215;
  color:#f3e3d0;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
}

/* BOOK */
#book{
  display:none;
  padding:40px;
}

.page{
  background:#f6f1e3;
  margin:10px 0;
  padding:20px;
  border-radius:10px;
}
</style>
</head>

<body>

<!-- COVER -->
<div id="cover">
  <h1>Слова — следы души</h1>
  <button onclick="start()">Открыть книгу</button>
</div>

<!-- BOOK -->
<div id="book">
  <div class="page">Глава 1</div>
  <div class="page">Глава 2</div>
  <div class="page">Глава 3</div>
</div>

<script>

/* 🚪 START APP */
function start(){
  document.getElementById("cover").style.display = "none";
  document.getElementById("book").style.display = "block";
}

</script>

</body>
</html>
