<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kindle V4 Continuous</title>

<style>
body {
  margin: 0;
  font-family: Georgia, serif;
  background: #0e0e0e;
  color: #f5f1e8;
}

.container {
  display: flex;
  height: 100vh;
}

/* 📚 SIDEBAR */
.sidebar {
  width: 280px;
  background: #111;
  border-right: 1px solid #222;
  padding: 15px;
  overflow-y: auto;
}

.item {
  padding: 10px;
  margin-bottom: 6px;
  border-radius: 8px;
  cursor: pointer;
  opacity: 0.7;
}

.item:hover {
  background: #222;
}

.item.active {
  background: #2a241a;
  color: #c7a76c;
  opacity: 1;
}

/* 📖 READER */
.reader {
  flex: 1;
  padding: 40px;
  overflow-y: auto;
}

.page {
  max-width: 800px;
  margin: auto;
  background: #171717;
  padding: 60px;
  border-radius: 14px;
  box-shadow: 0 30px 100px rgba(0,0,0,0.5);
}

/* NAV */
.topbar {
  display: flex;
  justify-content: space-between;
  margin-bottom: 20px;
}

button {
  padding: 10px 14px;
  border: none;
  border-radius: 10px;
  background: #222;
  color: white;
  cursor: pointer;
}

/* PROGRESS */
.progress {
  height: 4px;
  background: #333;
  border-radius: 10px;
  overflow: hidden;
  margin-top: 15px;
}

.bar {
  height: 100%;
  width: 0%;
  background: #c7a76c;
  transition: 0.2s;
}
</style>
</head>

<body>

<div class="container">

  <div class="sidebar" id="sidebar"></div>

  <div class="reader">

    <div class="topbar">
      <button onclick="prev()">◀</button>
      <button onclick="next()">▶</button>
    </div>

    <div class="page" id="page"></div>

    <div class="progress">
      <div class="bar" id="bar"></div>
    </div>

  </div>

</div>

<script>

/* 📚 BOOK */
const book = {
  title: "Слова — это следы души",
  chapters: [
    "Вступление: Слова сопровождают нас всю жизнь...",
    "Глава I: Каждое слово — это след души...",
    "Глава II: Иногда слова становятся светом...",
    "Эпилог: Всё сказанное остаётся..."
  ]
};

let current = 0;

/* 💾 STORAGE KEY */
const KEY = "kindle_progress_v4";

/* 🔗 GET FROM URL */
function getFromURL() {
  const hash = location.hash.replace("#ch", "");
  const i = parseInt(hash);

  if (!isNaN(i) && i >= 0 && i < book.chapters.length) {
    return i;
  }

  return null;
}

/* 💾 SAVE */
function saveProgress() {
  localStorage.setItem(KEY, current);
}

/* 🔄 LOAD */
function loadProgress() {
  const url = getFromURL();
  if (url !== null) return url;

  const saved = localStorage.getItem(KEY);
  if (saved !== null) return parseInt(saved);

  return 0;
}

/* 🔗 UPDATE URL SAFELY */
function syncURL() {
  history.replaceState(null, "", "#ch" + current);
}

/* 📚 INIT SIDEBAR */
function init() {
  const sidebar = document.getElementById("sidebar");

  book.chapters.forEach((c, i) => {
    const div = document.createElement("div");
    div.className = "item";
    div.innerText = c.slice(0, 40);
    div.onclick = () => go(i);
    sidebar.appendChild(div);
  });
}

/* 📖 RENDER */
function render() {
  document.getElementById("page").innerHTML = `
    <h2>${book.title}</h2>
    <p>${book.chapters[current]}</p>
  `;

  updateSidebar();
  updateProgress();

  saveProgress();
  syncURL();
}

/* 🔥 ACTIVE */
function updateSidebar() {
  document.querySelectorAll(".item").forEach((el, i) => {
    el.classList.toggle("active", i === current);
  });
}

/* 📊 PROGRESS */
function updateProgress() {
  const percent = (current / (book.chapters.length - 1)) * 100;
  document.getElementById("bar").style.width = percent + "%";
}

/* ▶ NEXT */
function next() {
  if (current < book.chapters.length - 1) {
    current++;
    render();
  }
}

/* ◀ PREV */
function prev() {
  if (current > 0) {
    current--;
    render();
  }
}

/* 📌 GO */
function go(i) {
  current = i;
  render();
}

/* 🔁 BACK/FORWARD SUPPORT */
window.addEventListener("hashchange", () => {
  const fromURL = getFromURL();
  if (fromURL !== null) {
    current = fromURL;
    render();
  }
});

/* 🚀 START */
init();
current = loadProgress();
render();

</script>

</body>
</html>
