<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Вера Климошенко — Слова это следы души</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Georgia, serif;
  background: #0b0b0b;
  color: white;
}

/* ГЛАВНАЯ */
.hero {
  height: 100vh;
  background: radial-gradient(circle, #111, #000);
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.hero h1 {
  font-size: 42px;
}

.hero p {
  opacity: 0.7;
}

.btn {
  margin-top: 20px;
  padding: 12px 25px;
  border: 1px solid white;
  background: none;
  color: white;
  cursor: pointer;
}

/* КНИГА */
.book {
  background: #fdfbf7;
  color: black;
  padding: 30px;
  border-radius: 12px;
  max-width: 700px;
  margin: 40px auto;
  box-shadow: 0 20px 60px rgba(0,0,0,0.7);
}

.page {
  font-size: 18px;
  line-height: 1.8;
}

.controls {
  display: flex;
  justify-content: space-between;
  margin-top: 20px;
}

/* АВТОР */
.about {
  display: flex;
  flex-wrap: wrap;
  gap: 30px;
  align-items: center;
  max-width: 900px;
  margin: 60px auto;
  padding: 20px;
}

.about img {
  width: 260px;
  border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.6);
}

.about-text {
  max-width: 500px;
}

/* ФУТЕР */
.footer {
  text-align: center;
  padding: 20px;
  opacity: 0.6;
}
</style>
</head>

<body>

<!-- ГЛАВНАЯ -->
<div class="hero">
  <div>
    <h1>Вера Климошенко</h1>
    <p>Слова — это следы души</p>
    <button class="btn" onclick="scrollToBook()">Читать книгу</button>
  </div>
</div>

<!-- КНИГА -->
<div class="book" id="book">
  <div id="content" class="page"></div>

  <div class="controls">
    <button onclick="prev()">⬅️ Назад</button>
    <button onclick="next()">Вперёд ➡️</button>
  </div>
</div>

<!-- АВТОР -->
<div class="about">

<img src="photo.jpg">

<div class="about-text">
<h2>Об авторе</h2>
<p>
Вера Климошенко — автор произведений о вере, тишине и глубине души.
</p>
<p>
Её тексты — это отражение внутреннего мира,
переживаний и поиска света.
</p>
</div>

</div>

<div class="footer">
© Вера Климошенко
</div>

<script>

/* КНИГА (ВСЕ РАССКАЗЫ) */
let pages = [

`<h2>Слова — это следы души</h2>
<p style="text-align:center;">Вера Климошенко</p>`,

`<h3>А ты пойдёшь с нами, Господи?</h3>
<p>
Этот день я вспоминаю всегда, когда проезжаю по мосту.
Этот день навсегда остался в моей памяти.
</p>`,

`<p>
Прямого поезда на Брест не было.  
Поэтому нам нужно было торопиться.
</p>`,

`<p>
Оставив вещи, мы поспешили в город.  
Ранняя весна наполняла душу радостью.
</p>`,

`<p>
Но вот электричка...  
Господь идёт впереди нас.
</p>`,

`<p>
И вдруг — ошибка...  
Мы оказались не на том берегу.
</p>`,

`<p>
Господи, что делать?  
И вдруг мысль — идти по льду.
</p>`,

`<p>
Первый шаг был самым трудным.  
Сердце билось всё сильнее.
</p>`,

`<p>
Мы шли по льду...  
Каждый шаг был испытанием.
</p>`,

`<p>
И вот берег...  
Мы дошли.
</p>`,

`<p>
Но чудо только начиналось...  
Мы оказались в нужном доме.
</p>`,

`<p>
А затем бег к поезду...  
И последние секунды.
</p>`,

`<p>
Мы успели.  
Слава Богу.
</p>`,

`<p>
Этот день навсегда остался в моей душе —  
как свидетельство Божьей помощи.
</p>`

];

let current = 0;

function render(){
  document.getElementById("content").innerHTML = pages[current];
  localStorage.setItem("page", current);
}

function next(){
  if(current < pages.length-1){
    current++;
    render();
  }
}

function prev(){
  if(current > 0){
    current--;
    render();
  }
}

function scrollToBook(){
  document.getElementById("book").scrollIntoView({behavior:"smooth"});
}

window.onload = () => {
  current = parseInt(localStorage.getItem("page")) || 0;
  render();
};

</script>

</body>
</html>
