<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Слова — это следы души</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">

<style>
body {
  margin: 0;
  background: black;
  font-family: Georgia, serif;
  color: white;
  overflow: hidden;
}

.book {
  width: 320px;
  height: 450px;
  position: absolute;
  left: 50%;
  top: 45%;
  transform: translate(-50%, -50%);
  perspective: 3000px;
}

.page {
  width: 100%;
  height: 100%;
  position: absolute;
  background: #f4f1ea;
  transform-origin: left;
  transition: transform 0.8s ease;
  padding: 20px;
  color: #222;
}

.page.flipped {
  transform: rotateY(-180deg);
}

.cover {
  background: linear-gradient(145deg, #222, #000);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.nav {
  position: fixed;
  bottom: 0;
  width: 100%;
  display: flex;
  justify-content: space-around;
  background: rgba(0,0,0,0.9);
  padding: 10px 0;
}

.nav button {
  background: none;
  border: none;
  color: #aaa;
  font-size: 14px;
}

.cell {
  width: 35px;
  height: 35px;
}
</style>
</head>

<body>

<div class="book">

  <div class="page cover">
    <div>
      <h1>Слова — это следы души</h1>
      <p>Автор: Ты</p>
    </div>
  </div>

  <div class="page">
    <h2>Стихи</h2>
    <p>Тишина говорит со мной...</p>
  </div>

  <div class="page">
    <h2>Рассказы</h2>
    <p>Однажды ночью...</p>
  </div>

  <div class="page">
    <h2>Кроссворд</h2>
    <input class="cell" maxlength="1">
    <input class="cell" maxlength="1">
    <input class="cell" maxlength="1">
  </div>

</div>

<div class="nav">
  <button onclick="go(0)">📕</button>
  <button onclick="go(1)">✍️</button>
  <button onclick="go(2)">📖</button>
  <button onclick="go(3)">🧩</button>
</div>

<script>
let pages = document.querySelectorAll(".page");

function go(n) {
  pages.forEach(p => p.classList.remove("flipped"));
  for (let i = 0; i < n; i++) {
    pages[i].classList.add("flipped");
  }
  localStorage.setItem("page", n);
}

window.onload = () => {
  let saved = localStorage.getItem("page");
  if (saved) go(parseInt(saved));
};

/* PWA */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>

</body>
</html>
