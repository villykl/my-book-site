<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Слова — это следы души</title>

<style>
body {
    margin: 0;
    font-family: Georgia, serif;
    background: #1a1a1a;
}

/* ПРЕМИУМ ОБЛОЖКА */
.hero {
    height: 100vh;
    background:
        linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
        url('https://images.unsplash.com/photo-1524995997946-a1c2e315a42f') center/cover no-repeat;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #f5e6c8;
    text-align: center;
}

.hero h1 {
    font-size: 60px;
    letter-spacing: 3px;
    margin-bottom: 20px;
}

.hero p {
    font-size: 24px;
    opacity: 0.9;
}

/* КНОПКА */
.btn {
    margin-top: 40px;
    padding: 15px 30px;
    border: 1px solid #f5e6c8;
    color: #f5e6c8;
    text-decoration: none;
    font-size: 18px;
}

/* СТРАНИЦЫ КНИГИ */
.book {
    background: #f5f1e8;
    padding: 80px 20px;
}

.page {
    max-width: 700px;
    margin: auto;
    background: white;
    padding: 60px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

h2 {
    text-align: center;
}
</style>

</head>

<body>

<div class="hero">
    <h1>Слова — это следы души</h1>
    <p>Вера Климошенко</p>
    <a href="#book" class="btn">Читать книгу</a>
</div>

<div id="book" class="book">
    <div class="page">
        <h2>Вступление</h2>
        <p>Слова... Они сопровождают нас всю жизнь...</p>
    </div>
</div>

</body>
</html>
