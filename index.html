<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Слова — это следы души</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  background:#e8e4dc;
  font-family: Georgia, serif;
}

/* сцена */
.scene{
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

/* книга */
.book{
  width:800px;
  height:500px;
  display:flex;
  box-shadow:0 20px 60px rgba(0,0,0,0.3);
  border-radius:10px;
  overflow:hidden;
  background:#d6d1c7;
}

/* страницы */
.page{
  width:50%;
  padding:40px;
  background:#fdfbf7;
  overflow-y:auto;
  position:relative;
}

.left{
  border-right:1px solid #ddd;
  background:linear-gradient(to right,#f3f0ea,#fdfbf7);
}

.right{
  background:linear-gradient(to left,#f3f0ea,#fdfbf7);
}

/* текст */
h1{
  text-align:center;
}

h2{
  text-align:center;
  margin-top:0;
}

p{
  line-height:1.8;
  text-align:justify;
  white-space:pre-line;
}

.poem{
  text-align:center;
}

/* кнопки */
.controls{
  position:fixed;
  bottom:20px;
  width:100%;
  text-align:center;
}

button{
  padding:10px 20px;
  margin:5px;
  border:none;
  border-radius:6px;
  background:#222;
  color:white;
  cursor:pointer;
}

button:hover{
  background:#444;
}
</style>
</head>

<body>

<div class="scene">
  <div class="book">
    <div class="page left" id="left"></div>
    <div class="page right" id="right"></div>
  </div>
</div>

<div class="controls">
  <button onclick="prev()">← Назад</button>
  <button onclick="next()">Вперёд →</button>
</div>

<script>

let pages = [

`<h1>Слова — это следы души</h1>
<p style="text-align:center;">Вера Климошенко</p>`,

`<h2>Оглавление</h2>
<p style="text-align:center;">
📚 Рассказы<br><br>
✨ Стихи
</p>`,

`<h2>📚 Рассказы</h2>`,

`<h2>А ты пойдёшь с нами, Господи?</h2>
<p>
Вставь сюда полный текст рассказа...

С новой строки текст будет красиво разбит.
</p>`,

`<h2>✨ Стихи</h2>`,

`<h2>Гимн весны</h2>
<p class="poem">
Вставь сюда стих полностью...
</p>`

];

let index = 0;

function render(){
document.getElementById("left").innerHTML = pages[index] || "";
document.getElementById("right").innerHTML = pages[index+1] || "";
}

function next(){
if(index < pages.length-2){
index += 2;
render();
}
}

function prev(){
if(index > 0){
index -= 2;
render();
}
}

render();

</script>

</body>
</html>
