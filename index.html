<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Слова — это следы души</title>

<style>
:root {
  --bg: #0b0b0b;
  --panel: #111;
  --card: #171717;
  --text: #f5f1e8;
  --muted: rgba(245,241,232,0.6);
  --accent: #c7a76c;
}

body {
  margin: 0;
  font-family: Georgia, serif;
  background: var(--bg);
  color: var(--text);
}

/* 📚 LAYOUT */
.app {
  display: flex;
  height: 100vh;
}

/* 📑 SIDEBAR */
.sidebar {
  width: 280px;
  background: var(--panel);
  border-right: 1px solid #222;
  padding: 18px;
  overflow-y: auto;
}

.title {
  font-size: 16px;
  margin-bottom: 20px;
  color: var(--accent);
  letter-spacing: 1px;
}

.item {
  padding: 10px;
  margin-bottom: 8px;
  border-radius: 8px;
  cursor: pointer;
  color: var(--muted);
  transition: 0.2s;
}

.item:hover {
  background: #1c1c1c;
  color: var(--text);
}

.item.active {
  background: #222;
  color: var(--accent);
}

/* 📖 READER */
.reader {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 40px;
}

.page {
  width: 100%;
  max-width: 750px;
  background: var(--card);
  padding: 70px;
  border-radius: 16px;
  box-shadow: 0 40px 120px rgba(0,0,0,0.6);
  transition: opacity 0.25s ease;
}

h1 {
  font-size: 28px;
  margin-bottom: 30px;
  color: var(--accent);
}

p {
  line-height: 1.7;
  font-size: 18px;
  color: var(--text);
}

/* 📱 MOBILE */
@media (max-width: 800px) {
  .sidebar {
    display: none;
  }

  .page {
    padding: 40px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- 📑 SIDEBAR -->
  <div class="sidebar">
    <div class="title">ОГЛАВЛЕНИЕ</div>
    <div id="toc"></div>
  </div>

  <!-- 📖 READER -->
  <div class="reader">
    <div class="page" id="page"></div>
  </div>

</div>

<script>

/* 📚 BOOK DATA */
const book = {
  title: "Слова — это следы души",
  chapters: [
    {
      title: "Вступление",
      text: "Слова сопровождают нас всю жизнь. Они становятся отражением нашего внутреннего мира."
    },
    {
      title: "Глава I",
      text: "Каждое слово — это след души. Оно может ранить или исцелять."
    },
    {
      title: "Глава II",
      text: "Иногда слова становятся светом в темноте, направляя нас вперёд."
    },
    {
      title: "Эпилог",
      text: "Всё сказанное остаётся. В словах живёт память."
    }
  ]
};

let current = 0;

/* 📑 INIT TOC */
function initTOC() {
  const toc = document.getElementById("toc");

  book.chapters.forEach((c, i) => {
    const div = document.createElement("div");
    div.className = "item";
    div.innerText = c.title;
    div.onclick = () => go(i);
    toc.appendChild(div);
  });
}

/* 📖 RENDER */
function render() {
  const ch = book.chapters[current];

  document.getElementById("page").innerHTML = `
    <h1>${ch.title}</h1>
    <p>${ch.text}</p>
  `;

  updateTOC();
}

/* 🔥 ACTIVE STATE */
function updateTOC() {
  document.querySelectorAll(".item").forEach((el, i) => {
    el.classList.toggle("active", i === current);
  });
}

/* 📌 NAV */
function go(i) {
  current = i;
  render();
}

/* 🚀 INIT */
initTOC();
render();

</script>

</body>
</html>
