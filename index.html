<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Book Site</title>

<style>
body{
  margin:0;
  font-family: Georgia, serif;
  background:#0f0f12;
  color:#eee;
  overflow-x:hidden;
}

/* Layout */
.book-nav{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:60px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:20px;
  background:rgba(0,0,0,0.6);
  backdrop-filter: blur(10px);
  z-index:10;
}

.book-nav a{
  color:#aaa;
  text-decoration:none;
  font-size:14px;
  transition:0.3s;
}

.book-nav a:hover{
  color:#fff;
}

/* Chapters */
.chapter{
  position:absolute;
  top:60px;
  left:0;
  width:100%;
  min-height:calc(100vh - 60px);
  padding:60px 20px;
  box-sizing:border-box;

  opacity:0;
  transform: translateX(40px);
  transition: opacity 0.6s ease, transform 0.6s ease;
  pointer-events:none;
}

.chapter.active{
  opacity:1;
  transform: translateX(0);
  pointer-events:auto;
}

.chapter.exit-left{
  opacity:0;
  transform: translateX(-40px);
}

.chapter.exit-right{
  opacity:0;
  transform: translateX(40px);
}

h1{
  font-size:32px;
  margin-bottom:20px;
}

p{
  max-width:700px;
  line-height:1.6;
  font-size:18px;
}

</style>
</head>
<body>

<div class="book-nav">
  <a href="#ch0" onclick="goTo('ch0')">Chapter 1</a>
  <a href="#ch1" onclick="goTo('ch1')">Chapter 2</a>
  <a href="#ch2" onclick="goTo('ch2')">Chapter 3</a>
</div>

<!-- Chapters -->
<div id="ch0" class="chapter active">
  <h1>Chapter 1</h1>
  <p>Your text here... This is the first chapter of your book.</p>
</div>

<div id="ch1" class="chapter">
  <h1>Chapter 2</h1>
  <p>Your text here... This is the second chapter.</p>
</div>

<div id="ch2" class="chapter">
  <h1>Chapter 3</h1>
  <p>Your text here... This is the third chapter.</p>
</div>

<script>
let current = "ch0";

function goTo(id){
  if(id === current) return;

  const old = document.getElementById(current);
  const next = document.getElementById(id);

  // determine direction
  const ids = ["ch0","ch1","ch2"];
  const oldIndex = ids.indexOf(current);
  const newIndex = ids.indexOf(id);

  old.classList.remove("active");

  if(newIndex > oldIndex){
    old.classList.add("exit-left");
  } else {
    old.classList.add("exit-right");
  }

  setTimeout(() => {
    old.classList.remove("exit-left","exit-right");
  }, 600);

  next.classList.add("active");
  current = id;

  // update URL hash
  history.replaceState(null,null,"#"+id);
}

// load from hash
window.addEventListener("load",()=>{
  const hash = location.hash.replace("#","" );
  if(hash && document.getElementById(hash)){
    goTo(hash);
  }
});
</script>

</body>
</html>
