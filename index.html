<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Final Boss Cinema Book</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  overflow:hidden;
  background: radial-gradient(circle at center, #0a0a0a, #000);
}

/* CINEMA VIGNETTE */
body::after{
  content:"";
  position:fixed;
  inset:0;
  background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.7));
  pointer-events:none;
}

/* UI */
.ui{
  position:fixed;
  right:20px;
  top:50%;
  transform:translateY(-50%);
  display:flex;
  flex-direction:column;
  gap:10px;
  z-index:10;
}

button{
  padding:10px 14px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  background:rgba(255,255,255,0.9);
  font-weight:bold;
  box-shadow:0 10px 25px rgba(0,0,0,0.4);
}

canvas{
  display:block;
}
</style>

</head>
<body>

<div class="ui">
  <button onclick="openBook()">📖 Open</button>
  <button onclick="nextPage()">➡ Next</button>
  <button onclick="prevPage()">⬅ Back</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

let scene, camera, renderer;
let pages = [];
let current = 0;

let dragging = false;
let lastX = 0;
let velocity = 0;

/* ================= INIT CINEMA ================= */
init();
animate();

function init(){

  scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x000000, 2, 8);

  camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.set(0,0,5);

  renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  /* LIGHT CINEMA STYLE */
  const keyLight = new THREE.PointLight(0xffffff, 1.5);
  keyLight.position.set(2,2,3);

  const fillLight = new THREE.PointLight(0x88aaff, 0.5);
  fillLight.position.set(-3,1,2);

  const ambient = new THREE.AmbientLight(0x222222);

  scene.add(keyLight, fillLight, ambient);

  /* BOOK GEOMETRY */
  const geo = new THREE.PlaneGeometry(2.2, 3.2, 40, 40);

  const materials = [
    new THREE.MeshStandardMaterial({color:0xf5f1e6, side:THREE.DoubleSide}),
    new THREE.MeshStandardMaterial({color:0xf0e7d2, side:THREE.DoubleSide}),
    new THREE.MeshStandardMaterial({color:0xe9dec5, side:THREE.DoubleSide})
  ];

  for(let i=0;i<3;i++){

    let mesh = new THREE.Mesh(geo, materials[i]);

    mesh.position.z = -i * 0.03;

    scene.add(mesh);
    pages.push(mesh);
  }

  /* DRAG CONTROL */
  window.addEventListener("mousedown",(e)=>{
    dragging = true;
    lastX = e.clientX;
  });

  window.addEventListener("mouseup",()=>{
    dragging = false;

    if(velocity < -0.02) nextPage();
    if(velocity > 0.02) prevPage();

    velocity *= 0.5;
  });

  window.addEventListener("mousemove",(e)=>{
    if(!dragging) return;

    velocity = (e.clientX - lastX) * 0.003;
    lastX = e.clientX;

    applyCinemaCurl(velocity);
  });

  window.addEventListener("resize",onResize);
}

/* ================= CINEMA CURL ================= */
function applyCinemaCurl(v){

  let mesh = pages[current];
  let pos = mesh.geometry.attributes.position;

  for(let i=0;i<pos.count;i++){

    let x = pos.getX(i);
    let y = pos.getY(i);

    let wave =
      Math.sin(x * 2.5 + v * 2) *
      Math.cos(y * 2.5 + v * 2);

    pos.setZ(i, wave * Math.abs(v) * 0.8);
  }

  pos.needsUpdate = true;
}

/* ================= PAGE FLIP ================= */
function flip(mesh, dir){

  let a = 0;

  function step(){
    a += 0.08;

    mesh.rotation.y = dir * -a;

    mesh.position.z = Math.sin(a) * 0.1;

    if(a < Math.PI){
      requestAnimationFrame(step);
    }
  }

  step();
}

function nextPage(){
  if(current < pages.length-1){
    flip(pages[current], -1);
    current++;
  }
}

function prevPage(){
  if(current > 0){
    current--;
    flip(pages[current], 1);
  }
}

/* ================= OPEN CINEMA ================= */
function openBook(){

  camera.position.z = 4.5;

  let t = 0;

  function bloom(){
    t += 0.02;

    camera.position.y = Math.sin(t) * 0.1;

    if(t < 1){
      requestAnimationFrame(bloom);
    }
  }

  bloom();
}

/* ================= RENDER ================= */
function animate(){

  requestAnimationFrame(animate);

  renderer.render(scene,camera);
}

/* ================= RESIZE ================= */
function onResize(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

</script>

</body>
</html>
