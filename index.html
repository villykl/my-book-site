<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Слова — это следы души</title>

<style>
body {
    margin: 0;
    background: #f4f1ea;
    font-family: Georgia, "Times New Roman", serif;
    color: #2b2b2b;
}

/* ОБЛОЖКА КАК У КНИГИ */
.cover {
    height: 100vh;
    background: 
        linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
        url('images/cover.jpg') center/cover no-repeat;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
}

/* ЭФФЕКТ ГЛУБИНЫ */
.cover::after {
    content: "";
    position: absolute;
    inset: 0;
    box-shadow: inset 0 0 200px rgba(0,0,0,0.8);
}

/* БЛОК С ТЕКСТОМ */
.cover-content {
    position: relative;
    color: white;
    padding: 60px 40px;
}

/* НАЗВАНИЕ КНИГИ */
.cover h1 {
    font-size: 52px;
    letter-spacing: 3px;
    margin-bottom: 20px;
}

/* АВТОР */
.cover p {
    font-size: 22px;
    opacity: 0.9;
}

/* КНИГА */
.book {
    max-width: 800px;
    margin: 60px auto;
    background: white;
    padding: 80px 60px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
}

/* ГЛАВЫ */
.chapter {
    margin-top: 80px;
}

.chapter h2 {
    border-bottom: 1px solid #ddd;
    padding-bottom: 10px;
}

p {
    font-size: 18px;
    line-height: 1.8;
    text-align: justify;
}
</style>
</head>

<body>

<!-- ОБЛОЖКА -->
<div class="cover">
    <div class="cover-content">
        <h1>Слова — это следы души</h1>
        <p>Вера Климошенко</p>
    </div>
</div>

<!-- КНИГА -->
<div class="book">

<div class="chapter">
<h2>Глава 1</h2>
<p>Вставь сюда свой текст...</p>
</div>

<div class="chapter">
<h2>Глава 2</h2>
<p>Продолжение книги...</p>
</div>

</div>

</body>
</html>
