<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Слова — это следы души</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">

<style>
body {
  margin: 0;
  background: black;
  font-family: Georgia, serif;
  color: white;
}

.book {
  width: 320px;
  height: 450px;
  margin: 80px auto;
  perspective: 2000px;
}

.page {
  width: 100%;
  height: 100%;
  background: #f4f1ea;
  padding: 20px;
  color: #222;
}

.nav {
  position: fixed;
  bottom: 0;
  width: 100%;
  display: flex;
  justify-content: space-around;
  background: rgba(0,0,0,0.9);
  padding: 10px 0;
}

button {
  background: none;
  border: none;
  color: white;
}
</style>
</head>

<body>

<div class="book" id="content"></div>

<div class="nav">
  <button onclick="show(0)">📕</button>
  <button onclick="show(1)">✍️</button>
  <button onclick="show(2)">📖</button>
  <button onclick="show(3)">🧩</button>
</div>

<script>
let pages = [
  "<h1>Слова — это следы души</h1><p>Автор: Ты</p>",
  "<h2>Стихи</h2><p>Тишина говорит со мной...</p>",
  "<h2>Рассказы</h2><p>Однажды ночью...</p>",
  "<h2>Кроссворд</h2>"
];

function show(n) {
  document.getElementById("content").innerHTML = pages[n];
  localStorage.setItem("page", n);
}

window.onload = () => {
  let saved = localStorage.getItem("page") || 0;
  show(saved);
};

/* РЕГИСТРАЦИЯ SW */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js')
    .then(reg => console.log("SW OK"))
    .catch(err => console.log("SW error", err));
}
</script>

</body>
</html>
