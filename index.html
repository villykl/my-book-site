<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kindle V5 Ultra Pro Max</title>

<style>
body {
  margin: 0;
  font-family: Georgia, serif;
  background: #0e0e0e;
  color: #f5f1e8;
  overflow: hidden;
}

/* 🧠 APP LAYOUT */
.app {
  display: flex;
  height: 100vh;
}

/* 📚 SIDEBAR */
.sidebar {
  width: 260px;
  background: #111;
  border-right: 1px solid #222;
  padding: 15px;
  overflow-y: auto;
}

.item {
  padding: 10px;
  margin-bottom: 6px;
  border-radius: 8px;
  cursor: pointer;
  opacity: 0.7;
}

.item:hover {
  background: #222;
}

.item.active {
  background: #2a241a;
  color: #c7a76c;
  opacity: 1;
}

/* 📖 READER */
.reader {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  perspective: 2000px;
}

/* 📄 PAGE */
.page {
  width: 60%;
  height: 70%;
  background: #171717;
  padding: 60px;
  border-radius: 14px;
  box-shadow: 0 40px 120px rgba(0,0,0,0.6);
  transform-origin: center left;
  transition: transform 0.6s ease, opacity 0.6s ease;
}

/* 🔄 FLIP EFFECT */
.flip-next {
  transform: rotateY(-90deg);
  opacity: 0;
}

.flip-prev {
  transform: rotateY(90deg);
  opacity: 0;
}

/* 📊 NAV */
.nav {
  position: absolute;
  bottom: 25px;
  width: 100%;
  display: flex;
  justify-content: center;
  gap: 10px;
}

button {
  padding: 10px 14px;
  border: none;
  border-radius: 10px;
  background: #222;
  color: white;
  cursor: pointer;
}

/* 📱 MOBILE SWIPE AREA */
.reader {
  touch-action: pan-y;
}
</style>

</head>

<body>

<div class="app">

  <div class="sidebar" id="sidebar"></div>

  <div class="reader" id="reader">

    <div class="page" id="page"></div>

    <div class="nav">
      <button onclick="prev()">◀</button>
      <button onclick="next()">▶</button>
    </div>

  </div>

</div>

<script>

/* 📚 BOOK */
const book = {
  title: "Слова — это следы души",
  pages: [
    "Вступление: Слова сопровождают нас всю жизнь...",
    "Глава I: Каждое слово — это след души...",
    "Глава II: Иногда слова становятся светом...",
    "Эпилог: Всё сказанное остаётся..."
  ]
};

let current = 0;
let animating = false;

/* 💾 STORAGE */
const KEY = "kindle_v5_progress";

/* 🔗 URL SYNC */
function getFromURL() {
  const h = location.hash.replace("#ch", "");
  const i = parseInt(h);
  if (!isNaN(i)) return i;
  return null;
}

function setURL(i) {
  history.replaceState(null, "", "#ch" + i);
}

/* 💾 SAVE/LOAD */
function save() {
  localStorage.setItem(KEY, current);
}

function load() {
  const url = getFromURL();
  if (url !== null && url >= 0 && url < book.pages.length) return url;

  const saved = localStorage.getItem(KEY);
  return saved ? parseInt(saved) : 0;
}

/* 📚 SIDEBAR */
function initSidebar() {
  const s = document.getElementById("sidebar");

  book.pages.forEach((p, i) => {
    const d = document.createElement("div");
    d.className = "item";
    d.innerText = p.slice(0, 40);
    d.onclick = () => go(i);
    s.appendChild(d);
  });
}

/* 📖 RENDER */
function render() {
  document.getElementById("page").innerHTML = `
    <h2>${book.title}</h2>
    <p>${book.pages[current]}</p>
  `;

  updateSidebar();
  save();
  setURL(current);
}

/* 🔥 FLIP ENGINE */
function flip(dir, cb) {
  if (animating) return;
  animating = true;

  const page = document.getElementById("page");

  page.classList.add(dir === "next" ? "flip-next" : "flip-prev");

  setTimeout(() => {
    page.classList.remove("flip-next", "flip-prev");
    cb();
    render();
    animating = false;
  }, 300);
}

/* ▶ NEXT */
function next() {
  if (current < book.pages.length - 1) {
    flip("next", () => current++);
  }
}

/* ◀ PREV */
function prev() {
  if (current > 0) {
    flip("prev", () => current--);
  }
}

/* 📌 GO */
function go(i) {
  if (i === current) return;
  flip(i > current ? "next" : "prev", () => current = i);
}

/* 📊 SIDEBAR STATE */
function updateSidebar() {
  document.querySelectorAll(".item").forEach((el, i) => {
    el.classList.toggle("active", i === current);
  });
}

/* ⌨️ KEYBOARD */
window.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") next();
  if (e.key === "ArrowLeft") prev();
});

/* 📱 SWIPE */
let startX = 0;

document.getElementById("reader").addEventListener("touchstart", e => {
  startX = e.touches[0].clientX;
});

document.getElementById("reader").addEventListener("touchend", e => {
  let dx = e.changedTouches[0].clientX - startX;

  if (dx > 50) prev();
  if (dx < -50) next();
});

/* 🚀 INIT */
initSidebar();
current = load();
render();

</script>

</body>
</html>
