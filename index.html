<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultra Apple Cover</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background: radial-gradient(circle at center, #1a1a1a, #000);
  overflow:hidden;
}

/* 📖 COVER */
.cover{
  width:340px;
  height:460px;
  position:relative;

  background-image:url("cover.jpg");
  background-size:cover;
  background-position:center;

  border-radius:16px;

  /* 🍎 Apple depth shadow */
  box-shadow:
    0 60px 120px rgba(0,0,0,0.65),
    0 15px 40px rgba(0,0,0,0.4);

  transform-style:preserve-3d;
  transition:transform 0.2s ease;

  overflow:hidden;
}

/* ✨ LIGHT REFLECTION (Apple-style gloss) */
.cover::before{
  content:"";
  position:absolute;
  inset:-40%;
  background: radial-gradient(
    circle at var(--x,50%) var(--y,50%),
    rgba(255,255,255,0.25),
    transparent 40%
  );

  transform:rotate(10deg);
  pointer-events:none;
}

/* 🌌 EDGE LIGHT (leather feel) */
.cover::after{
  content:"";
  position:absolute;
  inset:0;
  background: linear-gradient(
    120deg,
    rgba(0,0,0,0.2),
    transparent 40%,
    rgba(0,0,0,0.3)
  );
  pointer-events:none;
}

/* OPEN EFFECT */
.cover.open{
  transform: rotateY(-120deg) translateX(-80px);
  opacity:0;
}
</style>
</head>

<body>

<div class="cover" id="cover"></div>

<script>
const cover = document.getElementById("cover");

/* 📱 OPEN */
cover.onclick = () => {
  cover.classList.add("open");
};

/* 🌌 APPLE PARALLAX LIGHT */
document.addEventListener("mousemove",(e)=>{

  const x = (e.clientX / window.innerWidth) * 100;
  const y = (e.clientY / window.innerHeight) * 100;

  cover.style.setProperty("--x", x + "%");
  cover.style.setProperty("--y", y + "%");

  /* subtle 3D tilt */
  const rotateY = (x - 50) * 0.08;
  const rotateX = (y - 50) * -0.05;

  cover.style.transform = `
    rotateY(${rotateY}deg)
    rotateX(${rotateX}deg)
  `;
});
</script>

</body>
</html>
