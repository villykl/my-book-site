<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Вера Климошенко — Автор</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin:0;
  font-family: Georgia, serif;
  background:#fdfbf7;
  color:#222;
}

.dark {
  background:#111;
  color:#eee;
}

/* контейнер */
.container {
  max-width:700px;
  margin:auto;
  padding:20px;
}

/* главная */
.hero {
  text-align:center;
  padding:40px 20px;
}

.hero img {
  width:140px;
  border-radius:50%;
  margin-top:20px;
}

/* книга */
.book-cover {
  width:200px;
  display:block;
  margin:20px auto;
}

/* текст */
p {
  font-size:20px;
  line-height:1.8;
  text-align:justify;
  text-indent:2em;
}

/* кнопки */
button {
  padding:12px;
  margin:10px 0;
  width:100%;
  font-size:18px;
}

/* панель */
.controls {
  position:fixed;
  bottom:10px;
  width:100%;
  display:flex;
  justify-content:space-around;
}

.controls button {
  width:auto;
}

/* прогресс */
.progress {
  position:fixed;
  top:0;
  left:0;
  height:4px;
  background:black;
  width:0%;
}

.dark .progress {
  background:white;
}
</style>
</head>

<body>

<div class="progress" id="progress"></div>
<div class="container" id="app"></div>

<div class="controls">
  <button onclick="prev()">⬅️</button>
  <button onclick="toggleTheme()">🌙</button>
  <button onclick="downloadPDF()">📄</button>
  <button onclick="next()">➡️</button>
</div>

<script>

/* состояние */
let state = {
  screen: "home",
  book: 0,
  page: 0
};

/* текст книги */
let text = `
А ты пойдёшь с нами, Господи?

Этот день я вспоминаю всегда, когда проезжаю по мосту.
Этот день навсегда остался в моей памяти.

Прямого поезда не было.
Поэтому нам нужно было торопиться.

Оставив вещи, мы поспешили в город.

И вдруг — ошибка...
Мы оказались не на том берегу.

Господи, что делать?

Мы шли по льду...

Мы успели. Слава Богу.
`;

/* авто страницы */
function splitText(t){
  let words = t.split(" ");
  let pages=[],page="";
  words.forEach(w=>{
    page+=w+" ";
    if(page.length>900){
      pages.push("<p>"+page+"</p>");
      page="";
    }
  });
  if(page) pages.push("<p>"+page+"</p>");
  return pages;
}

let pages = splitText(text);

/* ЭКРАНЫ */

function showHome(){
  app.innerHTML = `
  <div class="hero">
    <h1>Вера Климошенко</h1>
    <p style="opacity:0.7;">Автор книги</p>

    <img src="https://i.postimg.cc/8z0t9b2T/author.jpg">

    <h2 style="margin-top:30px;">Слова — это следы души</h2>

    <p style="opacity:0.8; max-width:500px; margin:auto;">
    Эта книга — живые истории о вере, надежде и Божьей помощи.
    </p>

    <button onclick="openBook()">📖 Читать</button>
    <button onclick="showBuy()">💰 Купить</button>
  </div>
  `;
}

function openBook(){
  state.screen="read";
  state.page=0;
  render();
}

function showBuy(){
  app.innerHTML = `
  <h1>Купить книгу</h1>

  <img class="book-cover" src="https://i.postimg.cc/8z0t9b2T/author.jpg">

  <p style="text-align:center;">
  Книга доступна в электронном формате (PDF)
  </p>

  <button onclick="downloadPDF()">📄 Скачать PDF</button>
  <button onclick="showHome()">⬅️ Назад</button>
  `;
}

function render(){

  if(state.screen==="home") return showHome();

  let page = pages[state.page];

  app.innerHTML = page + `
  <p style="text-align:center; opacity:0.5;">
  ${state.page+1} / ${pages.length}
  </p>
  `;

  let percent = (state.page+1)/pages.length*100;
  progress.style.width = percent+"%";
}

/* навигация */
function next(){
  if(state.screen!=="read") return;
  if(state.page < pages.length-1){
    state.page++;
    render();
  }
}

function prev(){
  if(state.screen==="read"){
    if(state.page>0){
      state.page--;
    } else {
      state.screen="home";
      showHome();
    }
  }
}

/* PDF */
function downloadPDF(){
  window.print();
}

/* тема */
function toggleTheme(){
  document.body.classList.toggle("dark");
}

/* старт */
window.onload = showHome;

</script>

</body>
</html>
