<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Слова — это следы души</title>

<style>
body {
  margin: 0;
  background: radial-gradient(circle at top, #1a1a1a, #000);
  font-family: Georgia, serif;
  color: #f5f5f5;
}

/* МЕНЮ */
.menu {
  position: fixed;
  top: 20px;
  width: 100%;
  text-align: center;
}

.menu button {
  margin: 5px;
  padding: 10px 18px;
  background: rgba(20,20,20,0.8);
  border: 1px solid #444;
  color: #ddd;
  cursor: pointer;
  border-radius: 8px;
  transition: 0.3s;
}

.menu button:hover {
  background: #333;
  color: white;
}

/* КОНТЕЙНЕР */
.book {
  width: 90%;
  max-width: 700px;
  margin: 120px auto;
}

/* СТРАНИЦЫ */
.page {
  display: none;
  padding: 30px;
  background: linear-gradient(145deg, #1c1c1c, #111);
  margin-bottom: 25px;
  border-radius: 15px;
  box-shadow: 0 0 30px rgba(0,0,0,0.7);
  animation: fadeIn 0.6s ease;
}

.page.active {
  display: block;
}

.page:hover {
  transform: scale(1.02);
  transition: 0.3s;
}

/* ЗАГОЛОВКИ */
h1 {
  font-size: 32px;
  text-align: center;
}

h2 {
  font-size: 24px;
}

/* ТЕКСТ */
p {
  line-height: 1.6;
  color: #ccc;
}

/* АНИМАЦИЯ */
@keyframes fadeIn {
  from {opacity: 0; transform: translateY(15px);}
  to {opacity: 1; transform: translateY(0);}
}

/* КРОССВОРД */
.cell {
  width: 42px;
  height: 42px;
  text-align: center;
  font-size: 20px;
  margin: 5px;
  background: #222;
  border: 1px solid #555;
  color: white;
  border-radius: 5px;
}
</style>
</head>

<body>

<div class="menu">
  <button onclick="showPage(1)">Обложка</button>
  <button onclick="showPage(2)">Стихи</button>
  <button onclick="showPage(3)">Рассказы</button>
  <button onclick="showPage(4)">Кроссворд</button>
</div>

<div class="book">

  <div class="page active" id="p1">
    <h1>Слова — это следы души</h1>
    <p style="text-align:center; opacity:0.6;">Автор: Ты</p>
  </div>

  <div class="page" id="p2">
    <h2>Глава I — Стихи</h2>
    <p>
    Тишина говорит со мной,<br>
    Словно ветер в пустом окне...<br><br>
    И я снова ищу покой,<br>
    Но он прячется где-то во мне.
    </p>
  </div>

  <div class="page" id="p3">
    <h2>Глава II — Рассказы</h2>
    <p>Однажды ночью город молчал...</p>
  </div>

  <div class="page" id="p4">
    <h2>Глава III — Кроссворд</h2>

    <input maxlength="1" class="cell">
    <input maxlength="1" class="cell">
    <input maxlength="1" class="cell">

    <br><br>

    <button onclick="check()">Проверить</button>
    <p id="result"></p>
  </div>

</div>

<script>
function showPage(n) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('p' + n).classList.add('active');
}

function check() {
  let letters = document.querySelectorAll('.cell');
  let word = "";

  letters.forEach(l => word += l.value.toLowerCase());

  if (word === "мир") {
    document.getElementById("result").innerText = "Правильно ✅";
  } else {
    document.getElementById("result").innerText = "Попробуй ещё ❌";
  }
}
</script>

</body>
</html>
