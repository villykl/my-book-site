<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Book</title>

<style>
body{
  margin:0;
  font-family: Georgia, serif;
  background:#0b0b0b;
  overflow:hidden;
}

/* ===== COVER SCREEN ===== */
.cover-screen{
  position:fixed;
  inset:0;
  background:
    linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.9)),
    url('https://www.transparenttextures.com/patterns/dark-leather.png');
  background-color:#3a2215;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  color:#f3e3d0;
  text-align:center;
  z-index:100;
  transition: opacity 1s ease, transform 1s ease;
}

.cover-screen h1{
  font-size:42px;
  margin:0;
  letter-spacing:1px;
}

.cover-screen p{
  margin-top:10px;
  opacity:0.8;
}

.cover-screen button{
  margin-top:25px;
  padding:12px 18px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

/* hide cover */
.cover-screen.hide{
  opacity:0;
  transform: scale(1.1);
  pointer-events:none;
}

/* ===== BOOK ===== */
.stage{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  perspective:2500px;
}

.book{
  width:800px;
  height:500px;
  position:relative;
  transform-style:preserve-3d;
  transform: rotateX(6deg);
}

/* spine */
.book::before{
  content:"";
  position:absolute;
  width:28px;
  height:100%;
  left:50%;
  transform:translateX(-50%);
  background:linear-gradient(#111,#000,#111);
}

/* pages */
.page{
  position:absolute;
  width:50%;
  height:100%;
  left:50%;
  transform-origin:left;
  background:#f6f1e3;
  box-shadow:0 30px 80px rgba(0,0,0,0.6);
  padding:45px;
  box-sizing:border-box;
  transition:transform 1s ease;
}

.page:nth-child(1){ z-index:5; }
.page:nth-child(2){ z-index:4; }
.page:nth-child(3){ z-index:3; }

.page.flipped{
  transform: rotateY(-180deg);
}

.page::after{
  content:"";
  position:absolute;
  top:0;
  right:0;
  width:30px;
  height:100%;
  background:linear-gradient(to left, rgba(0,0,0,0.15), transparent);
}

/* UI */
.ui{
  position:fixed;
  bottom:20px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:10px;
  z-index:10;
}

button{
  padding:10px 14px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:white;
  font-weight:bold;
}
</style>
</head>

<body>

<!-- 📖 COVER -->
<div class="cover-screen" id="cover">
  <h1>Слова — следы души</h1>
  <p>Цифровая кожаная книга</p>
  <button onclick="openBook()">Открыть книгу</button>
</div>

<!-- 📚 BOOK -->
<div class="stage">

  <div class="book" id="book">

    <div class="page">
      <h1>Глава 1</h1>
      <p>Это твоя книга. Теперь она начинается только после обложки.</p>
    </div>

    <div class="page">
      <h1>Глава 2</h1>
      <p>Перелистывание страниц имитирует настоящую бумажную книгу.</p>
    </div>

    <div class="page">
      <h1>Глава 3</h1>
      <p>Ты можешь вставить сюда свои рассказы или стихи.</p>
    </div>

  </div>
</div>

<!-- UI -->
<div class="ui">
  <button onclick="flip()">➡ Перелистнуть</button>
  <button onclick="resetBook()">🔄 Сброс</button>
</div>

<script>

const cover = document.getElementById("cover");
const pages = document.querySelectorAll(".page");
let i = 0;

/* OPEN BOOK */
function openBook(){
  cover.classList.add("hide");
}

/* FLIP */
function flip(){
  if(i < pages.length){
    pages[i].classList.add("flipped");
    i++;
  }
}

/* RESET */
function resetBook(){
  pages.forEach(p=>p.classList.remove("flipped"));
  i = 0;
}

/* KEYBOARD */
document.addEventListener("keydown",(e)=>{
  if(e.key==="ArrowRight") flip();
  if(e.key==="ArrowLeft") resetBook();
});

</script>

</body>
</html>
