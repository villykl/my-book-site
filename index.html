<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Слова — это следы души</title>

<script src="https://unpkg.com/page-flip/dist/js/page-flip.browser.min.js"></script>

<style>
body {
    margin: 0;
    background: #000;
    overflow: hidden;
    font-family: Georgia, serif;
}

/* ===== LOADING SCREEN (APP FEEL) ===== */
#loader {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, #1a1a1a, #000);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    color: #f5e7d3;
    transition: 1s;
    z-index: 999;
}

#loader h1 {
    font-size: 28px;
    letter-spacing: 2px;
    opacity: 0.9;
}

/* исчезает как приложение */
.loaded #loader {
    opacity: 0;
    pointer-events: none;
}

/* ===== BOOK CONTAINER ===== */
#book {
    width: 980px;
    height: 640px;
    margin: auto;
    transform: scale(0.95);
    opacity: 0;
    transition: 1.2s;
}

.loaded #book {
    opacity: 1;
    transform: scale(1);
}

/* ===== PAGES ===== */
.page {
    background: #fffdf7;
    padding: 60px;
    box-sizing: border-box;
    font-size: 20px;
    line-height: 1.7;
}

/* ===== COVER ===== */
.cover {
    background:
        linear-gradient(rgba(0,0,0,0.25), rgba(0,0,0,0.85)),
        url('https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?auto=format&fit=crop&w=1400&q=80')
        center/cover no-repeat;

    color: #f5e7d3;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.cover h1 {
    font-size: 46px;
    margin: 0;
}

.cover p {
    opacity: 0.85;
}

/* subtle paper */
.page::after {
    content: "";
    position: absolute;
    inset: 0;
    box-shadow: inset 0 0 40px rgba(0,0,0,0.05);
    pointer-events: none;
}
</style>
</head>

<body>

<!-- APP LOADING -->
<div id="loader">
    <h1>Слова — это следы души</h1>
    <p>opening book…</p>
</div>

<!-- BOOK -->
<div id="book">

    <div class="page cover">
        <h1>Слова — это следы души</h1>
        <p>Вера Климошенко</p>
        <p style="margin-top:20px;">tap to open</p>
    </div>

    <div class="page">
        <h2 style="text-align:center;">Вступление</h2>
        <p>Слова сопровождают нас всю жизнь...</p>
    </div>

    <div class="page">
        <h2 style="text-align:center;">Глава I</h2>
        <p>Каждое слово — это след души...</p>
    </div>

    <div class="page">
        <h2 style="text-align:center;">Глава II</h2>
        <p>Иногда слова становятся светом...</p>
    </div>

    <div class="page">
        <h2 style="text-align:center;">Эпилог</h2>
        <p>Всё сказанное остаётся...</p>
    </div>

</div>

<script>
setTimeout(() => {
    document.body.classList.add("loaded");
}, 1200);

const book = new St.PageFlip(document.getElementById("book"), {

    width: 490,
    height: 640,

    size: "stretch",

    showCover: true,
    maxShadowOpacity: 0.7,

    flippingTime: 1000,   // iPad-like smoothness
    useMouseEvents: true,
    swipeDistance: 20,
    drawShadow: true,
    mobileScrollSupport: true
});

book.loadFromHTML(document.querySelectorAll(".page"));
</script>

</body>
</html>
