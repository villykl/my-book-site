<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Слова — это следы души</title>

<style>
body {
  margin: 0;
  background: radial-gradient(circle at center, #111, #000);
  font-family: Georgia, serif;
  overflow: hidden;
}

/* КНИГА */
.book {
  width: 320px;
  height: 450px;
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  perspective: 3000px;
}

/* СТРАНИЦЫ */
.page {
  width: 100%;
  height: 100%;
  position: absolute;
  background: #f4f1ea;
  transform-origin: left;
  transition: transform 0.8s ease;
  box-shadow: 0 0 20px rgba(0,0,0,0.5);
  padding: 20px;
  box-sizing: border-box;
}

/* ОБРАТНАЯ СТОРОНА */
.page::after {
  content: "";
  position: absolute;
  inset: 0;
  background: #eae6dc;
  transform: rotateY(180deg);
  backface-visibility: hidden;
}

/* ПЕРЕВОРОТ */
.page.flipped {
  transform: rotateY(-180deg);
}

/* ТЕКСТ */
h1 { text-align: center; }
h2 { margin-bottom: 10px; }

/* ОБЛОЖКА */
.cover {
  background: linear-gradient(145deg, #222, #000);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

/* КЛИК-ЗОНЫ */
.zone {
  position: absolute;
  top: 0;
  width: 50%;
  height: 100%;
  z-index: 999;
}

.leftZone { left: 0; }
.rightZone { right: 0; }

/* КРОССВОРД */
.cell {
  width: 40px;
  height: 40px;
  margin: 4px;
  text-align: center;
  font-size: 20px;
}
</style>
</head>

<body>

<div class="book" id="book">

  <div class="page cover">  
    <div>
      <h1>Слова — это следы души</h1>
      <p>Автор: Ты</p>
    </div>
  </div>

  <div class="page">
    <h2>Глава I — Стихи</h2>
    <p>
    Тишина говорит со мной,<br>
    Словно ветер в пустом окне...<br><br>
    И я снова ищу покой,<br>
    Но он прячется где-то во мне.
    </p>
  </div>

  <div class="page">
    <h2>Глава II — Рассказы</h2>
    <p>Однажды ночью город молчал...</p>
  </div>

  <div class="page">
    <h2>Глава III — Кроссворд</h2>
    <input class="cell" maxlength="1">
    <input class="cell" maxlength="1">
    <input class="cell" maxlength="1">
    <br><br>
    <button onclick="check(event)">Проверить</button>
    <p id="result"></p>
  </div>

</div>

<!-- КЛИК ЗОНЫ -->
<div class="zone leftZone" onclick="prev()"></div>
<div class="zone rightZone" onclick="next()"></div>

<audio id="flipSound" src="https://www.soundjay.com/page-flip-01a.mp3"></audio>

<script>
let pages = document.querySelectorAll(".page");
let current = 0;

/* ВПЕРЁД */
function next() {
  if (current < pages.length) {
    pages[current].classList.add("flipped");
    current++;
    sound();
    save();
  }
}

/* НАЗАД */
function prev() {
  if (current > 0) {
    current--;
    pages[current].classList.remove("flipped");
    sound();
    save();
  }
}

/* ЗВУК */
function sound() {
  let s = document.getElementById("flipSound");
  s.currentTime = 0;
  s.play();
}

/* СОХРАНЕНИЕ */
function save() {
  localStorage.setItem("bookPage", current);
}

/* ЗАГРУЗКА */
window.onload = () => {
  let saved = localStorage.getItem("bookPage");
  if (saved) {
    current = parseInt(saved);
    for (let i = 0; i < current; i++) {
      pages[i].classList.add("flipped");
    }
  }
};

/* КРОССВОРД */
function check(e) {
  e.stopPropagation();
  let letters = document.querySelectorAll('.cell');
  let word = "";
  letters.forEach(l => word += l.value.toLowerCase());
  document.getElementById("result").innerText =
    word === "мир" ? "Правильно ✅" : "Попробуй ещё ❌";
}
</script>

</body>
</html>
