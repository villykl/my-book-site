<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Вера Климошенко — Книги</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin:0;
  font-family: Georgia, serif;
  background:#fdfbf7;
  color:#222;
}

/* ТЕМНАЯ ТЕМА */
.dark {
  background:#111;
  color:#eee;
}

/* КОНТЕЙНЕР */
.container {
  max-width:700px;
  margin:auto;
  padding:20px;
}

/* ОГЛАВЛЕНИЕ */
.menu button {
  display:block;
  width:100%;
  margin:10px 0;
  padding:12px;
  font-size:18px;
}

/* КНОПКИ */
.controls {
  position:fixed;
  bottom:10px;
  width:100%;
  display:flex;
  justify-content:space-around;
}

button {
  padding:10px;
}

/* ТЕКСТ */
p {
  font-size:20px;
  line-height:1.8;
}

/* АВТОР */
.author {
  text-align:center;
  margin-top:40px;
}

.author img {
  width:150px;
  border-radius:50%;
}
</style>
</head>

<body>

<div class="container" id="app"></div>

<div class="controls">
  <button onclick="prev()">⬅️</button>
  <button onclick="toggleTheme()">🌙</button>
  <button onclick="next()">➡️</button>
</div>

<script>

/* СОСТОЯНИЕ */
let state = {
  book: localStorage.getItem("book") || "menu",
  page: parseInt(localStorage.getItem("page")) || 0
};

/* КНИГА 1 */
let book1 = [
`<h1>Слова — это следы души</h1><p style="text-align:center;">Вера Климошенко</p>`,
`<h2>А ты пойдёшь с нами, Господи?</h2><p>Этот день я вспоминаю всегда...</p>`,
`<p>Прямого поезда не было...</p>`,
`<p>Мы шли по льду...</p>`,
`<p>Мы успели. Слава Богу.</p>`
];

/* КНИГА 2 */
let book2 = [
`<h1>Вторая книга</h1><p style="text-align:center;">Вера Климошенко</p>`,
`<h2>Новый рассказ</h2><p>Здесь будет твой второй текст...</p>`,
`<p>Добавь сюда свои рассказы</p>`
];

/* ОГЛАВЛЕНИЕ */
function menu(){
  app.innerHTML = `
  <h1>📚 Книги</h1>

  <div class="menu">
    <button onclick="openBook(1)">📖 Слова — это следы души</button>
    <button onclick="openBook(2)">📘 Вторая книга</button>
  </div>

  <div class="author">
    <h3>Вера Климошенко</h3>
    <img src="https://i.postimg.cc/8z0t9b2T/author.jpg">
  </div>
  `;
}

/* ОТКРЫТЬ КНИГУ */
function openBook(n){
  state.book = n;
  state.page = 0;
  save();
  render();
}

/* РЕНДЕР */
function render(){

  if(state.book === "menu"){
    menu();
    return;
  }

  let book = state.book == 1 ? book1 : book2;

  app.innerHTML = book[state.page];
}

/* НАВИГАЦИЯ */
function next(){
  if(state.book === "menu") return;

  let book = state.book == 1 ? book1 : book2;

  if(state.page < book.length-1){
    state.page++;
    save();
    render();
  }
}

function prev(){
  if(state.book === "menu") return;

  if(state.page > 0){
    state.page--;
  } else {
    state.book = "menu";
  }

  save();
  render();
}

/* СОХРАНЕНИЕ */
function save(){
  localStorage.setItem("book", state.book);
  localStorage.setItem("page", state.page);
}

/* ТЕМА */
function toggleTheme(){
  document.body.classList.toggle("dark");
}

/* СТАРТ */
window.onload = render;

</script>

</body>
</html>
