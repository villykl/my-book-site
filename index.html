<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Вера Климошенко — Слова это следы души</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  background: radial-gradient(circle, #0a0a0a, #000);
  font-family: Georgia, serif;
  overflow: hidden;
}

/* СЦЕНА */
.scene {
  width: 100%;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* КНИГА */
.book {
  width: 320px;
  height: 420px;
  position: relative;
  perspective: 2000px;
}

/* СТРАНИЦЫ */
.page {
  width: 100%;
  height: 100%;
  position: absolute;
  background: #f4f1ea;
  transform-origin: left;
  border-radius: 5px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.5);
  padding: 20px;
  box-sizing: border-box;
  transition: transform 0.3s;
}

/* ОБЛОЖКА */
.cover {
  background: linear-gradient(145deg, #1a1a1a, #000);
  color: white;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  cursor: pointer;
}

.poem {
  font-style: italic;
  line-height: 1.7;
}
</style>
</head>

<body>

<div class="scene">
  <div class="book" id="book">

    <div class="page cover">
      <div>
        <h2>Слова — это следы души</h2>
        <p>Вера Климошенко</p>
        <small>Потяни страницу →</small>
      </div>
    </div>

    <div class="page">
      <h3>Добро пожаловать</h3>
      <p>Это книга чувств и мыслей.</p>
    </div>

    <div class="page">
      <h3>Стихи</h3>
      <div class="poem">
      Тишина говорит со мной,<br>
      Словно ветер в пустом окне...
      </div>
    </div>

    <div class="page">
      <h3>Рассказы</h3>
      <p>Однажды ночью город молчал...</p>
    </div>

  </div>
</div>

<audio id="sound" src="https://www.soundjay.com/page-flip-01a.mp3"></audio>

<script>
let pages = document.querySelectorAll(".page");
let current = 0;

let dragging = false;
let startX = 0;

/* НАЧАЛО ТЯГАНИЯ */
document.addEventListener("mousedown", startDrag);
document.addEventListener("touchstart", startDrag);

function startDrag(e) {
  if (current >= pages.length) return;

  dragging = true;
  startX = e.touches ? e.touches[0].clientX : e.clientX;
}

/* ДВИЖЕНИЕ */
document.addEventListener("mousemove", drag);
document.addEventListener("touchmove", drag);

function drag(e) {
  if (!dragging) return;

  let x = e.touches ? e.touches[0].clientX : e.clientX;
  let dx = startX - x;

  let percent = Math.min(Math.max(dx / 300, 0), 1);
  let angle = percent * -180;

  pages[current].style.transform = `rotateY(${angle}deg)`;
}

/* ОТПУСТИЛ */
document.addEventListener("mouseup", endDrag);
document.addEventListener("touchend", endDrag);

function endDrag(e) {
  if (!dragging) return;
  dragging = false;

  let x = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
  let dx = startX - x;

  if (dx > 100) {
    /* перевернуть */
    pages[current].style.transform = "rotateY(-180deg)";
    current++;
    playSound();
  } else {
    /* вернуть назад */
    pages[current].style.transform = "rotateY(0deg)";
  }
}

/* ЗВУК */
function playSound() {
  let s = document.getElementById("sound");
  s.currentTime = 0;
  s.play();
}
</script>

</body>
</html>
