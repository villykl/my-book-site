<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Вера Климошенко — Книги</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin:0;
  font-family: Georgia, serif;
  background:#fdfbf7;
  color:#222;
}

.dark {
  background:#111;
  color:#eee;
}

.container {
  max-width:700px;
  margin:auto;
  padding:20px;
}

button {
  display:block;
  width:100%;
  margin:10px 0;
  padding:12px;
  font-size:18px;
}

.controls {
  position:fixed;
  bottom:10px;
  width:100%;
  display:flex;
  justify-content:space-around;
}

.controls button {
  width:auto;
}

p {
  font-size:20px;
  line-height:1.8;
}

/* автор */
.author {
  text-align:center;
  margin-top:40px;
}

.author img {
  width:150px;
  border-radius:50%;
}
</style>
</head>

<body>

<div class="container" id="app"></div>

<div class="controls">
  <button onclick="prev()">⬅️</button>
  <button onclick="toggleTheme()">🌙</button>
  <button onclick="next()">➡️</button>
</div>

<script>

/* СОСТОЯНИЕ */
let state = {
  screen: localStorage.getItem("screen") || "books",
  book: parseInt(localStorage.getItem("book")) || 0,
  page: parseInt(localStorage.getItem("page")) || 0
};

/* 🔥 ВСТАВЬ СЮДА СВОИ ТЕКСТЫ */
let texts = [

{
title: "Слова — это следы души",
content: `
А ты пойдёшь с нами, Господи?

Этот день я вспоминаю всегда, когда проезжаю по мосту.
Этот день навсегда остался в моей памяти.

Прямого поезда на Брест не было.
Поэтому нам нужно было торопиться.

Оставив вещи, мы поспешили в город.
Ранняя весна наполняла душу радостью.

Но вот электричка...
Господь идёт впереди нас.

И вдруг — ошибка...
Мы оказались не на том берегу.

Господи, что делать?
И вдруг мысль — идти по льду.

Первый шаг был самым трудным.
Сердце билось всё сильнее.

Мы шли по льду...
Каждый шаг был испытанием.

И вот берег...
Мы дошли.

Но чудо только начиналось...

Мы успели. Слава Богу.
`
},

{
title: "Вторая книга",
content: `
Здесь будет твой второй рассказ.

Просто вставь сюда длинный текст —
и он сам разобьётся на страницы.

Это уже уровень настоящей книги.
`
}

];

/* 🔥 АВТО РАЗБИЕНИЕ */
function splitText(text){
  let words = text.split(" ");
  let pages = [];
  let page = "";

  words.forEach(w=>{
    page += w + " ";
    if(page.length > 800){
      pages.push("<p>"+page+"</p>");
      page = "";
    }
  });

  if(page) pages.push("<p>"+page+"</p>");

  return pages;
}

/* ПРЕОБРАЗОВАНИЕ */
let books = texts.map(t=>{
  return {
    title: t.title,
    pages: splitText(t.content)
  };
});

/* МЕНЮ */
function showBooks(){
  app.innerHTML = "<h1>📚 Книги</h1>";

  books.forEach((b,i)=>{
    app.innerHTML += `<button onclick="openBook(${i})">${b.title}</button>`;
  });

  app.innerHTML += `
  <div class="author">
    <h3>Вера Климошенко</h3>
    <img src="https://i.postimg.cc/8z0t9b2T/author.jpg">
  </div>`;
}

/* ОТКРЫТЬ */
function openBook(i){
  state.book = i;
  state.page = 0;
  state.screen = "read";
  save();
  render();
}

/* РЕНДЕР */
function render(){

  if(state.screen === "books"){
    showBooks();
    return;
  }

  let page = books[state.book].pages[state.page];
  app.innerHTML = page;
}

/* НАВИГАЦИЯ */
function next(){
  if(state.screen !== "read") return;

  let b = books[state.book];

  if(state.page < b.pages.length-1){
    state.page++;
  }

  save();
  render();
}

function prev(){
  if(state.screen === "read"){
    if(state.page > 0){
      state.page--;
    } else {
      state.screen = "books";
    }
  }

  save();
  render();
}

/* СОХРАНЕНИЕ */
function save(){
  localStorage.setItem("screen", state.screen);
  localStorage.setItem("book", state.book);
  localStorage.setItem("page", state.page);
}

/* ТЕМА */
function toggleTheme(){
  document.body.classList.toggle("dark");
}

/* СТАРТ */
window.onload = render;

</script>

</body>
</html>
