<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Слова — это следы души</title>

<script src="https://unpkg.com/page-flip/dist/js/page-flip.browser.min.js"></script>

<style>
html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Georgia, serif;
}

/* 📱 iPad APP LAYER */
.app {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at center, #151515, #000);
}

/* 📖 BOOK STAGE */
#book {
    width: 980px;
    height: 640px;
    transform: scale(0.92);
    transition: 0.9s cubic-bezier(.2,.8,.2,1);
}

/* APP OPEN EFFECT */
body.ready #book {
    transform: scale(1);
}

/* 📄 PAGE */
.page {
    background: #fffdf7;
    padding: 60px;
    box-sizing: border-box;
    font-size: 20px;
    line-height: 1.7;
}

/* 📘 COVER */
.cover {
    background:
        linear-gradient(rgba(0,0,0,0.25), rgba(0,0,0,0.85)),
        url('https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?auto=format&fit=crop&w=1600&q=80')
        center/cover no-repeat;

    color: #f5e7d3;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.cover h1 {
    font-size: 46px;
    margin: 0;
}

/* soft depth */
.page::after {
    content: "";
    position: absolute;
    inset: 0;
    box-shadow: inset 0 0 40px rgba(0,0,0,0.05);
}
</style>
</head>

<body>

<div class="app">
    <div id="book">

        <div class="page cover">
            <h1>Слова — это следы души</h1>
            <p>Вера Климошенко</p>
        </div>

        <div class="page">
            <h2 style="text-align:center;">Вступление</h2>
            <p>Слова сопровождают нас всю жизнь...</p>
        </div>

        <div class="page">
            <h2 style="text-align:center;">Глава I</h2>
            <p>Каждое слово — это след души...</p>
        </div>

        <div class="page">
            <h2 style="text-align:center;">Глава II</h2>
            <p>Иногда слова становятся светом...</p>
        </div>

        <div class="page">
            <h2 style="text-align:center;">Эпилог</h2>
            <p>Всё сказанное остаётся...</p>
        </div>

    </div>
</div>

<script>
window.onload = function () {

    const book = new St.PageFlip(document.getElementById("book"), {

        width: 490,
        height: 640,

        size: "stretch",

        showCover: true,
        maxShadowOpacity: 0.75,

        flippingTime: 950,

        drawShadow: true,

        useMouseEvents: true,
        swipeDistance: 20,
        mobileScrollSupport: true
    });

    book.loadFromHTML(document.querySelectorAll(".page"));

    // 📱 iPad APP OPEN EFFECT
    setTimeout(() => {
        document.body.classList.add("ready");
    }, 400);
};
</script>

</body>
</html>
