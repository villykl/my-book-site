    Подошла электричка. Смотрим, наша! Молча влетаем в неё, говорить пока ни о чём не можем. Нет сил. К тому же слишком перегружено сознание. Внутри всё трепещет – ведь время в обрез… 
Подъезжаем к вокзалу. И хоть мы снова несёмся на огромной скорости, но нам казалось, что на противоположный берег электричка шла намного быстрее. И вот, наконец, нужная нам остановка. Электричка останавливается… Выбегаем на перрон. Быстро бежать мешают толпы народа…Смотрю на огромные вокзальные часы… У нас в запасе ещё две минуты… Ищу взглядом наш поезд. А вот он стоит на первом пути. Слава Богу! Успели… Напротив и наш вагон. На ступеньке стоит наш проводник, вижу, волнуется, протягивает мне руку. Поднимаюсь по ступенькам, и наш поезд помаленьку трогается… 
Но вот беда, Пети не видно… И где же это он потерялся? Что случилось? Смотрю во все глаза на толпы народа, но его не вижу…  – О, Боже, где это он? Знаю, что потеряться он никак не мог… И вдруг в огромной массе народа замечаю знакомое лицо. Слава Богу! Это точно он. Бежит, перепрыгивая через рельсы... Бежит быстро… Должен успеть… Вот он уже поравнялся с нашим вагоном. Ещё секунда – и он, как всегда, жизнерадостный, счастливый, улыбающийся, стоит на подножке нашего вагона, рядом со мной. В руках у него – газетный свёрток… И какой-то приятный, приятный запах чего-то вкусного разносится по тамбуру нашего вагона… Прошли в вагон, открыли своё купе. Сели за стол. В голове – сплошной гул. И, словно на экране, мелькают обрывочные кадры и отголоски совсем недавно пережитого. И даже с трудом верится, что эта страница жизни уже позади, что всё у нас в порядке.                   А когда пережитые трудности позади, то и вера становится намного крепче и богаче… Слава Тебе, Господи, что дела Твои велики и чудны! И что им нет ни конца, ни предела!
          И вот, миновав привокзальную площадь, набирая скорость и, отбивая на стыках ритм, наш поезд на всех парах всё дальше и дальше увозит нас от родного дома. Не сговариваясь, встали на колени, помолились. Нам было, что сказать Господу, было, за что Его благодарить. Ведь этот случай заметно укрепил нашу веру, и остался в памяти неизгладим, как ещё одна значительная историческая веха – веха нашего духовного мужания и взросления. И даже, спустя десятилетия, она, как святыня, как «Авен-Езер», до сих пор хранится в моём сердце и лежит на полке моей памяти.
         Встали с колен. Вспомнили, что с утра ничего не ели. С удовольствием смотрим на свёрток. Искушение слишком велико… Смотрю, Петя разворачивает свёрток, и перед нами лежит дюжина пышных румяных киевских чебуреков… Посмотрели друг на друга и улыбнулись. И только сейчас я вспомнила, как по дороге в Киев Петя говорил, что здесь, в столице, в каком-то ему одному известном киоске железнодорожного вокзала, продаются самые вкусные на всю Украину чебуреки…  
         Мы в дороге. Колёса мерно отсчитывают километры. За окном, стремительно сменяя друг друга, мелькают столбы, фонари, рекламные щиты и небольшие деревушки. 
                                                                          ***                
         Тихий золотистый вечер быстро сменили лиловые сумерки. Вдали виднеются седые гряды гор. Поля, покрытые белым снегом , лежат в жемчужном безмолвии. За окном, словно мелкий бисер, кружатся весёлые снежинки. Вдали мелькают сонные деревья. А в небе одна за другой вспыхивают янтарные звёздочки.    
      Но вот закат задёрнул штору дня и на смену насыщенному тревогой, волнениями и переживаниями дню пришла дружелюбная тишина… 
      Спасибо Тебе, Господи, что Ты в невероятных условиях выковываешь в нас твёрдость веры и шлифуешь, словно драгоценный камень для жертвенника. Спасибо Тебе, Господи, что Ты знаешь путь праведных (Пс.1:6). И за то, что Ты хранишь простодушных (Пс. 114:6). Помоги же мне жить так, чтобы горы моих проблем не затмили Твою славу, красоту и величие. Помоги так жить и верить, чтобы прожитая мною жизнь не прошла бесследно и чтобы не испытывать щемящей боли на закате жизни. Помоги жить для блага людей, чтобы мои дети, внуки и все, кто идёт следом за мною, росли, крепли и мужались верой в Тебя. И пусть каждый из них будет идти своей тропкой, но Ты устрой так, чтобы наши добрые примеры веры привели их к Тебе, вечному и любящему Богу, Который для искупленных детей Божьих является Путь, Истина и Жизнь.
                                                                            Вера Климошенко

`;

/* страницы */
function splitText(t){
  let words = t.split(" ");
  let pages=[],page="";
  words.forEach(w=>{
    page+=w+" ";
    if(page.length>900){
      pages.push(page);
      page="";
    }
  });
  if(page) pages.push(page);
  return pages;
}

let pages = splitText(text);

/* рендер */
function render(){

  app.style.fontSize = fontSize + "px";

  if(page === -1){
    app.innerHTML = `
    <h1 style="text-align:center;">Слова — это следы души</h1>
    <img class="cover" src="${COVER}">
    <h3 style="text-align:center;">Вера Климошенко</h3>
    `;
    return;
  }

  app.innerHTML = `<p>${pages[page]}</p>`;

  localStorage.setItem("page", page);
}

/* навигация */
function next(){
  if(page < pages.length-1){
    page++;
    render();
  }
}

function prev(){
  if(page > 0){
    page--;
  } else {
    page = -1;
  }
  render();
}

/* тема */
function toggleTheme(){
  document.body.classList.toggle("dark");
}

/* размер текста */
function fontPlus(){
  fontSize += 2;
  localStorage.setItem("font", fontSize);
  render();
}

function fontMinus(){
  fontSize -= 2;
  localStorage.setItem("font", fontSize);
  render();
}

/* свайп */
let startX = 0;

document.addEventListener("touchstart", e=>{
  startX = e.touches[0].clientX;
});

document.addEventListener("touchend", e=>{
  let endX = e.changedTouches[0].clientX;

  if(startX - endX > 50) next();
  if(endX - startX > 50) prev();
});

/* старт */
render();

</script>
