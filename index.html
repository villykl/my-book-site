<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Вера Климошенко — Слова это следы души</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Georgia, serif;
  background: #050505;
  color: #eee;
}

/* БРЕНД */
.brand {
  text-align: center;
  padding: 70px 20px 30px;
}

.brand h1 {
  font-size: 42px;
  letter-spacing: 4px;
  font-weight: normal;
}

.brand .subtitle {
  margin-top: 10px;
  font-size: 14px;
  opacity: 0.5;
}

.quote {
  margin-top: 25px;
  font-style: italic;
  opacity: 0.7;
}

/* ЛИНИЯ */
.line {
  width: 80px;
  height: 1px;
  background: white;
  margin: 25px auto;
  opacity: 0.3;
}

/* НАВИГАЦИЯ */
.nav {
  display: flex;
  justify-content: center;
  gap: 12px;
  padding: 10px;
}

.nav button {
  background: transparent;
  border: 1px solid #222;
  color: #aaa;
  padding: 10px 18px;
  border-radius: 20px;
  cursor: pointer;
  transition: 0.3s;
}

.nav button:hover {
  background: #111;
  color: white;
}

.nav button.active {
  color: white;
  border-color: white;
}

/* КОНТЕНТ */
.content {
  max-width: 720px;
  margin: auto;
  padding: 40px 20px;
  animation: fade 0.6s;
}

@keyframes fade {
  from {opacity: 0; transform: translateY(10px);}
  to {opacity: 1; transform: translateY(0);}
}

/* БЛОК */
.block {
  margin-bottom: 40px;
}

/* СТИХИ */
.poem {
  line-height: 1.9;
  font-style: italic;
  font-size: 17px;
  opacity: 0.9;
}

/* ТЕКСТ */
.text {
  line-height: 1.7;
  opacity: 0.85;
}

/* КНОПКИ */
button {
  font-family: inherit;
}
</style>
</head>

<body>

<div class="brand">
  <h1>Вера Климошенко</h1>
  <div class="subtitle">автор</div>
  <div class="line"></div>
  <div class="quote">«Слова — это следы души»</div>
</div>

<div class="nav">
  <button onclick="show('home')" class="active">Главная</button>
  <button onclick="show('poems')">Стихи</button>
  <button onclick="show('stories')">Рассказы</button>
  <button onclick="show('about')">О себе</button>
</div>

<div class="content" id="content"></div>

<script>
function show(section) {

  document.querySelectorAll(".nav button").forEach(b => b.classList.remove("active"));
  event.target.classList.add("active");

  let html = "";

  if (section === "home") {
    html = `
      <div class="block text">
        Здесь живут слова, которые невозможно удержать внутри.
        Это пространство чувств, тишины и внутреннего диалога.
      </div>
    `;
  }

  if (section === "poems") {
    html = `
      <div class="block poem">
      Тишина говорит со мной,<br>
      Словно ветер в пустом окне...<br><br>
      И я снова ищу покой,<br>
      Но он прячется где-то во мне.
      </div>

      <div class="block poem">
      Слова — это следы души,<br>
      Их нельзя стереть во тьме,<br>
      Они остаются внутри,<br>
      Даже когда нет меня.
      </div>
    `;
  }

  if (section === "stories") {
    html = `
      <div class="block text">
      Однажды ночью город замолчал.  
      И только редкие окна напоминали о том, что внутри каждого —
      целый мир, полный чувств.
      </div>
    `;
  }

  if (section === "about") {
    html = `
      <div class="block text">
      Я пишу о том, что сложно объяснить словами,
      но невозможно не почувствовать.
      </div>
    `;
  }

  document.getElementById("content").innerHTML = html;
}

window.onload = () => show("home");
</script>

</body>
</html>
